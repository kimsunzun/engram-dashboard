# Cargo workspace root (S12 phase 1). Static linking.
# 11 members: protocol (boundary contract) · base (bottom foundation layer — logging and general helpers, leaf crate, ADR-0175 · ADR-0269) ·
#   platform (OS layer — operational code that varies by OS, 0 workspace crate dependencies, ADR-0266 · ADR-0275) ·
#   agent (agent core, 0 Tauri imports — the old core, ADR-0175) · asset-library (the preset library — workspace
#   dependencies exactly agent · platform · command · base, ADR-0311) · command (command-bus tooling — 0 workspace
#   crate dependencies, 0 commands, ADR-0155) · messaging (messaging kernel — no workspace crate
#   dependencies, ADR-0110) ·
#   transport (reusable transport lib — 0 workspace crate dependencies, ADR-0177) ·
#   daemon (agent host + assembly room) · cli (control-plane CLI engram.exe — bin only, ADR-0273) ·
#   src-tauri (daemon client shell).
[workspace]
resolver = "2"
members = [
    "crates/engram-dashboard-protocol",
    # ADR-0175 decision 1 · ADR-0269: bottom foundation layer leaf crate (data file file · logging · general helpers text·time·path·sync·writable · test waiting testing). The three tenancy conditions (used or copied in several
    #   places now · 0 domain knowledge · tenants reference nothing of each other) are defined in the header of that crate's lib.rs.
    "crates/engram-dashboard-base",
    # ADR-0266 · ADR-0275: OS layer leaf crate (operational code that varies by OS — 0 workspace crate dependencies, and it does not
    #   depend on base either). The invariants and the isolation gate are defined in the header of that crate's lib.rs.
    "crates/engram-dashboard-platform",
    "crates/engram-dashboard-agent",
    # ADR-0311: the preset library (thin crate — the daemon only wires it). Its invariants and gates are defined in the header
    #   of that crate's lib.rs.
    "crates/engram-dashboard-asset-library",
    # ADR-0155: command-bus tooling lib (envelope · errors · declaration macros · table · routing). Declarations live next to their producers and this crate
    #   holds only the tooling — if even one command appears here, the central catalog comes back in through another door.
    "crates/engram-dashboard-command",
    # ADR-0110: messaging kernel lib (no workspace crate dependencies — fully mutually ignorant).
    "crates/engram-dashboard-messaging",
    # ADR-0177: reusable transport lib (0 workspace crate dependencies · the type seam is the `Wire` generic · transport/time are dyn).
    #   The isolation gates, including the zero-lines-of-tokio gate on the pure layers (machine·pending·stream), are defined in the
    #   header of that crate's lib.rs.
    "crates/engram-dashboard-transport",
    "crates/engram-dashboard-daemon",
    # ADR-0273: bin-only package that produces the control-plane CLI (engram.exe) — it does not depend on the daemon package.
    "crates/engram-dashboard-cli",
    "src-tauri",
]

# A profile can be placed only in the workspace root (in a member it is ignored with a warning). Moved from src-tauri.
[profile.release]
# panic is the default (unwind) — the contained sites (the three agent pumps · the input writer — ADR-0293) fold into a failure by unwinding,
# and a panic outside the containment mark is ended at once by the panic hook of the daemon and the shell (ADR-0292). Switching back to `panic = "abort"` makes
# a panic in a contained site terminate the process too — switching back is the emergency path of ADR-0292 decision 7, and then the descriptions of the contained sites found by `rg "ADR-0292" crates src-tauri/src`
# must be fixed as well (TRD S21-panic-policy §4-7).
codegen-units = 1
lto = true
opt-level = "s"
strip = true
