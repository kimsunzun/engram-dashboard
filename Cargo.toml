# Cargo workspace 루트 (S12 phase 1). 정적 링크.
# 멤버 11: protocol(경계 계약) · base(바닥 기반층 — 로깅·범용 도우미, 잎 crate, ADR-0175 · ADR-0269) ·
#   platform(OS 층 — OS 에 따라 달라지는 운영 코드, 워크스페이스 crate 의존 0, ADR-0266 · ADR-0275) ·
#   agent(에이전트 코어, Tauri import 0 — 옛 core, ADR-0175) · command(명령 버스 도구 — 워크스페이스
#   crate 의존 0·명령 0개, ADR-0155) · messaging(메시징 커널 — 워크스페이스 crate
#   무의존, ADR-0110) · net(네트워크 행 — WS·프레임 포트·단일 인스턴스·portfile, ADR-0129) ·
#   transport(재사용 전송 lib — 워크스페이스 crate 의존 0, ADR-0177) ·
#   daemon(에이전트 호스트 + 조립실) · cli(제어 평면 CLI engram.exe — bin 전용, ADR-0273) ·
#   src-tauri(데몬 클라이언트 셸).
[workspace]
resolver = "2"
members = [
    "crates/engram-dashboard-protocol",
    # ADR-0175 결정 1 · ADR-0269: 바닥 기반층 잎 crate(데이터 파일 file · 로깅 · 범용 도우미 text·time·path·sync·writable · 시험 대기 testing). 입주 조건 셋(지금 여러
    #   곳에서 쓰이거나 복사돼 있을 것 · 도메인 지식 0 · 입주자끼리 무참조)의 정본은 그 crate lib.rs 헤더다.
    "crates/engram-dashboard-base",
    # ADR-0266 · ADR-0275: OS 층 잎 crate(OS 에 따라 달라지는 운영 코드 — 워크스페이스 crate 의존 0, base 도
    #   의존하지 않는다). 불변식 · 격리 게이트의 정본은 그 crate lib.rs 헤더다.
    "crates/engram-dashboard-platform",
    "crates/engram-dashboard-agent",
    # ADR-0155: 명령 버스 도구 lib(봉투·오류·선언 매크로·표·라우팅). 선언은 생산자 옆에 살고 이 crate 는
    #   도구만 담는다 — 여기에 명령이 하나라도 생기면 중앙 카탈로그가 다른 문으로 돌아온다.
    "crates/engram-dashboard-command",
    # ADR-0110: 메시징 커널 lib(워크스페이스 crate 무의존 — 완전 상호무지).
    "crates/engram-dashboard-messaging",
    # ADR-0129 슬라이스 1: 네트워크 행 lib(에이전트 어휘를 타입으로도 모른다 — **단 auth 핸드셰이크의
    #   두 이름은 0-4 이월분으로 예외**). 그 crate lib.rs 헤더가 격리 게이트·예외 근거의 정본.
    "crates/engram-dashboard-net",
    # ADR-0177: 재사용 전송 lib(워크스페이스 crate 의존 0 · 타입 seam 은 `Wire` 제네릭 · 전송/시간은 dyn).
    #   ★기존 net 을 뜯지 않는다★ — 새로 세워 독립 검증한 뒤 단계별로 붙인다. 순수 층(machine·pending·
    #   stream)의 tokio 0줄 게이트를 포함해 격리 게이트의 정본은 그 crate lib.rs 헤더다.
    "crates/engram-dashboard-transport",
    "crates/engram-dashboard-daemon",
    # ADR-0273: 제어 평면 CLI(engram.exe)를 뽑는 bin 전용 패키지 — 데몬 패키지를 의존하지 않는다.
    "crates/engram-dashboard-cli",
    "src-tauri",
]

# profile 은 workspace 루트에만 둘 수 있다(멤버에 두면 무시+경고). src-tauri 에서 이동.
[profile.release]
panic = "abort"
codegen-units = 1
lto = true
opt-level = "s"
strip = true
