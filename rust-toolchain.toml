# Compiler pin — CI and local run on the same rustc.
# rustup reads this file to install and select automatically, so the version is not written again in CI (written in two places, they drift apart).
# 1.95.0 = the version this workspace was measured on.
# With profile = "minimal", rustfmt is not included by default → it is listed explicitly for the `cargo fmt --check` gate.
[toolchain]
channel = "1.95.0"
profile = "minimal"
components = ["rustfmt"]
