[package]
name = "engram-dashboard-base"
version = "0.1.0"
edition = "2021"
description = "Engram Dashboard 바닥 기반층 — 데이터 파일 읽기 판정(버전·손상)·쓰기 판정·상한 읽기·원자 쓰기·손상 사본·임시 쓸기(file — OS 몫은 부르는 쪽이 넘긴다) · tracing 전역 초기화·파일 로그(logging) · 범용 도우미(text · time — epoch 밀리초와 「지금 읽기」 시계 seam · path · sync · writable — 폴더 쓰기 프로브) · 패닉 가둠 표시와 훅 몸통(panic) · 시험 대기(testing)와 가짜 시계(time::ManualClock) — 시험 둘은 test-support 기능 뒤. 잎 crate: 워크스페이스 crate 의존 0, 도메인 지식 0. 입주 조건은 lib.rs 헤더가 정본(ADR-0175 · ADR-0269 결정 7)."

# ★test-support (ADR-0275 decision 5)★: opens the test-helper module (`testing`) and the hand-driven clock (`ManualClock`
#   inside `time`). Default OFF — consumer crates enable it only in dev-dependencies (precedent =
#   the same-named feature of `engram-dashboard-command` · `engram-dashboard-transport`).
#   A CI gate measures that the daemon and shell operational graphs do not have this feature (`.github/workflows/ci.yml`).
[features]
test-support = []

# ★Do not list a workspace crate here★ — tenancy condition ② (0 domain knowledge) is embodied by this empty spot.
#   Machine enforcement = the dependency-ceiling gate in the lib.rs header (it reads the resolved dependency graph).
[dependencies]
# The Bearer/API key patterns that `mask_secrets` in logging bites on.
regex = "1.11"
# ADR-0291 decision 3: the read decision in file looks at a JSON document (the object handed to the version-key · owner-shape checks). Struct ↔ JSON
#   serialization (serde derive) is still each owner's job, so serde is not a direct dependency.
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# ★Do not revive the `windows` dependency★ — operational code that varies by OS goes not to base but to the OS layer crate
#   `engram-dashboard-platform` (ADR-0266 decisions 2 · 4 · tenancy boundary = lib.rs header).
