[package]
name = "engram-dashboard-core"
version = "0.1.0"
edition = "2021"
description = "Engram Dashboard 에이전트 코어 — AgentManager·OutputCore·AgentTransport·backend·persistence·logging. Tauri import 0(headless)."

# ★test-harness (ADR-0088 / ADR-0012)★: 하네스 전용 세션 주입 seam(`AgentManager::insert_test_session`)을
#   여는 기능 플래그. 기본 OFF — 운영(production) 빌드는 이 seam 을 컴파일하지 않는다(임의 AgentSession
#   주입으로 spawn 예약·profile+epoch 조율·control-token·pump/reaper 배선을 우회하는 것 차단). daemon
#   통합 테스트가 cross-crate 로 seam 을 봐야 하므로 dev-dependency 에서만 이 기능을 켠다(아래 daemon
#   Cargo.toml [dev-dependencies]) → 기능 요청이 dev 그래프에만 있어 운영 daemon 바이너리엔 유니피케이션되지
#   않는다. core 자체 in-crate 테스트는 이 seam 을 쓰지 않으므로 plain `cargo test -p ...-core` 도 무영향.
[features]
test-harness = []

# src-tauri 에서 그대로 이동한 모듈(pty/persistence/logging). 의존성도 동일하게 옮김.
# Embedded(src-tauri)와 미래 daemon(별도 bin)이 공통으로 의존하는 lib.
[dependencies]
# ★이 crate 의 유일한 워크스페이스 의존이다(ADR-0140)★: `agent.*` 를 선언하려면 도구가 필요한데,
#   그것을 protocol 에서 받으면 코어가 wire 타입까지 보게 된다. 도구 crate 가 그 유입을 막는다 —
#   **protocol 을 여기 추가하지 말 것**.
engram-dashboard-command = { path = "../engram-dashboard-command" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
regex = "1.11"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
dunce = "1.0"
ts-rs = "10"   # 선언 매크로가 인자·반환 struct 에 TS derive 를 단다(파생물 = bindings/, TRD §2-4 ①)

# 하네스 전용 실행기(`engram_dashboard_command::testing::block_on`)를 테스트 빌드에서만 켠다 —
#   기능 요청이 dev 그래프에만 있어 운영 바이너리엔 유니피케이션되지 않는다.
[dev-dependencies]
engram-dashboard-command = { path = "../engram-dashboard-command", features = ["test-support"] }

[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_System_JobObjects",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
    "Win32_System_Diagnostics_ToolHelp", # child_pids: 프로세스 트리 열거(실프로세스 격리테스트용)
] }
