[package]
name = "engram-dashboard-protocol"
version = "0.1.0"
edition = "2021"
description = "Engram Dashboard 경계 계약 — 클↔데몬 wire 프로토콜. Tauri import 금지(linchpin)."

[dependencies]
# ★No workspace crate goes here★ — ADR-0272 「영향」 invariant; the wall is the `ci.yml` step `protocol gate 1`.
serde = { version = "1", features = ["derive"] }
# discovery::DaemonInfo (the shared daemon.json contract) · the free-JSON fields of the activation replies ·
# `raw_value` = the command slots' raw text (ADR-0272 decision 3)
serde_json = { version = "1", features = ["raw_value"] }
serde_bytes = "0.11"   # OutputChunk::TerminalBytes — Vec<u8> 를 number[] 아닌 바이트로(JSON 경로용)
uuid = { version = "1", features = ["v4", "serde"] }
ts-rs = { version = "10", features = ["uuid-impl"] }   # Rust→TS 타입 생성(결정 #2). uuid→string 매핑.
