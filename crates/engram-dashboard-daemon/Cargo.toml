[package]
name = "engram-dashboard-daemon"
version = "0.1.0"
edition = "2021"
description = "Engram Dashboard 데몬 — AgentManager 소유(에이전트 호스트) + 제어 평면(MCP·ingress·프라이밍) + 메시징 접합 + 조립실(ADR-0129 슬라이스 1)."

# 라이브러리 표면. main(bin)과 격리 하네스(tests/ws_e2e.rs)가 같은 기동 흐름(run / start_test_server)을
# 공유하도록 서버 조립·accept loop 를 lib 로 모았다. crate 이름 underscore 는 Rust path 규약.
[lib]
name = "engram_dashboard_daemon"
path = "src/lib.rs"

# ★test-harness (ADR-0088 Stage 1)★: handle_send 의 결정적 mid-flight epoch race 재현용 yield-seam
#   (resolve↔write 갭에서 발화하는 test hook)을 여는 기능 플래그. 기본 OFF — 운영(production) 빌드는
#   이 hook 을 **아예 컴파일하지 않는다**(feature OFF = handle_send 동작이 오늘과 byte-identical). core 의
#   같은-이름 기능도 함께 켜 `insert_test_session` seam 을 딸려 연다. 통합 테스트에서 켜는 방식 =
#   아래 [dev-dependencies] 의 self-dev-dependency(자기 crate 를 features=["test-harness"] 로 재선언) —
#   그러면 `cargo test -p engram-dashboard-daemon` 이 별도 --features 플래그 없이 hook 을 컴파일하고,
#   운영 dep 그래프(무-feature)엔 유니피케이션되지 않는다.
[features]
test-harness = [
    "engram-dashboard-core/test-harness",
    # ADR-0110: 메시징 커널이 자체 선언한 같은-이름 기능(하네스 seam)으로 전이한다.
    "engram-dashboard-messaging/test-harness",
]

# 데몬 실행 진입점. AgentManager 를 daemon 프로세스가 소유하고, src-tauri(Embedded)와
# 같은 core/protocol 을 공유한다. lib 의 run() 만 호출하는 thin entry.
[[bin]]
name = "engram-dashboard-daemon"
path = "src/main.rs"

# ADR-0086 스텝 2 · ADR-0132: 제어 평면 CLI. 스폰된 에이전트가 셸로 부르는 최소 클라이언트 —
# env(ENGRAM_TOKEN/ENGRAM_CONTROL_URL)를 읽어 데몬 제어 라우트로 POST 한다. 의존성 최소화(std TcpStream
# 손조립 HTTP). ★bin 이름 = core 의 `CLI_EXE_NAME`★ — grant·프라이밍·PATH 해석이 이 이름에 정렬된다
# (ADR-0094). 여기서 이름을 바꾸면 그 상수도 함께 바꿔야 하고, 어긋나면 우편이 조용히 멈춘다.
[[bin]]
name = "engram"
path = "src/bin/engram.rs"

# ★ADR-0090 Stage 2 파일럿 실험 드라이버★: 실 claude 를 스폰해 컨텍스트 포화·주입·프로브를 실측하고
#   JSONL 로 영속하는 실험 전용 bin. required-features 로 **운영/릴리즈 빌드가 절대 컴파일하지 않게**
#   막는다 — 실험 코드가 릴리즈 아티팩트에 유입되면 ADR-0090 위반(위 [dev-dependencies] 의 --all-targets
#   경고와 같은 계열). 통상 `cargo build` 는 이 bin 을 건너뛰고, 오직
#   `cargo build --features test-harness --bin saturation-pilot` 로만 만들어진다.
[[bin]]
name = "saturation-pilot"
path = "src/bin/saturation_pilot.rs"
required-features = ["test-harness"]

# ★ADR-0092 프라이밍 수용 baseline 스모크 드라이버★: 실 primed claude 1개를 스폰하고 자연스러운 1:1
#   메시지를 실 control 경로(handle_send)로 보낸 뒤 응답을 PRINT 한다(수용 판정용 — pass/fail 단언 아님).
#   required-features 로 릴리즈 빌드가 컴파일하지 않게 막는다(실험/검증 전용, saturation-pilot 과 동일 계열).
[[bin]]
name = "priming-smoke"
path = "src/bin/priming_smoke.rs"
required-features = ["test-harness"]

# ★ADR-0092/0099 A→B→A 왕복(reply round-trip) 실측 드라이버★: 실 primed claude 2개(A·B)를 스폰해 B 가 발신
#   절반(MCP send_message OR `engram mail send` CLI)을 스스로 호출하고 A 가 답신을 수용하는지 실측한다. 프라이밍은
#   `--priming <경로>`(예: prompts/agent-priming-cli.md)로, CLI-only false-path 는 `--cli-only`(provision
#   강제 비-MCP)로 파라미터화한다(옛 C1~C3 실험 별칭은 ADR-0099 로 제거). required-features 로 릴리즈 빌드가
#   컴파일하지 않게 막는다(실험/검증 전용, priming-smoke·saturation-pilot 과 동일 계열).
[[bin]]
name = "roundtrip-smoke"
path = "src/bin/roundtrip_smoke.rs"
required-features = ["test-harness"]

# ★ADR-0125 동기 드레인 지연 실측 드라이버(spec §7 수용 기준 ⑤·⑧)★: 발송 호출이 자기 턴에 떠안는
#   드레인 비용을 결정적 seam 수신자(실 claude 불요)로 재서 PRINT 한다 — **타이밍 단언 없음**(spec 이
#   ⑤·⑧ 양쪽에서 임계값 고정을 금지한다). 회귀 스위트에 넣지 않는 이유도 같다(시간 측정은 flaky).
#   required-features 로 릴리즈 빌드가 컴파일하지 않게 막는다(saturation-pilot 계열과 동일).
[[bin]]
name = "drain-latency"
path = "src/bin/drain_latency.rs"
required-features = ["test-harness"]

[dependencies]
engram-dashboard-core = { path = "../engram-dashboard-core" }
engram-dashboard-protocol = { path = "../engram-dashboard-protocol" }
# data_dir 단일 출처(ADR-0024) — embedded·daemon 이 같은 default_data_dir() 을 보게(순환 없음).
engram-dashboard-discovery = { path = "../engram-dashboard-discovery" }
# ADR-0110: 메시징 커널(lib). 이 crate 는 워크스페이스 crate 무의존 — 접합은 전부 포트 trait 이고
#   실물 어댑터는 데몬 `src/messaging_host.rs` 가 소유한다.
engram-dashboard-messaging = { path = "../engram-dashboard-messaging" }
# ADR-0129 슬라이스 1: 네트워크 행 lib(WS 서버·불투명 프레임 포트·단일 인스턴스 가드·portfile). 이 방향
#   (daemon → net)만 존재한다 — net 은 데몬을 타입으로도 모르고, 두 행은 그 crate 가 소유한 포트 trait
#   (`frame_port`)으로만 만난다. 데몬은 그 포트에 실물을 꽂는 쪽(`agent_conn`)이자 조립실이다.
#   ★`features = ["server"]` 를 지우지 말 것★: net 의 기본 feature 는 비어 있어 `auth` 만 나온다. 서버 행
#   (`ws`·`frame_port`·`instance`·`portfile`)을 쓰는 것은 이 crate 뿐이고, 그것을 켜는 자리가 여기다.
#   근거(왜 기본을 비웠나)는 그 crate `Cargo.toml` 의 `[features]` 주석이 정본이다.
engram-dashboard-net = { path = "../engram-dashboard-net", features = ["server"] }
# ADR-0140: 명령 버스 도구(봉투·오류·선언 매크로·표·라우팅). 이 crate 는 도구를 **표 조립에만** 쓴다 —
#   자기 명령을 선언하지 않으므로 `ts-rs` 는 넣지 않는다(선언 crate 만 바인딩을 낸다).
engram-dashboard-command = { path = "../engram-dashboard-command" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# ★ADR-0129 슬라이스 1 — `tokio-tungstenite` 를 [dev-dependencies] 로 내렸다★: 이 crate 운영 코드의
#   사용은 **0**이고(WS 서버는 네트워크 crate 몫) 남은 사용처는 하네스 하나(`tests/ws_e2e.rs` 가 WS
#   **클라이언트**로 붙어 조립을 구동)다. **다시 [dependencies] 로 올리지 말 것.**
#   ★작동 기준은 "의존 그래프에 있나" 가 **아니라 "이 매니페스트가 직접 선언했나" 다★: `cargo tree -p
#   engram-dashboard-daemon -e normal` 은 net 을 거쳐 여전히 `tokio-tungstenite` 를 보여준다 — 그 출력으로
#   판단하면 정반대 결론이 난다. 실제 벽은 Rust 2018 의 extern prelude 가 **직접 선언한 의존만** 받아
#   들인다는 것이라, 직접 선언이 없으면 운영 소스의 `use tokio_tungstenite::…` 는 **그 crate 가 스코프에
#   없어 컴파일되지 않는다**. 그래서 새 데몬 소스가 에이전트 행 안에 WS 서버를 되키우는 부식(ADR-0129 가
#   기각한 대안 2 "문서·리뷰로 경계 유지" 가 실제로 밟은 경로)이 컴파일 단계에서 막힌다.
#   ★벽이 서는 축은 코드의 test-ness 도, 명령 이름도 아니라 **컴파일 대상(target)** 이다★: dev-dependency 가
#   extern prelude 에 들어오는 것은 lib 이 `--cfg test` **유닛테스트 타깃**으로 빌드될 때뿐이다. 그냥 lib
#   타깃(통합테스트·bin·doctest 가 링크하는 그것)에는 들어오지 않으므로, `cargo test` 로 돌려도 그 타깃을
#   빌드하는 순간 `src/` 비-테스트 코드의 `use` 는 여전히 깨진다 — **실측**(최소 2-crate 워크스페이스에서
#   `cargo test -p b` → `error[E0433]`). 이 데몬은 `tests/ws_e2e.rs` 와 bin 을 둘 다 가지므로 그대로 해당된다.
# 운영 코드에서는 포트 trait 시그니처의 `future::BoxFuture` 때문에 쓴다(async fn in trait 이 dyn
#   비호환이라 수동 박싱). ★WS read/write split(SplitSink/StreamExt/SinkExt) 계열은 이제 이 crate 운영
#   소스에 **사용 0** 이다★ — 네트워크 crate 몫으로 갔다(그 0 이 깨지면 위 tokio-tungstenite 주석의 부식
#   경고를 함께 읽을 것). 하네스(`tests/`)는 WS 클라이언트라 더 넓게 쓴다 — 정확한 사용처는
#   `rg "futures_util|SinkExt|StreamExt" src/ tests/` 로 볼 것(여기 열거하지 않는다).
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
# 토큰 난수: 256-bit(32B) → hex 64자. rand 대신 getrandom — 의존 가벼움(OS CSPRNG 직접).
getrandom = "0.2"
# 출력 sink 의 sink_id 생성 + AgentId 파싱. core/protocol 과 동일 1.x(AgentId=Uuid).
uuid = { version = "1", features = ["v4"] }

# ── ADR-0086: 제어 채널 MCP 입구 ────────────────────────────────────────────────
# rmcp = 공식 Rust MCP SDK. Streamable HTTP 서버 role(StreamableHttpService = Tower service, axum 에 nest).
#   server/macros(#[tool]/#[tool_router]/#[tool_handler]) + schemars(툴 input schema) + streamable-http-server.
#   ★OAuth 메타데이터 미광고★: StreamableHttpService 는 `.well-known` 라우트를 만들지 않는다 — claude 가
#   정적 Bearer 를 무시하는 #59467 조건을 원천 회피(초기화 실측 근거는 ADR-0086 §근거).
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
# axum = MCP 라우터 호스트(rmcp 가 axum 0.8 겨냥). 로컬 평문 HTTP — TLS 불필요.
#   json = /control/send 핸들러의 Json extractor/응답(ADR-0086 스텝 2 CLI 입구).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
# tower = MCP /mcp 라우트에 bearer auth 미들웨어를 얹는 layer 조립(공식 auth 패턴).
tower = "0.5"
# tower-http(limit) = RequestBodyLimitLayer — axum DefaultBodyLimit 는 extractor 만 제한하나
#   rmcp StreamableHttpService 는 raw body 를 직접 소비하므로(extractor 미경유) 그 상한이 안 먹힌다.
#   이 레이어는 body 자체를 감싸 하위 소비자 전부에 상한을 강제한다(round-2 F4). limit feature 만.
tower-http = { version = "0.6", default-features = false, features = ["limit"] }
# CancellationToken(StreamableHttpServerConfig) + graceful shutdown 신호.
tokio-util = { version = "0.7", features = ["rt"] }
# http = axum 미들웨어에서 StatusCode/HeaderMap 직접 조작(rmcp 와 동일 1.x wire 타입).
http = "1"

# ★ADR-0129 슬라이스 1 — `windows` 직접 의존을 제거했다★: 이 crate 의 유일한 소비자가 단일 인스턴스
#   가드(`instance.rs`)였고 그게 네트워크 crate 로 갔다. 지금 이 crate 의 `windows::` 사용은
#   **0**이다(pid liveness 는 원래 core 의 `agent::platform` 몫이었다 — 옛 주석의 "pid liveness(OpenProcess)"
#   는 이 crate 에서 참인 적이 없다). ★`#[cfg(windows)]`·`windows_subsystem` 은 crate 사용이 **아니다**★ —
#   토큰만 보고 "아직 쓰네" 로 되돌리지 말 것. Job Object 등으로 Win32 를 다시 직접 쓸 일이 생기면 그때
#   근거와 함께 새로 넣는다(core 와 같은 0.58 핀).

# ── ADR-0086 통합 테스트 전용(dev) ─────────────────────────────────────────────
[dev-dependencies]
# ★ADR-0129 슬라이스 1★: WS 스택은 하네스 전용이다 — `tests/ws_e2e.rs` 가 WS **클라이언트**가 되어
#   in-process 로 띄운 조립(`start_test_server*`)에 붙는다. 운영 코드 사용 0(위 [dependencies] 의 주석이
#   왜 여기 있어야 하는지의 정본). 네트워크 crate 와 같은 0.26 핀 — 하네스와 서버가 같은 wire 구현을 봐야
#   한다.
tokio-tungstenite = "0.26"
# ★ADR-0088 self-dev-dependency 트릭★: 자기 crate(daemon lib)를 features=["test-harness"] 로 dev 그래프에
#   재선언한다 → `cargo test -p engram-dashboard-daemon` 이 lib 을 그 feature 로 컴파일해 handle_send 의
#   yield-seam hook 을 별도 --features 플래그 없이 켠다. dev 그래프에만 있으므로 운영 daemon 바이너리
#   (위 [dependencies] 무-feature)엔 유니피케이션되지 않는다 — 운영 빌드엔 hook 이 존재하지 않는다(no-leak).
#   daemon test-harness 는 core 의 test-harness 로 전이(forward)되므로 `insert_test_session` seam 도 함께
#   열린다(아래 core 재선언은 명시적 backup — daemon feature 미경유 경로에서도 seam 이 켜지게).
# ★운영 빌드 주의(feature 유니피케이션)★: cargo 는 한 번의 호출 안에서 같은 crate 의 feature 를
#   **합집합**한다. 그래서 `cargo build --release --all-targets` 처럼 lib 과 (dev-dependency 를 끌어오는)
#   test/bench 타깃을 **한 호출**로 빌드하면, 이 self-dev-dependency 의 `test-harness` 가 공유 lib 빌드에
#   유니피케이션돼 **그 호출로 나온 daemon 바이너리에 yield-seam hook 이 박힌다**. 통상 운영 경로
#   (`cargo build [--release]`, tauri 번들링)는 dev-dependency 를 안 끌어오므로 무해하다.
#   ▶ 규칙: 배포용 릴리스 바이너리는 `--all-targets` 로 만들지 않는다(core 의 test-harness dev-dep 도 동일
#     위험군 — 여기서 문서화만, 재설계 아님).
engram-dashboard-daemon = { path = ".", features = ["test-harness"] }
# ★ADR-0088 배달 관측 seam★: 통합 테스트가 `AgentManager::insert_test_session`(하네스 전용 세션 주입
#   seam)을 cross-crate 로 쓰려면 core 의 `test-harness` 기능을 켜야 한다. dev-dependency 로만 켜므로
#   운영 daemon 바이너리 의존 그래프(위 [dependencies] 의 무-feature core)엔 유니피케이션되지 않는다 —
#   운영 빌드는 seam 을 컴파일하지 않는다(no-leak). (feature-only dev-dep 재선언 — path 는 위와 동일 crate.)
engram-dashboard-core = { path = "../engram-dashboard-core", features = ["test-harness"] }
# ★ADR-0110★: 같은 계열 — 데몬 테스트가 메시징 커널의 하네스 seam(`MessagingService::contract_outcome_for_test`
#   — connection_core 의 삭제 정리 테스트가 계약 **종결 사유**를 본다)을 cross-crate 로 쓰므로 dev 그래프
#   에서만 그 기능을 켠다(운영 daemon 바이너리엔 미유니피케이션).
engram-dashboard-messaging = { path = "../engram-dashboard-messaging", features = ["test-harness"] }
# 같은 계열(feature-only 재선언) — 데몬 표 하네스가 도구 crate 의 실행기
#   (`engram_dashboard_command::testing::block_on`)로 핸들러 future 를 돌린다. dev 그래프에만 있으므로
#   운영 daemon 바이너리엔 유니피케이션되지 않는다.
engram-dashboard-command = { path = "../engram-dashboard-command", features = ["test-support"] }
# 401 검증(무/오/stale 토큰)용 raw HTTP — rustls 로 platform-verifier 부담 없이(로컬 평문 http) 가볍게.
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# happy-path handshake(initialize + tools/list + tools/call)는 rmcp 클라이언트 role 로 정직하게 검증.
rmcp = { version = "2.2.0", features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
