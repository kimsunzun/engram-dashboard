[package]
name = "engram-dashboard-daemon"
version = "0.4.0"
edition = "2021"
description = "Engram Dashboard 데몬 — AgentManager 소유(에이전트 호스트) + 제어 평면(MCP·ingress·프라이밍) + 메시징 접합 + 조립실(ADR-0129 슬라이스 1)."

# Library surface. The server assembly and accept loop are gathered into the lib so that main (bin) and the
# isolation harness (tests/ws_e2e.rs) share the same startup flow (run / start_test_server). The underscore in the crate name is the Rust path convention.
[lib]
name = "engram_dashboard_daemon"
path = "src/lib.rs"

# ★test-harness (ADR-0088 Stage 1)★: a feature flag that opens the yield-seam for reproducing handle_send's deterministic
#   mid-flight epoch race (a test hook that fires in the resolve↔write gap). Default OFF — production builds
#   **do not compile this hook at all** (feature OFF = handle_send behaves byte-identically to today). It also turns on
#   the same-named feature of agent, which opens the `insert_test_session` seam along with it. How integration tests turn it on =
#   the self-dev-dependency under [dev-dependencies] below (redeclaring this crate with features = ["test-harness", "test-support"]) —
#   then `cargo test -p engram-dashboard-daemon` compiles the hook without a separate --features flag,
#   and it is not unified into the production dependency graph (no features).
[features]
test-harness = [
    "engram-dashboard-agent/test-harness",
    # ADR-0110: forwards to the same-named feature (harness seam) that the messaging kernel declares itself.
    "engram-dashboard-messaging/test-harness",
]
# A feature that opens the in-process test server (`start_test_server*` · `TestServerHandle`). Default OFF, so production builds do not
#   have those functions. ★It must stay empty★ — it does not turn on features of other crates. Using the `test-harness` above instead would
#   also turn on the seams inside the production code of daemon · agent · messaging in shell test builds. The only place that turns it on is the dev dependency (the
#   self-dev-dependency below). ★Do not put it in `default`★ — there is no CI gate dedicated to this feature: the ways for a current member to depend on the daemon in
#   production are blocked by other gates · the dependency cycle, and the paths left unblocked are `default` and a new package that depends on the daemon in production.
# ADR-0286
test-support = []

# Daemon entry point. The daemon process owns the AgentManager and shares the same agent/protocol
# as src-tauri (Embedded). A thin entry that only calls the lib's run().
[[bin]]
name = "engram-dashboard-daemon"
path = "src/main.rs"

# ★ADR-0090 Stage 2 pilot experiment driver★: an experiment-only bin that spawns a real claude, measures context saturation · injection · probes,
#   and persists them as JSONL. required-features **keeps production/release builds from ever compiling it** —
#   experiment code leaking into a release artifact violates ADR-0090 (same family as the --all-targets warning
#   under [dev-dependencies] above). A normal `cargo build` skips this bin; it is built only with
#   `cargo build --features test-harness --bin saturation-pilot`.
[[bin]]
name = "saturation-pilot"
path = "src/bin/saturation_pilot.rs"
required-features = ["test-harness"]

# ★ADR-0092 priming acceptance baseline smoke driver★: spawns one real primed claude, sends a natural 1:1
#   message through the real control path (handle_send), then PRINTs the response (for the acceptance decision — not a pass/fail assertion).
#   required-features keeps release builds from compiling it (experiment/verification only, same family as saturation-pilot).
[[bin]]
name = "priming-smoke"
path = "src/bin/priming_smoke.rs"
required-features = ["test-harness"]

# ★ADR-0092/0099 A→B→A round-trip (reply round-trip) measurement driver★: spawns two real primed claudes (A·B) and measures whether B calls the sending
#   half (MCP eg_send) on its own and A accepts the reply. Priming is parameterized with
#   `--priming <경로>` (e.g. prompts/agent-priming.md) (the old C1~C3 experiment aliases were removed by ADR-0099 ·
#   `--cli-only`, which forced the CLI false-path, was removed together with the CLI-mirror priming). required-features keeps release builds from
#   compiling it (experiment/verification only, same family as priming-smoke · saturation-pilot).
[[bin]]
name = "roundtrip-smoke"
path = "src/bin/roundtrip_smoke.rs"
required-features = ["test-harness"]

# ★ADR-0125 synchronous drain latency measurement driver (spec §7 acceptance criteria ⑤·⑧)★: measures the drain cost that a send call
#   takes on in its own turn, with a deterministic seam receiver (no real claude needed), and PRINTs it — **no timing assertions** (the spec forbids
#   fixing a threshold on both ⑤ and ⑧). That is also why it is not in the regression suite (time measurement is flaky).
#   required-features keeps release builds from compiling it (same family as saturation-pilot).
[[bin]]
name = "drain-latency"
path = "src/bin/drain_latency.rs"
required-features = ["test-harness"]

[dependencies]
engram-dashboard-agent = { path = "../engram-dashboard-agent" }
# ADR-0175 decision 1: file-log initialization (`logging`).
#   It was already linked through agent, so it is no new burden — only the direct edge is added. The hex notation of tokens · hashes
#   (`text::hex_lower` — ADR-0269), reclaiming lock poisoning (`sync::lock` etc. — ADR-0275), and the write probe of the
#   data-folder writability check (`writable` — `data_dir`, ADR-0282) also come from here.
engram-dashboard-base = { path = "../engram-dashboard-base" }
# ADR-0266: OS layer — the process's own start time to stamp into daemon.json (`process::current_process_start_time`), the path of the
#   control-plane CLI sibling exe (`env::sibling_exe` — `locate_send_exe` · harness `roundtrip-smoke` · ADR-0282), and the file name carried in the
#   warning when it is not found (`env::exe_file_name` — `locate_send_exe`). Tests also use the default
#   shell (`shell::default_shell`). It is already linked through agent, so it is no new burden — only the direct edge is added.
#   `portfile`'s stale decision uses `process::pid_alive_with_start_time`, and `instance`'s single-instance guard uses the
#   shared-restricted open `fs::open_deny_write` and its failure classifiers `fs::is_sharing_violation` · `fs::is_access_denied`.
engram-dashboard-platform = { path = "../engram-dashboard-platform" }
engram-dashboard-protocol = { path = "../engram-dashboard-protocol" }
# ADR-0110: messaging kernel (lib). This crate has no workspace-crate dependency — every junction is a port trait, and
#   the real adapters are owned by the daemon's `src/messaging_host.rs`.
engram-dashboard-messaging = { path = "../engram-dashboard-messaging" }
# ADR-0310 (TRD S21 trd-3 §6-3 U4): the reusable transport — the daemon's accepting side (`src/link/`) runs on its
#   registry, accepted-peer supervisors and real-socket listener (`ws`). The test harness (`test-support`) is not turned on:
#   the adapter's tests drive it over synthetic inbox items and a real loopback listener.
engram-dashboard-transport = { path = "../engram-dashboard-transport", features = ["ws"] }
# ADR-0155: command bus tools (envelope · error · declaration macro · table · routing). This crate uses the tools **only for table assembly** —
#   it does not declare its own commands, so `ts-rs` is not added (only the declaring crate emits bindings).
engram-dashboard-command = { path = "../engram-dashboard-command" }

tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# ★ADR-0129 slice 1 — `tokio-tungstenite` was moved down to [dev-dependencies]★: its use in this crate's production code
#   is **0** (the WS server belongs to the transport crate), and the only remaining use is the harness (`tests/ws_e2e.rs` attaches as a WS
#   **client** and drives the assembly). **Do not move it back up to [dependencies].**
#   ★The working criterion is **not** "is it in the dependency graph" but "did this manifest declare it directly"★: `cargo tree -p
#   engram-dashboard-daemon -e normal` still shows `tokio-tungstenite` through transport — judging by that output
#   gives the opposite conclusion. The real wall is that Rust 2018's extern prelude takes in **only directly declared dependencies**,
#   so without a direct declaration the `use tokio_tungstenite::…` in production source **does not compile because
#   that crate is not in scope**. That is how the rot of new daemon source growing a WS server back inside the agent layer (the path actually trodden by
#   ADR-0129's rejected alternative 2, "keep the boundary by docs · review") is stopped at the compile stage.
#   ★The axis the wall stands on is neither the test-ness of the code nor the command name but the **compile target**★: a dev-dependency
#   enters the extern prelude only when the lib is built as the `--cfg test` **unit-test target**. It does not enter the plain lib
#   target (the one that integration tests · bins · doctests link), so even when run with `cargo test`, the moment that target is
#   built the `use` in the non-test code under `src/` still breaks — **measured** (in a minimal 2-crate workspace
#   `cargo test -p b` → `error[E0433]`). This daemon has both `tests/ws_e2e.rs` and a bin, so it applies as is.
# In production code it is used for `future::BoxFuture` in the port trait signature (async fn in trait is not dyn
#   compatible, so boxing is manual), and `StreamExt` on the transport inbox (`src/link/server.rs` — not a socket).
#   ★The WS write half (SplitSink/SinkExt) has **0 uses** in this crate's production source★ — the socket is the transport
#   crate's (if that 0 breaks, also read the rot warning in the tokio-tungstenite comment above). The harness (`tests/` and
#   the `link` unit tests) is a WS client, so it uses more — see the exact uses with
#   `rg "futures_util|SinkExt|StreamExt" src/ tests/` (not listed here).
futures-util = "0.3"
serde = { version = "1", features = ["derive"] }
# `raw_value` = the tail end that unpacks and re-wraps the raw text of the command field (ADR-0272 decision 4) — protocol already turns it on in the same build.
serde_json = { version = "1", features = ["raw_value"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
thiserror = "1"
# Token randomness: 256-bit (32B) → 64 hex chars. getrandom instead of rand — lighter dependency (OS CSPRNG directly).
getrandom = "0.2"
# sink_id generation for output sinks + AgentId parsing. Same 1.x as agent/protocol (AgentId=Uuid).
uuid = { version = "1", features = ["v4"] }

# ── ADR-0086: control channel MCP entrance ────────────────────────────────────────────────
# rmcp = the official Rust MCP SDK. Streamable HTTP server role (StreamableHttpService = Tower service, nested in axum).
#   server/macros(#[tool]/#[tool_router]/#[tool_handler]) + schemars (tool input schema) + streamable-http-server.
#   ★OAuth metadata is not advertised★: StreamableHttpService does not create a `.well-known` route — this avoids at the root the #59467 condition
#   where claude ignores a static Bearer (initialization measurement basis: ADR-0086 §근거 [rationale]).
rmcp = { version = "2.2.0", features = ["server", "macros", "transport-streamable-http-server", "schemars"] }
# axum = MCP router host (rmcp targets axum 0.8). Local plain-text HTTP — no TLS needed.
#   json = the Json extractor/response of the /control/send handler (ADR-0086 step 2 CLI entrance).
axum = { version = "0.8", default-features = false, features = ["http1", "tokio", "json"] }
# tower = layer assembly that puts the bearer auth middleware on the MCP /mcp route (official auth pattern).
tower = "0.5"
# tower-http(limit) = RequestBodyLimitLayer — axum DefaultBodyLimit limits only extractors, but
#   rmcp StreamableHttpService consumes the raw body directly (bypassing extractors), so that limit has no effect.
#   This layer wraps the body itself and enforces the limit on all downstream consumers (round-2 F4). limit feature only.
tower-http = { version = "0.6", default-features = false, features = ["limit"] }
# CancellationToken(StreamableHttpServerConfig) + graceful shutdown 신호.
tokio-util = { version = "0.7", features = ["rt"] }
# http = direct manipulation of StatusCode/HeaderMap in axum middleware (same 1.x wire types as rmcp).
http = "1"

# ★ADR-0129 slice 1 — the direct `windows` dependency was removed★: this crate's only consumer was the single-instance
#   guard (`instance.rs`), whose OS calls now go through the platform crate's `fs::`. This crate's `windows::` use is now
#   **0** (pid liveness belongs to the platform crate's `process::` — the old comment's "pid liveness (OpenProcess)"
#   was never true of this crate). ★`#[cfg(windows)]` · `windows_subsystem` are **not** crate uses★ —
#   do not revert on the token alone thinking "it's still used". If a need arises to use Win32 directly again, e.g. for a Job Object, add it anew then
#   with the rationale (same 0.58 pin as agent).

# ── ADR-0086 integration tests only (dev) ─────────────────────────────────────────────
[dev-dependencies]
# ★ADR-0129 slice 1★: the WS stack is harness-only — `tests/ws_e2e.rs` becomes a WS **client** and attaches to the
#   assembly started in-process (`start_test_server*`). Production code use is 0 (the comment under [dependencies] above is the
#   source of truth for why it must be there). Same 0.26 pin as the transport crate — the harness and the server must see the same wire
#   implementation.
tokio-tungstenite = "0.26"
# ★ADR-0088 self-dev-dependency trick★: redeclare this crate itself (the daemon lib) in the dev graph with the test features on
#   → `cargo test -p engram-dashboard-daemon` compiles the lib with `test-harness` and turns on handle_send's
#   yield-seam hook without a separate --features flag. Since it is only in the dev graph, it is not unified into the production daemon binary
#   (no features under [dependencies] above) — the hook does not exist in production builds (no-leak).
#   The daemon test-harness is forwarded to agent's test-harness, so the `insert_test_session` seam opens too
#   (the agent redeclaration below is an explicit backup — so the seam turns on even on paths that do not go through the daemon feature).
#   `test-support` opens the in-process test server that the integration tests (`tests/ws_e2e.rs`) call (ADR-0286).
# ★Production build caution (feature unification)★: within a single invocation, cargo takes the **union** of
#   a crate's features. So if you build the lib and test/bench targets (which pull in dev-dependencies) in **one invocation**, as in
#   `cargo build --release --all-targets`, this self-dev-dependency's `test-harness` · `test-support` are unified into the shared
#   lib build, and **the yield-seam hook is baked into the daemon binary produced by that invocation, and that lib is built
#   carrying the test server too**. The usual production paths (`cargo build [--release]`, tauri bundling) do not pull dev-dependencies, so they are harmless.
#   ▶ Rule: do not build release binaries for distribution with `--all-targets` (agent's test-harness dev-dep is in the same
#     risk group — only documented here, not a redesign).
engram-dashboard-daemon = { path = ".", features = ["test-harness", "test-support"] }
# ★ADR-0088 delivery observation seam★: for integration tests to use `AgentManager::insert_test_session` (the harness-only session
#   injection seam) cross-crate, agent's `test-harness` feature must be on. Since it is turned on only as a dev-dependency, it is not unified into
#   the production daemon binary's dependency graph (agent with no features under [dependencies] above) —
#   production builds do not compile the seam (no-leak). (Feature-only dev-dep redeclaration — path is the same crate as above.)
engram-dashboard-agent = { path = "../engram-dashboard-agent", features = ["test-harness"] }
# ★ADR-0110★: same family — daemon tests use the messaging kernel's harness seam (`MessagingService::contract_outcome_for_test`
#   — connection_core's delete-cleanup test looks at the contract's **termination reason**) cross-crate, so that feature is turned on only in the dev graph
#   (not unified into the production daemon binary).
engram-dashboard-messaging = { path = "../engram-dashboard-messaging", features = ["test-harness"] }
# Same family (feature-only redeclaration) — the daemon table harness runs handler futures with the tool crate's executor
#   (`engram_dashboard_command::testing::block_on`). Since it is only in the dev graph, it is not unified into the
#   production daemon binary.
engram-dashboard-command = { path = "../engram-dashboard-command", features = ["test-support"] }
# Same family (feature-only redeclaration) — conditional waiting in tests (`engram_dashboard_base::testing::wait_until`) · test clock `time::ManualClock` (command_delivery · connection_core tests).
engram-dashboard-base = { path = "../engram-dashboard-base", features = ["test-support"] }
# Raw HTTP for the 401 checks (no/wrong/stale token) — rustls keeps it light without the platform-verifier burden (local plain-text http).
reqwest = { version = "0.12", default-features = false, features = ["json"] }
# The happy-path handshake (initialize + tools/list + tools/call) is verified honestly with the rmcp client role.
rmcp = { version = "2.2.0", features = ["client", "transport-streamable-http-client", "transport-streamable-http-client-reqwest"] }
