[package]
name = "engram-dashboard-transport"
version = "0.1.0"
edition = "2021"
description = "Engram Dashboard 재사용 전송 lib — 프레임 경계·요청/응답 상관·스트림 살림·연결 수명·상대 N개 명부. 타입 seam 은 `Wire` 제네릭, 전송·시간은 dyn. 워크스페이스 crate 의존 0(ADR-0177)."

[lib]
name = "engram_dashboard_transport"
path = "src/lib.rs"

# ★`default = []` — same reason as `net`: a loud failure beats a silent regression★. A consumer that needs the harness
#   turns on `features = ["test-support"]` explicitly, ★in its `[dev-dependencies]` only★ (precedent =
#   `engram-dashboard-command` · base · platform). The release graph is checked by CI: `ci.yml` `shell gate 5` for the
#   shell (the daemon line comes with 3-3 U4).
#   ★What the empty default buys in this repo★ — features are unified per cargo invocation under resolver 2: a plain
#   `cargo build` (root or `--workspace`) leaves `test-support` off (measured 2026-11-04: lib features `default` · `ws`),
#   and it turns on only when the call builds a consumer's dev graph that requests it (a root or `--workspace` test run —
#   the shell) or selects this crate with `--all-features`; `cargo test -p engram-dashboard-transport` alone keeps it
#   off (transport gate ④ line 1 relies on that).
#   The gain is that a consumer's mistake speaks as a compile error.
[features]
default = []
test-support = []
# ★`tokio/net` is turned on even without this line today★ — `tokio-tungstenite` 0.26.2's default feature `connect`
#   implies `tokio/net` (its manifest: `connect = ["stream", "tokio/net", "handshake"]`). Still,
#   we write it explicitly: the receiving side (`ws::WsListener`) uses `TcpSocket`·`TcpListener`·`TcpStream` directly while the unconditional dependency's
#   tokio has only `rt`·`sync`·`time`·`macros`, so without it we would be **silently riding on someone else's default feature**.
#   If `default-features = false` is put on `tokio-tungstenite` below (for a TLS decision etc.), that path is cut.
#   (Precedent = `net` also lists tokio's `net` in its own list — biting the same `tokio-tungstenite` 0.26.)
ws = ["dep:tokio-tungstenite", "tokio/net"]

# ★No workspace crate is listed here★ — this empty spot is the real form of ADR-0177 decision 1 (reusable lib).
#   Machine enforcement = gate 1 in the lib.rs header (it reads the resolved dependency graph — not a grep over manifest text).
[dependencies]
# rt = spawning a supervisor task per peer + a reader task per connection · sync = mpsc (outbound queue · per-handle receiving ends) ·
#   watch (PeerState) · oneshot (wait slot) · time = `SystemClock::sleep` · macros = `select!` and `#[tokio::test]`.
# ★`rt-multi-thread` is not put in the production dependencies★ — this crate has no runtime builder and the supervisor task starts with `rt` alone.
#   Consumers using a multi-threaded runtime is their feature choice (only tests turn it on — `[dev-dependencies]` below).
# ★Floor 1.37 = the release where mpsc `Receiver::{len, is_empty, is_closed}` arrived★ — the production loop's anti-starvation rule reads the outbound
#   queue depth with `len` (the `next_turn` call in `peer.rs`).
tokio = { version = "1.37", features = ["rt", "sync", "time", "macros"] }
# `BoxFuture` — the dyn seams (`Dialer`·`LinkTx`·`LinkRx`·`Clock`) cannot use `async fn` in trait, so boxing is manual
#   (net's `frame_port` has the same shape for the same reason). The `select` of `with_deadline` also comes from here.
futures-util = "0.3"

# Only for the real-socket WS adapter (`ws.rs`) — the dialing side's `connect_async_with_config`, the accepting side's `accept_hdr_async_with_config` (Origin ·
#   Host header check · size settings), and `Message`.
# ★Version 0.26 is the workspace pin★ — `net` (`crates/engram-dashboard-net/Cargo.toml`) · `daemon` ·
#   `src-tauri` are all on that version, and two versions of the same crate standing in one graph is itself a defect.
# It uses the default features (`connect` + `handshake`) as they are — the dialing side and the accepting side each require those two.
#   TLS is not turned on (local plain-text WS — same as `net`).
tokio-tungstenite = { version = "0.26", optional = true }

# ★What is not brought in, and why (TRD §11)★:
#   tracing — the event stream (`event.rs`) is that spot. Price = zero trace while the consumer does not read events.
#   serde/serde_json — serialization is `Wire`'s job.
#   thiserror — error types are few, so `Display` is written by hand (net does the same).
#   rand — the jitter randomness source is the sub-second nanoseconds of `Clock::now()` + the `PeerId` hash (precedent = agent's profile.rs).
#   uuid — `Tag`·`StreamKey` are generic, so this crate does not see uuid.

[dev-dependencies]
# rt-multi-thread = a test that measures the registry's race to bring up peers over several worker threads (`flavor = "multi_thread"` in `registry.rs`).
#   It does not enter production builds — a dev dependency's feature is not merged into the production graph (resolver 2).
tokio = { version = "1.37", features = ["rt-multi-thread"] }
