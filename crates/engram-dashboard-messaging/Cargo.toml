[package]
name = "engram-dashboard-messaging"
version = "0.1.0"
edition = "2021"
description = "Engram Dashboard 메시징 커널 — 메일박스·장부·그룹·발송 오케스트레이션·busy 게이트·봉투. 워크스페이스 crate 무의존(ADR-0110 완전 상호무지)."

[lib]
name = "engram_dashboard_messaging"
path = "src/lib.rs"

# ★test-harness (ADR-0110 — promoted from a daemon pass-through to an independent declaration)★: feature flag that opens the harness-only observation seams
#   (the `#[cfg(any(test, feature = "test-harness"))]` items of service/mailbox/group/busy).
#   Default OFF — production builds do not compile these seams at all. The daemon's same-named feature transitions to this one.
[features]
test-harness = []

# ★Dependency ceiling (load-bearing — ADR-0110 decision 2 "fully mutually ignorant")★: put **no** workspace crate
#   in (agent included). External dependencies are also fixed at two, uuid and tracing — anything else is solved with std. If you feel the urge to add a crate
#   here, that is a signal to dig a port instead (the host plugs it in as an adapter).
[dependencies]
# Participant id (PeerId) and message id generation. Same 1.x as agent/protocol (the same bottom type as AgentId=Uuid).
uuid = { version = "1", features = ["v4"] }
tracing = "0.1"
