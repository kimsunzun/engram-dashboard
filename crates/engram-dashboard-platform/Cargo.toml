[package]
name = "engram-dashboard-platform"
version = "0.1.0"
edition = "2021"
description = "Engram Dashboard OS layer — gathers production code that differs per OS in one place. 0 workspace crate dependencies (not even base), 0 domain knowledge. The lib.rs header is canonical for the invariants · isolation gates (ADR-0266 · ADR-0275)."

# ★test-support (ADR-0275 decisions 5 · 13)★: opens the real-process test helpers (`testing`) · the handle whose owner never existed
#   (`group::GroupRef::gone`) · the raw call of WMI launching (`spawn::wmi_create_raw` — for diagnostic tests). Default OFF —
#   consuming crates
#   turn it on only in dev-dependencies (precedent = the same name in `engram-dashboard-command` · `engram-dashboard-base`). That the daemon · shell
#   production graphs do not have this feature is measured by a CI gate. ★The windows bindings are not split per feature★ (the `windows`
#   comment below) — `snap-overlay` below also only opens and closes code and does not turn on bindings.
# ★snap-overlay (TRD S26-window-chrome §8-4 · user decision Q1 2026-10-24)★: opens the snap layout overlay (`window::snap` —
#   a child window over the maximize button). Default OFF — the only thing that turns it on is the shell feature `snap-overlay` (the shell's `Cargo.toml`). Why the code is kept while off
#   = code blocked by commenting it out does not compile and rots — CI compiles the build with it on. That the production graph does not have this
#   feature is measured by a CI gate too. It widens 「cargo features are just `test-support`」 of ADR-0275 decision 13. ADR-0304
[features]
test-support = []
snap-overlay = []

# ★Do not list workspace crates here — not even base★ (ADR-0266 「rejected alternatives」, the second · ADR-0268).
#   Machine enforcement = the dependency cap gate in the lib.rs header (reads the resolved dependency graph).
[dependencies]
# Only failures with nowhere to return to (`Drop`) are printed directly (ADR-0266 decision 9 · ADR-0268) — e.g. closing the Restart
#   Manager session in `file_holders`. Only the facade, so base is not pulled in.
tracing = "0.1"
# The argument shape of functions that take a window (`window`) — takes `&impl HasWindowHandle` and does the handle variant matching (Windows =
#   `Win32`) inside this crate (TRD S21-slot-docking edition 6.3 §8 · B10 · edition 7 §5-1). Callers pass the Tauri window
#   as is, so they do not depend on this crate. It is the same version Tauri already pulls in, so `Cargo.lock` has no new package.
raw-window-handle = "0.6"

# Foundation = shared by `process` (CloseHandle·FILETIME) · `file_holders` (Win32 error codes) · `group` ·
#   Threading = OpenProcess/GetProcessTimes/GetExitCodeProcess · `group`'s TerminateProcess/WaitForSingleObject/
#   ResumeThread · `spawn`'s CREATE_NO_WINDOW · CREATE_SUSPENDED · `window::snap`'s parent window thread guard
#   (GetCurrentThreadId — behind the feature `snap-overlay`) · `account_lock`'s private namespace (CreateBoundaryDescriptorW ·
#   AddSIDToBoundaryDescriptor · CreatePrivateNamespaceW · ClosePrivateNamespace; its SID from text via `Win32_Security_Authorization`'s
#   ConvertStringSidToSidW) · ToolHelp = process_parent_table's process
#   table (child_pids stands on it) and `group`'s thread snapshot (finds the first thread of a child launched suspended — std does not hand out that
#   handle).
# `Win32_System_RestartManager` = for `file_holders` — the four that ask 「who has this file open」,
#   `RmStartSession`/`RmRegisterResources`/`RmGetList`/`RmEndSession`, are behind that feature.
#   codex session id recovery stands on that answer (ADR-0218 decision 1).
# `Win32_System_JobObjects` = `group`'s Job Object (ADR-0262).
# ★Do not remove `Win32_Security`★ — the first argument of `CreateJobObjectW` is `Option<*const SECURITY_ATTRIBUTES>`,
#   so windows 0.58 puts `#[cfg(feature = "Win32_Security")]` on that function definition itself
#   (measured in `Win32/System/JobObjects/mod.rs`), and `Win32_System_JobObjects` does not imply it.
# `Win32_System_IO` = for the completion port that receives `group`'s Job join notifications (`CreateIoCompletionPort` ·
#   `GetQueuedCompletionStatus`) — that is the only public means of hearing that a new member joined.
# `Wdk_System_Threading` = for `NtQueryInformationProcess` — `group` reads the parent PID and command line through a handle it holds.
#   ★`Win32_System_Kernel` · `Win32_System_SystemServices` are not turned on★ — they would be turned on only to use their result structs and notification number constants,
#   so `group/windows.rs` substitutes `repr(C)` and constants.
# `Win32_System_Com` · `Win32_System_Wmi` · `Win32_System_Rpc` = for `spawn`'s launching outside the Job (`spawn/wmi.rs`) —
#   COM initialization · teardown and proxy security (`CoInitializeEx` · `CoUninitialize` · `CoCreateInstance` · `CoSetProxyBlanket`) ·
#   WMI's `IWbemLocator` · `IWbemServices` · `IWbemClassObject` · the auth constants `RPC_C_AUTHN_WINNT` · `RPC_C_AUTHZ_NONE`.
#   ★`Win32_System_Variant` is not turned on★ — the `VARIANT` that code uses is windows-core's, and 0.58's Wmi
#   bindings do not require that feature (confirmed by building this crate alone).
# `Win32_UI_WindowsAndMessaging` = for `window` — the foreground window and the PID of the thread that created it (`GetForegroundWindow` ·
#   `GetWindowThreadProcessId`). The shell decides whether to give focus to main at the end of accepting a runtime restore. Window placement · z-order · placement
#   restore · window under the cursor · window diagnostics (`window`) and cursor · button swap (`input`) are behind this feature too.
# `Win32_UI_Input_KeyboardAndMouse` = `input`'s primary button · Esc state (`GetAsyncKeyState`) and `window::snap`'s hover-leave
#   listening (`TrackMouseEvent` — behind the feature `snap-overlay`, so the default build does not call it).
# `Win32_Graphics_Dwm` = `window::top_level_at`'s cloaked window decision (`DWMWA_CLOAKED`).
# `Win32_Graphics_Gdi` = `window::restore_placement`'s monitor work area (`MonitorFromRect` · `GetMonitorInfoW` —
#   moves screen coordinates to workspace coordinates) and `window::top_level_at`'s window shape (`GetWindowRgn` · `PtInRegion`).
# `Win32_Security_Cryptography` = `secret`'s DPAPI (`CryptProtectData` · `CryptUnprotectData`).
# `Win32_Security_Authorization` = SID text (`ConvertSidToStringSidW` — `account`), the owner-only descriptor from SDDL and reading a
#   file's owner and DACL back (`ConvertStringSecurityDescriptorToSecurityDescriptorW` · `GetNamedSecurityInfoW` — `owner_only`).
# `Win32_Storage_FileSystem` = `owner_only`'s `CreateFileW` (`CREATE_NEW` with the security attributes passed at create) and the
#   volume's ACL support (`GetVolumeInformationByHandleW`).
# `Win32_System_Registry` = `account::machine_id` (`RegGetValueW` on `MachineGuid`).
# `Win32_NetworkManagement_IpHelper` = the TCP table behind `account::tcp_client_account` / `tcp_server_account` (`GetExtendedTcpTable`,
#   owner-module rows: owner PID and endpoint creation time).
# `Win32_UI_Controls` = `approval`'s Task Dialog types (`TASKDIALOGCONFIG` …) — ★only the types★: the function is found at run time
#   (`approval` module head: a static import of `TaskDialogIndirect` stops a manifestless executable with 0xC0000139).
# `Win32_System_LibraryLoader` · `Win32_System_ApplicationInstallationAndServicing` = that run-time load (`LoadLibraryW` ·
#   `GetProcAddress` under a comctl32 v6 activation context — `CreateActCtxW` · `ActivateActCtx`).
# `Win32_System_StationsAndDesktops` · `Win32_System_RemoteDesktop` = `approval`'s "no desktop" check (window station flags ·
#   `ProcessIdToSessionId`).
# `Win32_Storage_FileSystem` also carries `fs::rename_no_replace` (`MoveFileExW` without `MOVEFILE_REPLACE_EXISTING`).
# ★Not split into per-feature cargo features★ — turns on the union of the binding features used by this one dependency (ADR-0275
#   decision 13). When moving a module over, add the features that module uses here.
[target.'cfg(windows)'.dependencies]
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_System_Diagnostics_ToolHelp",
    "Win32_System_RestartManager",
    "Win32_System_JobObjects",
    "Win32_Security",
    "Win32_System_IO",
    "Wdk_System_Threading",
    "Win32_System_Com",
    "Win32_System_Wmi",
    "Win32_System_Rpc",
    "Win32_UI_WindowsAndMessaging",
    "Win32_UI_Input_KeyboardAndMouse",
    "Win32_Graphics_Dwm",
    "Win32_Graphics_Gdi",
    "Win32_Security_Cryptography",
    "Win32_Security_Authorization",
    "Win32_Storage_FileSystem",
    "Win32_System_Registry",
    "Win32_NetworkManagement_IpHelper",
    "Win32_UI_Controls",
    "Win32_System_LibraryLoader",
    "Win32_System_ApplicationInstallationAndServicing",
    "Win32_System_StationsAndDesktops",
    "Win32_System_RemoteDesktop",
] }

# The `file_holders` · `fs` · `owner_only` tests draw temp file names that do not collide — not in the production graph.
[dev-dependencies]
uuid = { version = "1.8", features = ["v4"] }
