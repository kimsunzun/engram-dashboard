[package]
name = "engram-dashboard-command"
version = "0.1.0"
edition = "2021"
description = "Engram Dashboard 명령 버스 도구 — 봉투·오류·선언 매크로·표·라우팅. 워크스페이스 crate 의존 0, 명령 0개."

# ★test-support (ADR-0012)★: feature flag that opens the minimal executor the harness uses (`testing::block_on`). Default OFF —
#   no test-only executor is left in production builds. Consumer crates enable it only in dev-dependencies (same shape as agent's
#   `test-harness`).
[features]
test-support = []

# ★If this crate depended on even one workspace crate, its reason to exist would vanish★ (lib.rs header invariant 1).
#   The gate counts path-dependency notation with a regex, so that notation is not written in this comment (avoids self-citation false positives).
[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
# ADR-0155: declarations are scattered next to their producers, so "all declarations linked into this binary" is collected by the linker.
inventory = "0.3"
# To avoid redefining the round-trip correlation key at every hop, it uses the existing wire representation (uuid) as is —
#   it is the same representation as `RequestId` in `engram-dashboard-protocol`, so no conversion gets in between in the Step 2·3 wiring.
uuid = { version = "1", features = ["v4", "serde"] }
