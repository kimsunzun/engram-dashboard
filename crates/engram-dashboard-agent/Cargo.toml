[package]
name = "engram-dashboard-agent"
version = "0.1.0"
edition = "2021"
description = "Engram Dashboard agent core — AgentManager·OutputCore·AgentTransport·backend·persistence. Zero Tauri imports (headless)."

# ★test-harness (ADR-0088 / ADR-0012)★: the feature flag opening the harness-only session injection seam (`AgentManager::insert_test_session`).
#   Default OFF — production builds do not compile this seam (blocks bypassing the spawn reservation, profile+epoch coordination, control-token and pump/reaper wiring
#   through arbitrary AgentSession injection). The daemon
#   integration tests must see the seam cross-crate, so this feature is turned on only in a dev-dependency (the daemon
#   Cargo.toml [dev-dependencies] below) → the feature request is only in the dev graph and is not unified into the production daemon binary.
#   The agent's own in-crate tests do not use this seam, so plain `cargo test -p ...-agent` is unaffected too.
[features]
test-harness = []

[dependencies]
# ★The workspace dependencies are only the three below (command · base · platform) — **do not add protocol here**★ —
#   declaring `agent.*` needs tools, and getting them from protocol would make the core see wire types too.
#   The tools crate blocks that inflow. (ADR-0155)
engram-dashboard-command = { path = "../engram-dashboard-command" }
# `mask_secrets` of `transport::stdio` — the old `crate::logging` moved to the leaf crate (ADR-0175 decision 1).
#   The general helpers `path::normalize_spelling` (typed cwd) · `time::now_epoch_ms` (profile times) also come from here (ADR-0269).
#   The data-file rules of the profile file (`file` — read decision · atomic write · damaged copy · temp sweep) also
#   come from here (ADR-0291).
#   Lock poison recovery (`sync::lock` etc. — ADR-0275) also comes from here. The super-
#   trait `time::Clock` of the leftover cleanup clock `LeftoverClock` and the production implementation `time::SystemClock` (ADR-0275 decision 6) also come from here.
engram-dashboard-base = { path = "../engram-dashboard-base" }
# The OS layer (ADR-0266) — PID helpers such as `process::{process_creation_time, pid_alive_with_start_time}`. Used by the codex session id
#   reclamation to decide the child's identity by PID+start time (ADR-0218 decision 2). The lock file holder lookup of the same reclamation
#   (`file_holders::holders_of`) and our process tree (`process::subtree`) also come from here (ADR-0218 decision 1).
#   The console wrapping every CLI spawn passes through (`shell::console_command` — claude · codex spawns and usage queries) ·
#   the home directory (`env::home_dir` — the claude settings folder · codex home) · environment variable name comparison (`env::env_key_eq` — the CLI
#   entry's PATH injection · finding `CODEX_HOME` for the codex lock folder · finding `MAX_THINKING_TOKENS` for claude spawns) also come
#   from here (ADR-0230). The owner of the process group the three links launched (`group::GroupOwner`) and
#   the weak handle the leftover cleanup receives (`group::GroupRef` — wrapped by `transport::process_group`) · launching without a window
#   (`spawn::hide_console_window`) · the tree root of the usage query and its kill handle · the 「missing program」 decision
#   (`spawn::{prepare_tree_root, TreeRoot, MissingProgramCheck}`) also come from here (ADR-0275). Tests also use the default shell
#   (`shell::default_shell`). The OS share the profile store hands to base `file` (`fs::{retry_busy,
#   sync_dir}`) and the liveness decision of the owner of leftover temp files (`process::pid_alive`) also come from here (ADR-0291).
engram-dashboard-platform = { path = "../engram-dashboard-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
tracing = "0.1"
dunce = "1.0"
ts-rs = "10"   # the declaration macro puts the TS derive on argument/return structs (output = bindings/, TRD §2-4 ①)
# ISO 8601 reset time of the claude usage query response → epoch seconds (`backend/claude/usage_probe.rs`). All features are off —
#   RFC 3339 parsing stands without features, and the clock and time zone database (`clock`) are not needed. It is a version already in the lock file
#   (the daemon already links it through `rmcp`) — no new package is pulled in.
chrono = { version = "0.4", default-features = false }
# The codex hook trust hash (`backend/codex/hook_assembly.rs` — codex hashes each hook handler with sha256). A version
#   already in the lock file (asset-library links it) — no new package (ADR-0420).
sha2 = "0.10"
# Parse-only reading of a codex settings asset's raw `-c hooks…` values (`backend/codex/hook_assembly.rs`, the codex
#   backend only). No writer, no schema check: the line writer is Engram's own (ADR-0359, amended by ADR-0420). A
#   version already in the lock file — no new package.
toml = { version = "1.1", default-features = false, features = ["std", "serde", "parse"] }

# Turns on the harness-only executor (`engram_dashboard_command::testing::block_on`) only in test builds —
#   the feature request is only in the dev graph, so it is not unified into production binaries.
[dev-dependencies]
engram-dashboard-command = { path = "../engram-dashboard-command", features = ["test-support"] }
# Same family (feature-only redeclaration) — condition waiting for integration tests (`engram_dashboard_base::testing::wait_until`).
engram-dashboard-base = { path = "../engram-dashboard-base", features = ["test-support"] }
# Same family — the real-process test helpers of claude leftover cleanup · usage query (`engram_dashboard_platform::testing`) and
#   a handle whose group is already gone (`group::GroupRef::gone` — used by the test constructor of `transport::process_group`).
engram-dashboard-platform = { path = "../engram-dashboard-platform", features = ["test-support"] }

# ★The production dependencies have no `windows`★ — the Job Object wrapper · member pinning of leftover cleanup · waking a child launched suspended are
#   held by `group` · `spawn` of the OS layer crate, and that manifest also turns on the binding features (ADR-0266 · ADR-0275).
#   The only consumers left here are the two `examples/spike*.rs` — Phase 0 spikes calling Job Objects directly, and since `cargo test`
#   compiles examples, it is a dev dependency.
# ★Do not remove `Win32_Security`★ — the first argument of `CreateJobObjectW` is `Option<*const SECURITY_ATTRIBUTES>`,
#   so windows 0.58 puts `#[cfg(feature = "Win32_Security")]` on that function definition itself
#   (`Win32/System/JobObjects/mod.rs` measured), and `Win32_System_JobObjects` does not imply it. The OS layer crate turns on the same version
#   more broadly and the features are merged within the build, so removing it here would not show up at compile time.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = [
    "Win32_System_JobObjects",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
] }
