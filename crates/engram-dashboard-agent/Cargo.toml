[package]
name = "engram-dashboard-agent"
version = "0.1.0"
edition = "2021"
description = "Engram Dashboard 에이전트 코어 — AgentManager·OutputCore·AgentTransport·backend·persistence. Tauri import 0(headless)."

# ★test-harness (ADR-0088 / ADR-0012)★: 하네스 전용 세션 주입 seam(`AgentManager::insert_test_session`)을
#   여는 기능 플래그. 기본 OFF — 운영(production) 빌드는 이 seam 을 컴파일하지 않는다(임의 AgentSession
#   주입으로 spawn 예약·profile+epoch 조율·control-token·pump/reaper 배선을 우회하는 것 차단). daemon
#   통합 테스트가 cross-crate 로 seam 을 봐야 하므로 dev-dependency 에서만 이 기능을 켠다(아래 daemon
#   Cargo.toml [dev-dependencies]) → 기능 요청이 dev 그래프에만 있어 운영 daemon 바이너리엔 유니피케이션되지
#   않는다. agent 자체 in-crate 테스트는 이 seam 을 쓰지 않으므로 plain `cargo test -p ...-agent` 도 무영향.
[features]
test-harness = []

[dependencies]
# ★워크스페이스 의존은 아래 셋(command · base · platform)뿐이고, **protocol 을 여기 추가하지 말 것**★ —
#   `agent.*` 를 선언하려면 도구가 필요한데 그것을 protocol 에서 받으면 코어가 wire 타입까지 보게 된다.
#   도구 crate 가 그 유입을 막는다. (ADR-0155)
engram-dashboard-command = { path = "../engram-dashboard-command" }
# `transport::stdio` 의 `mask_secrets` — 옛 `crate::logging` 이 잎 crate 로 이사했다(ADR-0175 결정 1).
#   범용 도우미 `path::normalize_spelling`(친 cwd) · `time::now_epoch_ms`(프로필 시각 · 손상 사본 이름)도
#   여기서 온다(ADR-0269).
#   락 오염 되찾기(`sync::lock` 등 — ADR-0275)도 여기서 온다. 잔여물 정리 시계 `LeftoverClock` 의 상위
#   트레이트 `time::Clock` 과 운영 구현 `time::SystemClock`(ADR-0275 결정 6)도 여기서 온다.
engram-dashboard-base = { path = "../engram-dashboard-base" }
# OS 층(ADR-0266) — `process::{process_creation_time, pid_alive_with_start_time}` 등 PID 헬퍼. codex 세션 id
#   회수가 자식 신원을 PID+시작시각으로 판정하는 데 쓴다(ADR-0218 결정 2). 같은 회수의 락 파일 홀더 조회
#   (`file_holders::holders_of`)와 우리 프로세스 나무(`process::subtree`)도 여기서 온다(ADR-0218 결정 1).
#   CLI 스폰마다 지나는 콘솔 감싸기(`shell::console_command` — claude · codex 의 스폰과 사용량 조회) ·
#   홈 디렉터리(`env::home_dir` — claude 설정 폴더 · codex 홈) · 환경변수 이름 비교(`env::env_key_eq` — CLI
#   입구의 PATH 주입)도 여기서 온다(ADR-0230). 통로 셋 · 사용량 조회가 띄운 프로세스 무리의 주인
#   (`group::GroupOwner`)과 잔여물 정리가 받는 약한 손잡이(`group::GroupRef` — `transport::process_group` 이
#   감싼다) · 창 없이 띄우기(`spawn::hide_console_window`)도 여기서 온다(ADR-0275). 시험은 기본 셸
#   (`shell::default_shell`)도 쓴다.
engram-dashboard-platform = { path = "../engram-dashboard-platform" }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
portable-pty = "0.8.1"
uuid = { version = "1.8", features = ["v4", "serde"] }
thiserror = "1.0"
tracing = "0.1"
dunce = "1.0"
ts-rs = "10"   # 선언 매크로가 인자·반환 struct 에 TS derive 를 단다(파생물 = bindings/, TRD §2-4 ①)
# claude 사용량 조회 응답의 ISO 8601 리셋 시각 → epoch 초(`backend/claude/usage_probe.rs`). 기능은 전부 끈다 —
#   RFC 3339 해석은 기능 없이 서고, 시계·시간대 데이터베이스(`clock`)는 필요 없다. 잠금 파일에 이미 있는 판이다
#   (데몬은 `rmcp` 를 거쳐 이미 링크한다) — 새 패키지를 끌어오지 않는다.
chrono = { version = "0.4", default-features = false }

# 하네스 전용 실행기(`engram_dashboard_command::testing::block_on`)를 테스트 빌드에서만 켠다 —
#   기능 요청이 dev 그래프에만 있어 운영 바이너리엔 유니피케이션되지 않는다.
[dev-dependencies]
engram-dashboard-command = { path = "../engram-dashboard-command", features = ["test-support"] }
# 같은 계열(feature-only 재선언) — 통합 시험의 조건 대기(`engram_dashboard_base::testing::wait_until`).
engram-dashboard-base = { path = "../engram-dashboard-base", features = ["test-support"] }
# 같은 계열 — claude 잔여물 정리의 실프로세스 시험 도우미(`engram_dashboard_platform::testing`)와 무리가 이미
#   사라진 손잡이(`group::GroupRef::gone` — `transport::process_group` 의 시험 생성자가 쓴다).
engram-dashboard-platform = { path = "../engram-dashboard-platform", features = ["test-support"] }

# ★운영 의존에는 `windows` 가 없다★ — Job Object 래퍼 · 잔여물 정리의 멤버 붙들기 · 멈춘 채 띄운 자식 깨우기는
#   OS 층 crate 의 `group` 이 갖고, 그 바인딩 feature 도 그쪽 매니페스트가 켠다(ADR-0266 · ADR-0275). 여기 남은
#   소비자는 `examples/spike*.rs` 둘뿐이다 — Job Object 를 직접 부르는 Phase 0 스파이크이고, `cargo test` 가 예제를
#   컴파일하므로 dev 의존으로 둔다.
# ★`Win32_Security` 를 빼지 말 것★ — `CreateJobObjectW` 의 첫 인자가 `Option<*const SECURITY_ATTRIBUTES>`
#   라 windows 0.58 은 그 함수 정의 자체에 `#[cfg(feature = "Win32_Security")]` 를 달아 두는데
#   (`Win32/System/JobObjects/mod.rs` 실측), `Win32_System_JobObjects` 는 그것을 함의하지 않는다. 같은 판을
#   OS 층 crate 가 더 넓게 켜 두어 빌드 안에서 feature 가 합쳐지므로, 여기서 빼도 컴파일로는 드러나지 않는다.
[target.'cfg(windows)'.dev-dependencies]
windows = { version = "0.58", features = [
    "Win32_System_JobObjects",
    "Win32_Foundation",
    "Win32_System_Threading",
    "Win32_Security",
] }
