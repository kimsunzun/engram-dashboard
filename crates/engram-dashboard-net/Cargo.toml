[package]
name = "engram-dashboard-net"
version = "0.1.0"
edition = "2021"
description = "Engram Dashboard 네트워크 행 — WS 서버(Origin·auth·연결 수명·단일 writer·keepalive), 불투명 프레임 포트, 전-연결 팬아웃 레지스트리, 단일 인스턴스 가드, portfile. 에이전트 어휘를 타입으로도 모른다(0-4 로 예외 0 — 핸드셰이크 프레임은 이 crate 소유 `auth::AuthFrame`, ADR-0129 결정 1, 상세는 lib.rs 헤더)."

[lib]
name = "engram_dashboard_net"
path = "src/lib.rs"

# `server` = 소켓 수락 뒤의 서버 살림 전부(`ws`·`frame_port`·`instance`·`portfile` 모듈 + 그것이 지는
#   async 런타임·플랫폼 의존)를 켠다. 끄면 `auth` 만 남는다 — 핸드셰이크 프레임 **모양**만 필요한 소비자가
#   tokio 를 지지 않게 하는 것이 이 feature 의 존재 이유다(discovery 의 "동기라 async 런타임을 안 들인다"
#   성질이 `net` 간선 때문에 조용히 깨져 있었다 — 실측 2026-08-05).
#   ★`default = []` — 서버 행이 필요한 쪽이 명시로 켠다(사용자 결정 2026-08-05)★: 기본이 `["server"]` 면
#   의존을 적는 평범한 형태(`{ path = … }`)가 async 런타임을 조용히 끌고 오고, 소비자마다 빼는 것을
#   **기억해야** 한다 — 지금 고치는 결함이 그렇게 생겼다. 비어 있으면, 서버 행이 필요한데 안 적은 소비자는
#   컴파일 오류로 말한다. 조용한 회귀보다 시끄러운 실패가 낫다. 켜야 할 곳의 정본은
#   `rg -n "engram-dashboard-net" crates/*/Cargo.toml src-tauri/Cargo.toml` 이 찍는 선언 줄이고,
#   대가는 거기 붙는 `features = ["server"]` 한 조각이다(여기서 소비자를 열거하지 말 것).
#   ★슬라이스 2 재개 시 먼저 볼 것(그 슬라이스는 ADR-0130 으로 보류 중 — 지금 할 일이 아니다)★:
#   `frame_port` 는 서버가 아니라 **계약**이고 tokio 를 쓰지 않는다
#   (`rg -n "tokio" crates/engram-dashboard-net/src/frame_port.rs` → 0줄). 슬라이스 2(에이전트 시스템 lib)는
#   그 trait 을 **구현**하는 위층이라, 지금 gating 대로면 계약을 보려고 `server` 를 켜서 async 런타임·Win32·
#   net 의 core/protocol 간선까지 지게 된다 — discovery 에서 걷어낸 짐을 슬라이스 2 에서 되살리는 셈이다.
#   `frame_port` 를 `server` 밖으로(또는 자기 feature 로) 빼는 것을 그때 먼저 검토할 것. 슬라이스 2 가
#   `server` 를 켜고 난 뒤엔 되돌리는 것이 공개 API 변경이다.
#   ★이득의 범위를 넘겨 읽지 말 것★: feature 합집합은 **cargo 호출 1회 단위**라, 루트 `cargo build` 는
#   데몬이 `server` 를 켜므로 net 을 여전히 한 번 server 로 빌드한다. 통짜 빌드가 가벼워지는 게 아니라,
#   **`-p engram-dashboard-discovery` 단독 빌드/소비**가 가벼워지고 그 설계 성질이 참으로 유지된다.
[features]
default = []
server = [
    "dep:engram-dashboard-agent",
    "dep:engram-dashboard-protocol",
    "dep:futures-util",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:tracing",
]

# ★의존성 상한 — 열거가 아니라 **규칙**(load-bearing, ADR-0129 결정 1)★: 워크스페이스 crate 는
#   **"이 crate 를 쓰는 쪽이 이미 어차피 지고 있는 것" 만** 둔다. 지금 그 조건을 만족하는 것은
#   protocol·core 이고, 그 밖(daemon·messaging·discovery 및 앞으로 생길 것)은 넣지 않는다 —
#   넣는 순간 "네트워크만 필요한 소비자" 가 에이전트 시스템까지 의존으로 지게 되고 이 crate 를 만든
#   이유가 사라진다. **규칙으로 적은 이유** = 이름을 열거하면 새 crate 가 생길 때마다 한 칸 모자란다
#   (그 결함이 이 이사 슬라이스의 지배적 결함 유형이었다).
#   ★기계 강제 = lib.rs 헤더의 게이트 3★ — **이 파일의 텍스트가 아니라 해석된 의존 그래프**를 읽는다
#   (명령 정본은 그 헤더. 매니페스트 텍스트 grep 은 rename·테이블 형 등에 뚫려 쓰지 않는다). 게이트 1·2 는
#   `src/` 만 보므로 소스가 이름을 안 부르는 의존은 못 잡고, 그 자리를 게이트 3 이 맡는다.
#   추가하고 싶어지면 그건 포트를 파야 한다는 신호다(위층이 어댑터로 꽂는다 — messaging 커널과 같은 idiom).
#   ★아래 `optional = true` 는 전부 `server` feature 가 켠다★ — 상한 규칙과 무관하고(상한은 켰을 때 기준),
#   빼는 것이 아니라 **auth 만 필요한 소비자에게 안 지우는** 장치다. 새 의존은 `optional = true` 로 적고
#   `server` 목록에도 넣는다.
#   ★어긋났을 때 무엇이 터지는지(실측 2026-08-05 — 옛 주석의 "`--no-default-features` 빌드에서만 터진다"
#   는 양방향으로 틀렸다)★: `optional = true` 로 적고 `server` 목록에 안 넣으면 그것을 켜는 것이 없으므로,
#   그 의존을 쓰는 코드가 컴파일되는 조합에서 곧바로 터진다(시끄러운 실패라 문제가 아니다). 그냥
#   `foo = "1"` 로 적으면 — 개발자가 실제로 치는 형태다 — **어디서도 안 터지고** feature 0개 소비자가
#   조용히 그것을 진다. `serde` 가 그 실례다:
#   `cargo tree -p engram-dashboard-net --no-default-features -e normal --prefix none --depth 1` 에 나온다.
#   ★게이트 5 도 뒤쪽은 못 잡는다★ — 그 게이트는 feature 0개 쪽이 **컴파일되는지**만 보고, 조용히 딸려온
#   의존은 컴파일을 깨지 않는다(명령 정본 = lib.rs 헤더). 조용한 반입을 실제로 잡는 것은 **소비자 쪽 트리
#   실측**이다 — `crates/engram-dashboard-discovery/Cargo.toml` 의 `cargo tree … | rg -i "^(tokio|…)"` 게이트.
[dependencies]
# 소비자는 이제 하나뿐 — `portfile` 의 daemon.json 공유 구조체(`DaemonInfo`, 데몬이 write·클라가 read).
#   0-4 이전엔 `ws` 의 auth 핸드셰이크가 위층 명령 enum 을 빌려 쓰는 어휘 예외가 하나 더 있었는데,
#   그 모양이 `src/auth.rs` 로 옮겨오며 사라졌다. 남은 ①은 어휘가 아니라 **파일 포맷 계약**이라
#   `net → protocol` 은 **영구**다(`portfile.rs` 가 `DaemonInfo` 를 re-export 한다) — 지우려 들지 말 것.
engram-dashboard-protocol = { path = "../engram-dashboard-protocol", optional = true }
# `portfile` 의 stale 판정 전용 — `agent::platform` 의 프로세스 liveness 헬퍼(에이전트 어휘 아님)다.
#   **허용 심볼의 정본은 lib.rs 헤더의 게이트 2**이고, 그 게이트가 심볼 목록 자체를 기대값으로 못 박는다
#   (파일 단위가 아니라 심볼 단위 — 여기서 목록을 다시 세지 말고 그 게이트를 볼 것). daemon·tauri 양쪽이
#   같은 liveness 로직을 보게 하는 DRY — discovery crate 가 core 에 의존하는 것과 같은 이유
#   (ADR-0129 결정: 격리 게이트는 crate 단위가 아니라 **타입 단위**다).
#   ★optional 이어도 게이트 3 의 기대값은 3 그대로다★ — 그 게이트는 `--all-features` 로 읽으므로
#   optional 간선이 그대로 드러난다(그게 애초에 그 플래그를 붙인 이유다).
engram-dashboard-agent = { path = "../engram-dashboard-agent", optional = true }

# macros = `tokio::select!`(write_task 의 큐/close_signal/keepalive 3-arm) + `#[tokio::test]`.
# net/sync/time = TcpStream·mpsc·Notify·timeout/interval. daemon 과 같은 1.x 핀.
# ★`rt-multi-thread` 는 필요보다 넓다(의도적 유보)★: `handle_connection` 의 task spawn 이 요구하는 것은
#   **`rt`** 이고, 이 crate 엔 런타임 빌더도 `flavor = "multi_thread"` 도 없다(둘 다 사용 0). 그래도
#   좁히지 않은 이유 = 이 슬라이스는 **순수 이사**라 동작 인접 변경을 넣지 않는다는 것 하나다.
#   ★"어차피 데몬이 켜니 좁혀도 같다" 는 근거로 쓰지 말 것★: feature 합집합은 **호출 1회 단위**라, 데몬을
#   함께 빌드할 때만 그렇다. 이 crate 의 단독 빌드/테스트(`cargo build|test -p engram-dashboard-net` —
#   lib.rs 헤더가 광고하는 바로 그 격리 경로)에서는 여기 적힌 feature 가 그대로 유효 집합이다.
#   `rt` 로의 축소는 별 단위로 미룬다.
# `signal` 은 넣지 않는다 — Ctrl-C 는 데몬 살림이고 이 crate 에 `ctrl_c` 사용이 0이다(accept loop 가
#   아직 조립부에 있어 그쪽이 쥔다).
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
], optional = true }
# WS 서버: accept_hdr_async(Origin 콜백)/split/Message. rustls 등 TLS 불필요(로컬 평문 WS).
tokio-tungstenite = { version = "0.26", optional = true }
# 포트 trait 시그니처의 `future::BoxFuture`(async fn in trait 이 dyn 비호환이라 수동 박싱)와, `ws` 의 WS
#   살림·스트림 추상(`stream::SplitSink` writer half 별칭 · `SinkExt` · `StreamExt` · `read_task<S>` 의
#   `Stream` 바운드)에 쓴다. 격리 테스트는 `stream::iter`(합성 프레임열)·`poll!`(포화 park 양성 관측)도
#   쓴다. 정확한 사용처는 `rg "futures_util|SinkExt|StreamExt|Stream\b" src/` 로 볼 것 — 여기 목록을
#   기대값으로 삼지 말 것(세 번 세어 세 번 한 칸 모자랐다).
futures-util = { version = "0.3", optional = true }
# ★유일한 무조건 의존★ — 핸드셰이크 프레임(`auth::AuthFrame`)의 파생. 이 crate 가 wire 모양을 소유하므로
#   derive 가 필요하고, `--no-default-features` 소비자가 지는 짐은 정확히 이것 하나다.
serde = { version = "1", features = ["derive"] }
# auth 핸드셰이크에 쓴다 — 운영 경로의 사용처는 `ws.rs` 가 첫 프레임을 `auth::AuthFrame` 로 파싱하는
#   자리 하나뿐이고, 테스트가 그 핸드셰이크를 합성하는 데 더 쓴다. 그 밖의 프레임은 불투명 text/바이트로만
#   다루므로, 핸드셰이크 밖에서 JSON 해석이 늘어나면 어휘 격리가 새고 있다는 신호다.
#   ★dev 쪽에도 무조건 걸어 둔다(아래 [dev-dependencies])★ — `auth.rs` 의 golden 테스트가 이걸 쓰는데
#   여기선 optional 이라, 안 걸면 `cargo test --no-default-features` 가 컴파일조차 안 된다.
serde_json = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }

# `auth` 만 켠 격리 경로(`cargo test -p engram-dashboard-net` — 기본 feature 가 비어 있어 맨 명령이 그
#   조합이다. 게이트 5 첫 줄)를 살려 두는 몫. 위 `[dependencies]` 쪽 `serde_json` 은 optional 이라
#   그 조합에 없다. dev-의존은 feature 와 무관하게 항상 켜지므로 golden 테스트가 어느 조합에서도 돈다.
[dev-dependencies]
serde_json = "1"

# ★Win32 크레이트 의존 0(의도)★: `instance` 의 단일 인스턴스 배제는 std 만으로 짠다 —
#   `std::os::windows::fs::OpenOptionsExt::share_mode` 하나면 된다(그대로 `CreateFileW` 의 dwShareMode 로
#   내려가 같은 커널 동작을 unsafe 없이 얻는다).
#   ★구간 잠금(`std::fs::File::try_lock`)을 되살리지 말 것★: MS 문서상 배타 구간 잠금은 다른 프로세스의
#   **읽기까지** 거부하는데, 이 파일은 클라이언트가 읽어야 하는 접속 파일을 겸한다(ADR-0135). 그래서
#   `LockFileEx` 를 부르려고 `windows` 를 되살릴 이유도 함께 사라졌다.
#   ★공유 모드를 넓히지 말 것★ — 쓰기·삭제 공유는 각각 배제와 파일 보호를 무너뜨린다
#   (`src/instance.rs` 헤더의 ★되살리지 마라★ 두 절).
#   ★pid liveness 도 여기 없다★: 그건 core 의 `agent::platform` 헬퍼가 한다(위 core 의존 주석).
