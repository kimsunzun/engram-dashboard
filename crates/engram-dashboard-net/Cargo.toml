[package]
name = "engram-dashboard-net"
version = "0.1.0"
edition = "2021"
description = "Engram Dashboard 네트워크 행 — WS 서버(Origin·auth·연결 수명·단일 writer·keepalive), 불투명 프레임 포트, 전-연결 팬아웃 레지스트리, 단일 인스턴스 가드, portfile. 에이전트 어휘를 타입으로도 모른다(0-4 로 예외 0 — 핸드셰이크 프레임은 protocol `handshake::AuthFrame` 의 재수출 `auth::AuthFrame`, ADR-0129 결정 1, 상세는 lib.rs 헤더)."

[lib]
name = "engram_dashboard_net"
path = "src/lib.rs"

# `server` = turns on all of the server's lifecycle management after socket accept (the `ws` · `frame_port` · `instance` · `portfile` modules + the
#   async runtime · platform dependencies they carry). Off, only `auth` (a re-export of the protocol handshake frame) remains — the
#   reason this feature exists is to keep consumers that need only the frame **shape** from carrying tokio (at that time the
#   discovery crate, a sync consumer, had its "sync, so it brings no async runtime" property silently broken by the `net` edge —
#   measured 2026-08-05). ★No consumer uses that combination now★ — the shell takes the frame directly from protocol (TRD stage 3
#   3-1 U2). Even so, that combination is still measured by gate 5a · CI `platform gate 7`.
#   ★`default = []` — whoever needs the server layer turns it on explicitly (user decision 2026-08-05)★: if the default were `["server"]`,
#   the plain form of writing a dependency (`{ path = … }`) would silently pull in the async runtime, and every consumer would
#   have to **remember** to remove it — the defect being fixed now looked exactly like that. With it empty, a consumer that needs the server layer but did not write it
#   says so with a compile error. A loud failure beats a silent regression. The source of truth for where it must be turned on is
#   the declaration lines printed by `rg -n "engram-dashboard-net" crates/*/Cargo.toml src-tauri/Cargo.toml`,
#   and the price is the one `features = ["server"]` fragment attached there (do not list consumers here).
#   ★Look here first when slice 2 resumes (that slice is on hold under ADR-0130 — not work for now)★:
#   `frame_port` is a **contract**, not a server, and does not use tokio
#   (`rg -n "tokio" crates/engram-dashboard-net/src/frame_port.rs` → 0 lines). Slice 2 (the agent system lib) is the
#   upper layer that **implements** that trait, so under the current gating, to see the contract it would have to turn on `server` and carry the async runtime · Win32 ·
#   net's platform edge —
#   reviving in slice 2 the burden that was lifted from consumers that need only auth.
#   Consider first, at that time, moving `frame_port` out of `server` (or into its own feature). Once slice 2 has turned on
#   `server`, reverting it is a public API change.
#   ★Do not read the extent of the gain too broadly★: feature union is **per cargo invocation**, so a root `cargo build`
#   still builds net once with server because the daemon turns on `server`. It is not that the whole build gets lighter;
#   it is light **when net is built/consumed alone with the default feature**, and that design property stays true (what measures that property
#   = the net default feature line of CI `platform gate 7`).
[features]
default = []
server = [
    "dep:engram-dashboard-platform",
    "dep:futures-util",
    "dep:serde_json",
    "dep:tokio",
    "dep:tokio-tungstenite",
    "dep:tracing",
]

# ★Dependency ceiling — a **rule**, not an enumeration (load-bearing, ADR-0129 decision 1)★: for workspace crates, put
#   **only "what the side using this crate already carries anyway"**. What meets that condition now
#   is protocol·platform, and nothing else (agent·daemon·messaging and anything that appears later) goes in —
#   the moment it does, a "consumer that needs only the network" carries the agent system as a dependency and the reason this crate was made
#   disappears. **Why it is written as a rule** = if names are enumerated, every new crate leaves it one entry short
#   (that defect was the dominant defect type of this move slice).
#   ★Machine enforcement = gate 3 in the lib.rs header★ — it reads **the resolved dependency graph, not this file's text**
#   (the command's source of truth is that header; a grep over manifest text is not used because rename · table form etc. slip through). Gates 1·2
#   look only at `src/`, so they cannot catch a dependency whose name the source does not call, and gate 3 covers that spot.
#   If you feel like adding one, that is a signal to dig a port (the upper layer plugs it in as an adapter — same idiom as the messaging kernel).
#   ★Every `optional = true` below is turned on by the `server` feature★ — unrelated to the ceiling rule (the ceiling is measured with it on),
#   and it is a device not for removing but for **not loading consumers that need only auth**. Write a new dependency as `optional = true` and
#   add it to the `server` list too. The only unconditional dependency is protocol (see its dependency comment).
#   ★What blows up when it goes wrong (measured 2026-08-05 — the old comment's "blows up only in a `--no-default-features` build"
#   was wrong in both directions)★: if you write `optional = true` and do not add it to the `server` list, nothing turns it on,
#   so it blows up right away in combinations where code using that dependency compiles (a loud failure, so not a problem). If you just
#   write `foo = "1"` — the form developers actually type — **it blows up nowhere** and zero-feature consumers
#   silently carry it. What gets pulled in is printed by
#   `cargo tree -p engram-dashboard-net --no-default-features -e normal --prefix none --depth 1`.
#   ★Gate 5 cannot catch the latter either★ — that gate looks only at whether the zero-feature side **compiles**, and a silently
#   pulled dependency does not break compilation. What actually catches the async runtime among silent imports is
#   the **tree measurement** — the net default feature line of CI `platform gate 7` (`cargo tree -p engram-dashboard-net -e normal
#   … | rg -i "^(tokio|…)"` → 0 lines · command source of truth = that step). A non-runtime dependency such as `serde` is not seen by that line either.
[dependencies]
# ★The only unconditional dependency★ — two places use it: the handshake frame that `auth` re-exports (`handshake::AuthFrame` —
#   ADR-0310 decision 9 · its shape lives in protocol) and the daemon.json shared struct of `portfile` (`DaemonInfo`, the daemon
#   writes · the client reads). Both are handshake · file-format contracts, not command vocabulary — that the command vocabulary is not called
#   is measured by lib.rs header gate 4. The frame must exist in the zero-feature combination too, so it is not optional —
#   so what zero-feature consumers carry is exactly this edge (and the graph under it).
engram-dashboard-protocol = { path = "../engram-dashboard-protocol" }
# Used by two OS-layer parts — `portfile`'s stale decision (the process liveness helper of `process::`) and `instance`'s single
#   instance guard (the shared-restricted open of `fs::` and its failure classification). Neither is agent vocabulary.
#   **The source of truth for allowed symbols is gate 2 in the lib.rs header**, and that gate nails down the symbol list itself as the expected value
#   (by symbol, not by file — do not recount the list here; look at that gate). It is DRY so that daemon·tauri both see
#   the same liveness logic — the same reason the shell depends on the same crate directly
#   (ADR-0129 decision: the isolation gate is per **type**, not per crate).
#   ★Do not revert this edge to `agent`★ — this crate does not know the agent runtime even **as a dependency** (ADR-0175
#   decision 1 cut it). The helper's current home is the OS-layer platform crate (ADR-0266) — gate 2 aims at that name.
#   ★Even though it is optional, gate 3's expected value stays 3★ — that gate reads with `--all-features`, so
#   the optional edge shows up as is (that is why the flag was attached in the first place).
#   ★Keep `optional = true` + the listing in the `server` list above together★ — if written as a bare `{ path = … }`, the zero-feature
#   combination silently carries it (the source of truth for the same failure mode = the `[features]` comment above).
engram-dashboard-platform = { path = "../engram-dashboard-platform", optional = true }

# macros = `tokio::select!` (write_task's 3 arms: queue/close_signal/keepalive) + `#[tokio::test]`.
# net/sync/time = TcpStream·mpsc·Notify·timeout/interval. Same 1.x pin as daemon.
# ★`rt-multi-thread` is wider than needed (intentional reservation)★: what the task spawn in `handle_connection` requires is
#   **`rt`**, and this crate has neither a runtime builder nor `flavor = "multi_thread"` (both 0 uses). The only reason
#   it is still not narrowed = this slice is a **pure move**, so it adds no behavior-adjacent change.
#   ★Do not use "the daemon turns it on anyway, so narrowing is the same" as the rationale★: feature union is **per invocation**, so that holds
#   only when the daemon is built together. In this crate's standalone build/test (`cargo build|test -p engram-dashboard-net` —
#   the very isolated path the lib.rs header advertises), the features written here are the effective set as is.
#   The narrowing to `rt` is deferred to a separate unit.
# `signal` is not added — Ctrl-C is daemon lifecycle management and this crate has 0 uses of `ctrl_c` (the accept loop is
#   still in the assembly part, which holds it).
tokio = { version = "1", features = [
    "rt-multi-thread",
    "macros",
    "net",
    "sync",
    "time",
], optional = true }
# WS server: accept_hdr_async (Origin callback)/split/Message. No TLS such as rustls needed (local plain-text WS).
tokio-tungstenite = { version = "0.26", optional = true }
# Used for the port trait signature's `future::BoxFuture` (async fn in trait is not dyn compatible, so boxing is manual) and for `ws`'s WS
#   lifecycle · stream abstractions (the `stream::SplitSink` writer half alias · `SinkExt` · `StreamExt` · the `Stream`
#   bound of `read_task<S>`). Isolation tests also use `stream::iter` (synthetic frame sequence) · `poll!` (positive observation of saturation park).
#   See the exact uses with `rg "futures_util|SinkExt|StreamExt|Stream\b" src/` — do not take a list here
#   as the expected value (counted three times, one entry short three times).
futures-util = { version = "0.3", optional = true }
# Used for the auth handshake — the only production-path use is the spot where `ws.rs` parses the first frame as `auth::AuthFrame`,
#   and tests use it further to synthesize that handshake. Every other frame is handled only as opaque text/bytes,
#   so if JSON interpretation grows outside the handshake, it is a signal that the vocabulary isolation is leaking.
serde_json = { version = "1", optional = true }
tracing = { version = "0.1", optional = true }

# ★Win32 crate dependency 0 (intended)★: OS calls are made by the platform crate — both `instance`'s shared-restricted open (`fs::`) and
#   `portfile`'s pid liveness (`process::`) live there (see the platform dependency comment above · ADR-0266).
#   ★Do not revive range locking (`std::fs::File::try_lock`)★: per MS docs an exclusive range lock denies even **reads**
#   from other processes, but this file doubles as the connection file that clients must read (ADR-0135). So the reason to
#   revive `windows` to call `LockFileEx` is gone with it.
#   ★Do not widen the share mode★ — write · delete sharing each break exclusion and file protection
#   (the two ★do not revive★ clauses in the `src/instance.rs` header).
