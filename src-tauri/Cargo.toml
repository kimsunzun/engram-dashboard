[package]
name = "engram-dashboard"
version = "0.4.0"
description = "Engram Dashboard"
authors = []
edition = "2021"

[lib]
name = "engram_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# ★Turn off the lib's built-in unit test target and replace it with `[[test]] lib_unit` below★ — only that built-in target
#   is not reached by `cargo:rustc-link-arg-tests=`, so it gets no manifest resource, and an exe without a manifest
#   binds comctl32 v5.82 (no TaskDialogIndirect) and dies at the loader stage with 0xC0000139 (see build.rs).
#   cargo's `-tests` means "targets in the tests/ folder = kind test", so declaring the same source once more as an explicit `[[test]]`
#   makes it a target that receives that argument.
# ★Remaining trap — this flag only removes it from the **default selection**★ (measured): `--lib` and `--all-targets` still pick that
#   built-in target and build `engram_dashboard_lib-<hash>.exe`, and that exe gets no manifest and still
#   dies with 0xC0000139. It is not a hole a manifest can close, so **avoid it by the invocation form** — the only correct command
#   to run this package's lib unit tests is `cargo test -p engram-dashboard --test lib_unit`.
test = false
# ★doctest is a field **independent** of `test`★ — the `test = false` above does not turn it off (it defaults to true,
#   and the rlib crate-type keeps the target eligible), so it is turned off here. Why off = this package has no
#   doctest (no code fence in its doc comments).
doctest = false

# The actual run target of the lib unit tests (`mod tests`, across src/**). It pairs with `[lib] test = false` above, so
#   touching only one of the two makes the tests vanish entirely or brings 0xC0000139 back.
[[test]]
name = "lib_unit"
path = "src/lib.rs"

[[bin]]
name = "engram-dashboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ★snap-overlay — default OFF (user decision Q1 2026-10-24 · TRD S26-window-chrome §8-4)★: compiles in the overlay that makes the Windows 11 snap layout menu
#   appear from the maximize button the web draws (platform `window::snap`) and its invoke `report_max_button_rect`
#   (`src/commands/snap_overlay.rs`). Compile check of the enabled build = `cargo check -p engram-dashboard --features
#   snap-overlay`. ★Do not launch a shell exe built with `cargo build`★ (`.claude/worker-rules.md` ·
#   ADR-0137) — `scripts/build-client-shell.mjs`, which builds the exe to launch, takes no feature argument. A launchable enabled build
#   is built by adding feature passing to that script on the day this feature is turned on (there is none now).
#   In a build with it off, the window fact `caption.snap_overlay` is always false, so the web does not call that invoke. That this feature is absent
#   from the production graph and that the enabled build compiles are measured by CI (`snap-overlay gate 1` · `2` in `ci.yml`). ADR-0304
[features]
snap-overlay = ["engram-dashboard-platform/snap-overlay"]

[dependencies]
# caret resolve (currently 2.11.3 = latest 2.x). 2.11.3 absorbs the channel-data deadlock fix
#   (carrier research 2026-06-28: docs/research/tauri-channel-multiwindow-carrier-…). Channel spike verified.
# ADR-0026 step 2: tray-icon = native system tray, image-ico = .ico decoding for Image::from_bytes (decodes the tray
# icon from .ico into RGBA to make the color/gray pair — no separate image crate needed).
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-opener = "2"
# Adding a preset path = native folder picker dialog (an OS window outside the webview). The frontend PresetPalette right-click "Add"
#   calls it via open({directory:true}) of @tauri-apps/plugin-dialog. Only dialog:allow-open is granted (default.json).
tauri-plugin-dialog = "2"
# single-instance: ADR-0029 (daemon-only) — the app is a global single instance as the daemon client (plugin always registered).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
# S14 ViewManager: mirrors the layout types to the frontend (ts-rs). ★Exported only from inside src-tauri, not from the
# protocol/daemon crate★ — daemon UI agnosticism (ADR-0035): View/Layout/Slot types must not leak into the daemon or protocol.
ts-rs = { version = "10", features = ["uuid-impl"] }
tracing = "0.1"
thiserror = "1"   # discovery::DiscoveryError
dunce = "1"       # absolute daemon exe path (canonicalize, avoiding UNC) — WMI returns RV=9 for a relative path
# File log init (`logging::init_logging_with_file`) and `mask_secrets` — moved from the core to the leaf crate by
#   ADR-0175 decision 1. Picking the cwd spelling the user typed for `agent.spawnInto` (`path::normalize_spelling`) also comes
#   from here (ADR-0270 decision 5 — `normalize_cwd` goes to base · decision 1 — the shell does not depend on agent).
#   Lock poison recovery (`sync::lock` etc. — ADR-0275) also comes from here.
engram-dashboard-base = { path = "../crates/engram-dashboard-base" }
# ★Do not bring `engram-dashboard-agent` back here★ — the shell does not depend on the agent crate (ADR-0270 decision 1 ·
#   ADR-0029). The backend policy is carried by the daemon's `SpawnByCwd` handler (ADR-0279), the daemon-name wall by the daemon's registration bounce.
#   Wall = CI `shell gate 1` (0 agent lines in this package's normal · build graph).
#   ★Still, this package's test build compiles `agent`★ — the `daemon` in the dev-dependencies below pulls it
#   in (that edge stays — ADR-0286). The gain is on the release build side.
# ADR-0155: this shell is the owner that **declares** `window`/`tab`/`slot`, so it needs the declaration macro, table, envelope and delivery.
#   ★Not a new third party★ — this crate has 0 workspace dependencies, and even before it was listed here it was already linked
#   into this shell's dependency graph through agent (only a direct edge is added).
engram-dashboard-command = { path = "../crates/engram-dashboard-command" }
# discovery: the daemon.json shared contract (DaemonInfo) + PROTOCOL_VERSION · the daemon WS first frame (`handshake::AuthFrame`).
#   The first frame's shape lives in protocol (ADR-0310 decision 9), so the shell needs no daemon-side crate for it.
engram-dashboard-protocol = { path = "../crates/engram-dashboard-protocol" }
# ADR-0266: OS layer — every OS task of this shell comes from here.
#   Finding and starting the daemon (`crate::discovery`) — PID liveness (`process::pid_alive_with_start_time`), the
#   daemon exe's path and file name (`env::sibling_exe` · `env::exe_file_name` — `locate_daemon_exe`), starting outside
#   the Job (`spawn::spawn_outside_job` — WMI). Stopping it (`crate::daemon_client::shutdown`) — the identity-checked
#   kill fallback (`process::terminate_if_same`).
#   Screen state (`crate::state`) — liveness of a temp file's owner when sweeping the state folder (`process::pid_alive`
#   — `state::boot`'s `sweep_temps`), and the foreground-window check that decides whether main gets focus at the end
#   of a runtime-restore accept (`window::foreground_is_current_process` — `state::placement`'s `foreground_is_ours`).
#   The snap layout overlay (`window::snap`) only with `[features] snap-overlay` above — that feature turns on
#   platform's feature of the same name.
#   The stop path (`daemon_client::shutdown`) — whether the target still runs (`process::presence`) and the
#   identity-checked kill (`process::terminate_if_same` — ADR-0343).
#   ★Do not bring `windows` back directly into this shell★ — OS crate production dependencies live only in platform (CI `platform gate 5`).
#   ★Do not turn on `test-support` in production dependencies★ (CI `platform gate 3` — test features only in the dev re-declaration below).
engram-dashboard-platform = { path = "../crates/engram-dashboard-platform" }
# Reusable transport lib (ADR-0177) — the shell's daemon link (`daemon_client::link`) is built on it (TRD S21 trd-3 §6-2
#   U2 · ADR-0310). `ws` = the real-socket dialer. Not a new third-party package set: tokio · futures-util ·
#   tokio-tungstenite 0.26 are already in this graph.
#   ★Never turn on `test-support` here★ — the harness is for tests only (dev re-declaration below). Wall = CI
#   `shell gate 5` (0 lines of that feature in this package's normal · build graph).
engram-dashboard-transport = { path = "../crates/engram-dashboard-transport", features = ["ws"] }
# ★No direct `tungstenite` here★ — the stop client runs on the transport (`daemon_client::link::stop` · TRD S21
#   trd-3-2-u5 §3-5). Wall = CI `shell gate 6` (no `tungstenite` among this package's direct normal dependencies).
tauri-plugin-autostart = "2"

# T1 (S14 module ①): to add DaemonClient (async WS client) + OutputRouter (arc-swap),
#   restores the async/WS deps removed in ADR-0029. Versions aligned with the daemon crate (ADR-0036).
# Daemon: tokio 1 / tokio-tungstenite 0.26 / futures-util 0.3 / serde_json 1 (measured from Cargo.toml).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# `BoxFuture` — the boxed futures of the link dialer and the connection driver.
futures-util = "0.3"
# `raw_value` = the edge that unpacks a command field's raw text (ADR-0272 decision 4) — protocol already enables it at the same version (no new package).
serde_json = { version = "1", features = ["raw_value"] }
# OutputRouter hot-path lock-free snapshot (spike §2 FIX-F6). Not in the daemon, so the latest stable 1.x.
arc-swap = "1"

[dev-dependencies]
# The daemon crate for tests only (ADR-0286 — the release graph has no daemon): the data-folder same-path test and the
#   write-check race test (`discovery`) call the daemon's canonical `data_dir` through this edge, and `layout_commands`
#   reads the daemon's command delivery deadline. The day this edge goes or narrows, those tests move (ADR-0271
#   decision 4). No daemon feature: nothing here uses its in-process test server (`test-support`).
engram-dashboard-daemon = { path = "../crates/engram-dashboard-daemon" }
# The daemon side of the production-transport test (a real ws accept — `daemon_client::connection::tests`) and the
#   sync client of the close-race diagnostics in `tests/stop_smoke.rs` (its re-exported `tungstenite`). Tests only: no
#   shell code outside tests uses it (the real-socket dialer comes from the transport's `ws` feature).
tokio-tungstenite = "0.26"
# `test-util` = paused tokio time (`tokio::time::pause` / `advance`) — timer tests (the usage shrink timer and others)
#   run on it instead of the wall clock (ADR-0038 — no magic sleeps). ★Dev only★: release builds get no `test-util`.
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread", "time", "sync", "net"] }
# feature-only re-declaration — the WMI flag diagnostic test (`real_wmi_spawn_flag_matrix` · `#[ignore]`) uses the raw call
#   (`spawn::wmi_create_raw`) that does not raise rejection codes as errors. The feature request is only in the dev graph, so it is not
#   merged into the production binary (the platform test-feature production graph gate measures it).
#   ★But if the lib and test targets are built in one cargo invocation (`--all-targets` etc.), this feature is merged into that invocation's
#   shell production binary★ — the same risk class as the self-dev-dependency in the daemon `Cargo.toml` 「production build caution」, and the gate above
#   cannot see that shape (it reads only the resolved graph — the 「Limits」 in the same step's comment in `ci.yml`). Release builds are not built that way.
engram-dashboard-platform = { path = "../crates/engram-dashboard-platform", features = ["test-support"] }
# Feature re-declaration — the link tests drive `daemon_client::link` over the transport's in-memory harness
#   (`MemoryNetwork` · `ManualClock`). The request stays in the dev graph, so release binaries do not get it
#   (CI `shell gate 5` checks the resolved normal graph; the `--all-targets` caveat above applies the same way).
engram-dashboard-transport = { path = "../crates/engram-dashboard-transport", features = ["test-support", "ws"] }
# Temp data folder isolation for the real daemon graceful-stop round-trip test (`tests/stop_smoke.rs` · `#[ignore]`).
tempfile = "3"
# feature-only re-declaration — reads the docking golden (`src/layout/bands_golden.json`) bit-exactly. Without this feature serde_json
#   reads 17-digit decimals 1 ULP off (measured 2026-10-20 — 0.20833333333333334 → …37) and the golden assertions go falsely red.
#   There is no new package and it is only in the dev graph, so the production binary's parsing is unchanged.
serde_json = { version = "1", features = ["float_roundtrip"] }

# profile.release moved to the workspace root (../Cargo.toml) (ignored when placed in a member).
