[package]
name = "engram-dashboard"
version = "0.4.0"
description = "Engram Dashboard"
authors = []
edition = "2021"

[lib]
name = "engram_dashboard_lib"
crate-type = ["staticlib", "cdylib", "rlib"]
# ★lib 내장 유닛테스트 타깃을 끄고 아래 `[[test]] lib_unit` 으로 대체한다★ — 그 내장 타깃만은
#   `cargo:rustc-link-arg-tests=` 가 닿지 않아 manifest 리소스를 못 받고, manifest 없는 exe 는
#   comctl32 v5.82(TaskDialogIndirect 없음)를 물어 로더 단계에서 0xC0000139 로 죽는다(build.rs 참조).
#   cargo 의 `-tests` 는 「tests/ 폴더 타깃 = kind test」를 뜻하므로, 같은 소스를 명시 `[[test]]` 로
#   한 번 더 선언하면 그 인자를 받는 타깃이 된다.
# ★남는 함정 — 이 플래그는 **기본 선택**에서만 뺀다★(실측): `--lib` 도 `--all-targets` 도 여전히 그
#   내장 타깃을 골라 `engram_dashboard_lib-<hash>.exe` 를 짓고, 그 exe 는 manifest 를 못 받아 그대로
#   0xC0000139 로 죽는다. 매니페스트로 닫을 수 있는 구멍이 아니니 **호출 형태로 피한다** — 이 패키지의
#   lib 유닛테스트를 도는 유일하게 올바른 명령은 `cargo test -p engram-dashboard --test lib_unit` 이다.
test = false
# ★doctest is a field **independent** of `test`★ — the `test = false` above does not turn it off (it defaults to true,
#   and the rlib crate-type keeps the target eligible), so it is turned off here. Why off = this package has no
#   doctest (no code fence in its doc comments).
doctest = false

# lib 유닛테스트(`mod tests`, src/** 전역)의 실제 실행 타깃. 위 `[lib] test = false` 의 짝이라
#   둘 중 하나만 손대면 테스트가 통째로 사라지거나 0xC0000139 가 돌아온다.
[[test]]
name = "lib_unit"
path = "src/lib.rs"

[[bin]]
name = "engram-dashboard"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

# ★snap-overlay — 기본 OFF(사용자 결정 Q1 2026-10-24 · TRD S26-window-chrome §8-4)★: Windows 11 스냅 레이아웃 메뉴를 웹이
#   그린 최대화 단추에서 뜨게 하는 오버레이(platform `window::snap`)와 그 invoke `report_max_button_rect`
#   (`src/commands/snap_overlay.rs`)를 컴파일에 넣는다. 켠 빌드의 컴파일 확인 = `cargo check -p engram-dashboard --features
#   snap-overlay`. ★`cargo build` 로 지은 셸 exe 는 띄우지 않는다★(`.claude/worker-rules.md` ·
#   ADR-0137) — 띄울 exe 를 짓는 `scripts/build-client-shell.mjs` 는 기능 인자를 받지 않는다. 띄울 수 있는 켠 빌드는 이
#   기능을 켜는 날 그 스크립트에 기능 넘기기를 더해서 짓는다(지금은 없다).
#   꺼진 빌드에서 창 사실 `caption.snap_overlay` 는 늘 거짓이라 웹이 그 invoke 를 부르지 않는다. 운영 그래프에 이 기능이
#   없다는 것과 켠 빌드가 컴파일된다는 것은 CI 가 잰다(`ci.yml` 의 `snap-overlay gate 1` · `2`). ADR-0304
[features]
snap-overlay = ["engram-dashboard-platform/snap-overlay"]

[dependencies]
# caret resolve(현재 2.11.3 = 최신 2.x). 2.11.3에서 channel-data 데드락 수정 흡수
#   (carrier 리서치 2026-06-28: docs/research/tauri-channel-multiwindow-carrier-…). Channel spike 검증 완료.
# ADR-0026 2단계: tray-icon=네이티브 시스템 트레이, image-ico=Image::from_bytes 의 .ico 디코드(트레이
# 아이콘을 .ico 에서 RGBA 로 풀어 컬러/회색 두 벌 생성 — 별도 image crate 불필요).
tauri = { version = "2", features = ["tray-icon", "image-ico"] }
tauri-plugin-opener = "2"
# 프리셋 경로 추가 = 네이티브 폴더 선택 다이얼로그(webview 밖 OS 창). 프론트 PresetPalette 우클릭 "추가"가
#   @tauri-apps/plugin-dialog 의 open({directory:true}) 로 호출한다. 권한은 dialog:allow-open 만 부여(default.json).
tauri-plugin-dialog = "2"
# single-instance: ADR-0029(daemon-only) — 앱은 데몬 클라이언트 전역 단일 인스턴스(플러그인 무조건 등록).
tauri-plugin-single-instance = "2"
serde = { version = "1", features = ["derive"] }
uuid = { version = "1.8", features = ["v4", "serde"] }
# S14 ViewManager: 레이아웃 타입을 프론트로 미러(ts-rs). ★protocol/daemon crate 가 아니라 src-tauri
# 안에서만 export★ — 데몬 UI 불가지론(ADR-0035): View/Layout/Slot 타입은 데몬·protocol 에 누설 금지.
ts-rs = { version = "10", features = ["uuid-impl"] }
tracing = "0.1"
thiserror = "1"   # discovery::DiscoveryError
dunce = "1"       # daemon exe 절대경로(canonicalize, UNC 회피) — WMI 는 상대경로면 RV=9
# 파일 로그 초기화(`logging::init_logging_with_file`)와 `mask_secrets` — ADR-0175 결정 1 로 코어에서
#   잎 crate 로 이사했다. `agent.spawnInto` 의 친 cwd 철자 고르기(`path::normalize_spelling`)도 여기서
#   온다(ADR-0270 결정 5 — `normalize_cwd` 는 base 로 · 결정 1 — 셸은 agent 를 의존하지 않는다).
#   락 오염 되찾기(`sync::lock` 등 — ADR-0275)도 여기서 온다.
engram-dashboard-base = { path = "../crates/engram-dashboard-base" }
# ★`engram-dashboard-agent` 를 여기 되살리지 말 것★ — 셸은 agent crate 를 의존하지 않는다(ADR-0270 결정 1 ·
#   ADR-0029). 백엔드 정책은 데몬 `SpawnByCwd` 처리부가(ADR-0279), 데몬 이름의 벽은 데몬 등록 반려가 진다.
#   벽 = CI `shell gate 1`(이 패키지의 normal · build 그래프에 agent 0 줄).
#   ★그래도 이 패키지의 테스트 빌드는 `agent` 를 컴파일한다★ — 아래 dev-dependencies 의 `daemon` 이 물고
#   온다(그 간선은 남긴다 — ADR-0286). 이득은 릴리스 빌드 쪽이다.
# ADR-0155: 이 셸이 `window`/`tab`/`slot` 을 **선언**하는 주인이라 선언 매크로·표·봉투·배달이 필요하다.
#   ★새 서드파티가 아니다★ — 이 crate 는 워크스페이스 의존 0 이고, 여기 적기 전에도 agent 를 타고 이미
#   이 셸의 의존 그래프에 링크돼 있었다(직접 간선만 는다).
engram-dashboard-command = { path = "../crates/engram-dashboard-command" }
# discovery: the daemon.json shared contract (DaemonInfo) + PROTOCOL_VERSION · the daemon WS first frame (`handshake::AuthFrame`).
#   The first frame's shape lives in protocol (ADR-0310 decision 9), so the shell needs no daemon-side crate for it.
engram-dashboard-protocol = { path = "../crates/engram-dashboard-protocol" }
# ADR-0266: OS layer — every OS task of this shell comes from here.
#   Finding and starting the daemon (`crate::discovery`) — PID liveness (`process::pid_alive_with_start_time`), the
#   daemon exe's path and file name (`env::sibling_exe` · `env::exe_file_name` — `locate_daemon_exe`), starting outside
#   the Job (`spawn::spawn_outside_job` — WMI). Stopping it (`crate::daemon_client::shutdown`) — the identity-checked
#   kill fallback (`process::terminate_if_same`).
#   Screen state (`crate::state`) — liveness of a temp file's owner when sweeping the state folder (`process::pid_alive`
#   — `state::boot`'s `sweep_temps`), and the foreground-window check that decides whether main gets focus at the end
#   of a runtime-restore accept (`window::foreground_is_current_process` — `state::placement`'s `foreground_is_ours`).
#   The snap layout overlay (`window::snap`) only with `[features] snap-overlay` above — that feature turns on
#   platform's feature of the same name.
#   The stop path (`daemon_client::shutdown`) — whether the target still runs (`process::presence`) and the
#   identity-checked kill (`process::terminate_if_same` — ADR-0343).
#   ★`windows` 를 이 셸에 직접 되살리지 말 것★ — OS crate 운영 의존은 platform 하나에만 둔다(CI `platform gate 5`).
#   ★운영 의존에서 `test-support` 를 켜지 않는다★(CI `platform gate 3` — 시험 기능은 아래 dev 재선언에서만).
engram-dashboard-platform = { path = "../crates/engram-dashboard-platform" }
# Reusable transport lib (ADR-0177) — the shell's daemon link (`daemon_client::link`) is built on it (TRD S21 trd-3 §6-2
#   U2 · ADR-0310). `ws` = the real-socket dialer. Not a new third-party package set: tokio · futures-util ·
#   tokio-tungstenite 0.26 are already in this graph.
#   ★Never turn on `test-support` here★ — the harness is for tests only (dev re-declaration below). Wall = CI
#   `shell gate 5` (0 lines of that feature in this package's normal · build graph).
engram-dashboard-transport = { path = "../crates/engram-dashboard-transport", features = ["ws"] }
# ★No direct `tungstenite` here★ — the stop client runs on the transport (`daemon_client::link::stop` · TRD S21
#   trd-3-2-u5 §3-5). Wall = CI `shell gate 6` (no `tungstenite` among this package's direct normal dependencies).
tauri-plugin-autostart = "2"

# T1(S14 모듈①): DaemonClient(비동기 WS 클라이언트) + OutputRouter(arc-swap) 신설을 위해
#   ADR-0029에서 제거했던 async/WS 관련 deps를 복원한다. 버전은 daemon crate와 정렬(ADR-0036).
# 데몬: tokio 1 / tokio-tungstenite 0.26 / futures-util 0.3 / serde_json 1 (Cargo.toml 실측).
tokio = { version = "1", features = ["rt-multi-thread", "macros", "net", "sync", "time", "signal"] }
# `BoxFuture` — the boxed futures of the link dialer and the connection driver.
futures-util = "0.3"
# `raw_value` = 명령 칸 원문을 푸는 끝자락(ADR-0272 결정 4) — protocol 이 같은 판에 이미 켠다(새 패키지 없음).
serde_json = { version = "1", features = ["raw_value"] }
# OutputRouter 핫패스 lock-free snapshot (spike §2 FIX-F6). 데몬에 없으므로 최신 1.x 안정 버전.
arc-swap = "1"

[dev-dependencies]
# The daemon crate for tests only (ADR-0286 — the release graph has no daemon): the data-folder same-path test and the
#   write-check race test (`discovery`) call the daemon's canonical `data_dir` through this edge, and `layout_commands`
#   reads the daemon's command delivery deadline. The day this edge goes or narrows, those tests move (ADR-0271
#   decision 4). No daemon feature: nothing here uses its in-process test server (`test-support`).
engram-dashboard-daemon = { path = "../crates/engram-dashboard-daemon" }
# The daemon side of the production-transport test (a real ws accept — `daemon_client::connection::tests`) and the
#   sync client of the close-race diagnostics in `tests/stop_smoke.rs` (its re-exported `tungstenite`). Tests only: no
#   shell code outside tests uses it (the real-socket dialer comes from the transport's `ws` feature).
tokio-tungstenite = "0.26"
# `test-util` = paused tokio time (`tokio::time::pause` / `advance`) — timer tests (the usage shrink timer and others)
#   run on it instead of the wall clock (ADR-0038 — no magic sleeps). ★Dev only★: release builds get no `test-util`.
tokio = { version = "1", features = ["test-util", "macros", "rt-multi-thread", "time", "sync", "net"] }
# feature-only 재선언 — WMI 플래그 진단 시험(`real_wmi_spawn_flag_matrix` · `#[ignore]`)이 거절 코드를 오류로
#   올리지 않는 원시 호출(`spawn::wmi_create_raw`)을 쓴다. 기능 요청이 dev 그래프에만 있어 운영 바이너리엔
#   합쳐지지 않는다(platform 시험 기능 운영 그래프 게이트가 잰다).
#   ★단 lib 과 시험 타깃을 한 cargo 호출로 지으면(`--all-targets` 등) 이 기능이 그 호출의 셸 운영 바이너리로
#   합쳐진다★ — 데몬 `Cargo.toml` 「운영 빌드 주의」의 self-dev-dependency 와 같은 위험군이고, 위 게이트는 그 꼴을
#   못 본다(해석된 그래프만 읽는다 — `ci.yml` 같은 스텝 주석의 「한계」). 배포용 빌드는 그렇게 짓지 않는다.
engram-dashboard-platform = { path = "../crates/engram-dashboard-platform", features = ["test-support"] }
# Feature re-declaration — the link tests drive `daemon_client::link` over the transport's in-memory harness
#   (`MemoryNetwork` · `ManualClock`). The request stays in the dev graph, so release binaries do not get it
#   (CI `shell gate 5` checks the resolved normal graph; the `--all-targets` caveat above applies the same way).
engram-dashboard-transport = { path = "../crates/engram-dashboard-transport", features = ["test-support", "ws"] }
# 실 데몬 graceful 끄기 왕복 시험(`tests/stop_smoke.rs` · `#[ignore]`)의 임시 데이터 폴더 격리.
tempfile = "3"
# feature-only 재선언 — 도킹 골든(`src/layout/bands_golden.json`)을 비트 단위로 읽는다. 이 기능이 없으면 serde_json 이
#   17 자리 소수를 1 ULP 어긋나게 읽어(실측 2026-10-20 — 0.20833333333333334 → …37) 골든 단언이 거짓으로 빨개진다.
#   새 패키지는 없고 dev 그래프에만 있어 운영 바이너리의 파싱은 그대로다.
serde_json = { version = "1", features = ["float_roundtrip"] }

# profile.release 는 workspace 루트(../Cargo.toml)로 이동(멤버에 두면 무시됨).
