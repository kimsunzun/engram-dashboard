name: CI

on:
  push:
    # ★모든 브랜치★ — 좁히면 그 브랜치 작업에는 게이트가 아예 없어진다. 로컬을 quick 으로 낮춘
    # 분담(`/qa` 바인딩)과 맞물리면 무게이트 구간이 생긴다. public repo 라 러너 비용이 0 이다.
    # ★이 말은 브랜치 축의 것이다★ — 경로 축은 아래 `paths` 가 문서 경로만 뺀다. 어느 브랜치든
    # 문서 밖 파일을 하나라도 바꾼 push 는 그대로 전부 돈다.
    branches:
      - '**'
    # 버전 태그 push = 릴리즈 트리거(맨 아래 release-build → release-publish 2단). 태그 push 에서는
    # 검증 3잡도 함께 도는데 이건 중복 낭비가 아니라 게이트다 — release-build 가
    # `needs: [backend, gates, frontend]` 로 그 결과에 매달린다.
    # 태그는 아무 커밋에나 달 수 있어(master 를 거치지 않은 커밋·CI 가 빨간 커밋 포함)
    # "이 커밋은 master 에서 이미 초록이었다"를 전제할 수 없다. 3잡에 `if` 를 달아 태그에서 건너뛰면
    # 그 전제를 CI 가 확인 없이 믿게 되고, 검증된 적 없는 커밋에서 배포물이 나갈 수 있다.
    tags:
      - 'v*'
    # ADR-0232: 바뀐 파일이 **전부** 아래에서 빠진 경로 안이면 이 워크플로를 띄우지 않는다. 목록의 정본은
    # 여기다 — 다른 문서에 베끼지 않는다.
    # ★제외 목록(denylist)이다★ — 첫 줄 `'**'` 가 전부를 넣고(경로 필터가 없을 때의 기본 동작과 같다) `!` 줄이
    # 빼므로, 모르는 경로는 전부 "돈다"로 떨어진다. 포함 목록은 한 항목을 빠뜨리면 그 경로에서 게이트가
    # **조용히 사라지고**, 제외 목록은 빠뜨려도 **한 번 더 돌 뿐**이다. CI 에 닿는 경로는 흩어져 있고 이름만으로는
    # 안 보인다(`prompts/` · `rust-toolchain.toml` · `vitest.config.ts` 같은 것).
    # `paths-ignore` 가 아니라 `paths` 인 것은 되살리기 때문이다 — 문서는 제외만 할 때 `paths-ignore`, 포함과
    # 제외를 섞을 때 `!` 를 붙인 `paths` 를 권하고, 한 이벤트에 둘을 함께 둘 수 없다(GitHub 문서 "Workflow
    # syntax" — `paths`/`paths-ignore` 절).
    # ★순서가 뜻이다 — 뒤에 맞는 패턴이 앞의 판정을 뒤집는다★. 그래서 되살리는 줄은 **맨 끝**에 둔다 — 그 뒤에
    # `!` 줄을 더하면 도로 빠진다.
    # ★제외를 더하기 전에 그 경로 아래를 CI·빌드 스크립트·코드·테스트가 읽는지부터 본다 — 읽는 파일이 있으면
    # 끝에서 그 파일을 되살린다★. 빠진 경로만 바뀐 push 는 어떤 게이트도 보지 않는다.
    # ★`**/*.md` 로 넓히지 말 것★ — `prompts/engram-help.md` 는 `include_str!` 로 바이너리에 구워지고
    # (`crates/engram-dashboard-daemon/src/bin/engram.rs:231`) `prompts/agent-priming.md` 는 배포판에 실린다
    # (`scripts/build-release.ps1` manifest). 둘 다 확장자로는 문서와 구분되지 않는다.
    # 태그 push 에는 경로 필터가 평가되지 않는다(같은 절) — 위 `v*` 릴리즈 트리거는 이 목록과 무관하게 돈다.
    # `workflow_dispatch` 에는 경로 필터가 없다.
    # 받아들인 예외(같은 절): diff 가 3,000 파일을 넘고 필터에 맞는 파일이 앞 3,000 개 안에 없으면 돌지 않는다.
    # ★이 워크플로의 체크를 branch protection·ruleset 의 필수 체크로 걸면 문서만 바꾼 브랜치의 PR 이 머지를
    # 못 한다★ — 경로 필터로 건너뛴 워크플로의 체크는 "Pending" 으로 남는다(GitHub 문서 "Troubleshooting
    # required status checks" — skipped but required 절). 필수 체크를 걸게 되면 ADR-0232 를 다시 연다.
    paths:
      - '**'
      - '!docs/**'
      - '!CLAUDE.md'
      - '!README.md'
      - '!.claude/**'
      - '.claude/skill-bindings/qa.md' # frontend 잡의 `npm test` 가 읽는다(`src/util/launcherWiring.test.ts:76`)
  pull_request:
    branches:
      - master
    # 위 push 의 `paths` 와 같은 목록이다 — 순서까지(ADR-0232). 한쪽만 고치면 push 와 PR 이 서로 다른 변경에서
    # 돈다. PR 은 이번 push 가 아니라 PR 전체의 변경(토픽 브랜치가 base 와 마지막으로 맞춰진 커밋부터의
    # three-dot diff)으로 판정된다(GitHub 문서 "Workflow syntax" — Git diff comparisons 절).
    paths:
      - '**'
      - '!docs/**'
      - '!CLAUDE.md'
      - '!README.md'
      - '!.claude/**'
      - '.claude/skill-bindings/qa.md'
  workflow_dispatch:

# 같은 ref 에 새 push 가 실행을 띄우면 앞 실행을 취소한다(뒤진 결과로 판정하지 않기 위해).
# ★단 태그 실행은 예외★ — 이 워크플로에는 이제 되돌릴 수 없는 외부 부작용(릴리즈 생성 + 에셋 업로드)을
# 가진 잡(release-publish)이 있다. 실행 중 취소는 잡을 죽이므로 "릴리즈는 생겼는데 에셋이 없거나 잘린"
# 상태를 남기고, 재시도는 'release already exists' 로 죽는다(자동 회복 없음).
# job-level concurrency 로는 이걸 막을 수 없다 — 워크플로 레벨 취소는 **런 전체**를 죽이고, 그 안의 잡은
# 자기 그룹이 무엇이든 함께 죽는다. 그래서 취소 여부 자체를 여기서 ref 종류로 가른다.
# 검증 3잡의 브랜치·PR 동작은 종전과 동일(true)하다 — 그들이 태그에서 도는 것 자체가 이번에 생긴 일이라
# 이 예외로 바뀌는 기존 동작이 없다.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# 워크플로 기본값은 읽기 전용이다. job-level permissions 는 최상위를 상속이 아니라 **치환**하므로,
# 잡마다 선언한 값이 그 잡의 전부다. 현재 선언 상태:
#   backend · gates · frontend  — 선언 없음 → 최상위 그대로 contents: read
#   release-build               — contents: read 를 **명시** 선언(읽기 전용임을 눈에 보이게)
#   release-publish             — contents: write ★워크플로 전체에서 쓰기 토큰을 쥔 유일한 잡★
# 이 기본값을 write 로 넓히면 검증 3잡과 release-build 까지 쓰기 토큰을 쥐게 된다 — 넓히지 말 것.
# 각 job 의 checkout 은 persist-credentials: false 로 토큰을 작업본에 남기지 않는다
# — 검증 대상 코드가 같은 러너에서 돌기 때문.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1

jobs:
  # ── 백엔드 회귀 ──────────────────────────────────────────────────────────────
  # windows-latest 단독인 이유: Job Object 코드가 `#[cfg(windows)]` 이고 PTY 픽스처가 cmd.exe/
  # powershell.exe 라 리눅스는 이 워크스페이스에서 검증된 적이 없다.
  backend:
    name: backend (cargo test + build)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve and assert pinned toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          # 기대값을 YAML 에 적지 않고 rust-toolchain.toml 에서 읽는다 — 두 곳에 적으면 어긋난다.
          # 단언이 없으면 그 파일이 지워지거나 RUSTUP_TOOLCHAIN 이 끼어들 때 러너 기본 stable 로
          # 조용히 내려앉은 채 초록으로 남는다.
          expected=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)
          if [ -z "$expected" ]; then echo "FAIL — rust-toolchain.toml 에서 channel 을 읽지 못했다"; exit 1; fi
          actual=$(rustc --version | awk '{print $2}')
          if [ "$actual" != "$expected" ]; then
            echo "FAIL — pinned '$expected' but active rustc is '$actual'"
            exit 1
          fi
          echo "PASS — toolchain $actual matches rust-toolchain.toml"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: backend

      # `--locked` 는 아래 전부에 붙인다: 커밋된 Cargo.lock 이 낡았을 때 조용히 재해석하지 않고 실패한다.
      #
      # ★2026-08-24: `--exclude engram-dashboard` 를 뗐다 — 셸 패키지도 이 회귀에 든다★
      # 제외를 떠받치던 사유 둘이 다 죽었다. 옛①(그 lib 테스트 타깃이 0xc0000139/ENTRYPOINT_NOT_FOUND
      #   로 즉사)은 ADR-0174 의 세 다리(`[lib] test = false` + `[[test]] lib_unit` + build.rs 의
      #   `rustc-link-arg-tests`)로 해소됐고, 옛②(그 단위 스위트의 알려진 실패 32 건 — daemon_client 의
      #   app:None 단락)는 전부 고쳐졌다. 사유가 죽은 제외를 남겨 두면 이 줄이 **워크스페이스 회귀라는
      #   이름으로 멤버 하나를 조용히 건너뛴다** — `src-tauri/` 에 새 테스트 타깃이 생겨도 누가 아래에
      #   스텝을 손으로 더할 때까지 아무 데서도 안 돈다(`daemon_client_pending`·`daemon_client_replay` 가
      #   실제로 그랬다). 그 침묵이 이 패키지의 217 건을 몇 달간 가려 둔 부류다.
      #
      # ★아래 다섯 스텝과 테스트 집합이 겹친다 — 알고 남긴 중복이다★ 잡는 축이 서로 다르다:
      #   이 줄  : cargo 의 **기본 타깃 선택**을 쓴다. 그래서 세 다리 ①(`[lib] test = false`)을 지우면
      #            죽는 내장 lib 테스트 타깃이 기본 선택으로 되돌아와 **여기서** 0xC0000139 로 죽는다.
      #            아래 `--test lib_unit` 은 그 타깃을 아예 안 고르므로 ①이 사라져도 초록이다.
      #   아래 줄: `--test <이름>` 은 타깃이 **없으면 cargo 가 실패**한다. 그래서 세 다리 ②
      #            (`[[test]] lib_unit`)를 지우면 아래 스텝이 "no test target named `lib_unit`" 로 죽는다.
      #            이 줄은 그걸 못 잡는다 — 사라진 타깃은 실패가 아니라 **침묵**이다(스위트가 통째로
      #            증발한 채 초록). 세 다리 ③(링크 인자)은 양쪽 다 잡는다.
      #   ★실패 이름★: 아래 줄들은 스텝 이름이 곧 어느 스위트인지를 짚는다. 단 이 줄이 **먼저** 돌므로
      #            셸 패키지가 깨지면 여기서 먼저 빨개지고 아래 스텝은 돌지 않는다 — 그때 어느 타깃인지는
      #            스텝 이름이 아니라 cargo 출력의 테스트 바이너리 이름에서 읽는다. 스텝 이름이 짚어 주는
      #            이점은 그만큼 줄었고, 그래도 나머지 멤버 전부에는 그대로 남는다.
      #   중복 비용: 셸 패키지 테스트가 이 잡에서 두 번 돈다. 전부 인메모리 하네스·소켓뿐이라(자식 프로세스
      #            0) 초 단위고, 컴파일 산출물은 같은 잡의 target/ 을 공유한다.
      #   ★기본 선택이라 새로 링크되는 것이 하나 있다 — `[[bin]]` 의 유닛테스트 하네스★
      #            (`src/main.rs`, `#[cfg(test)]` 0 건이라 도는 테스트는 0 이다). 아래 다섯 스텝 중
      #            어느 것도 이걸 짓지 않으므로 이 줄이 처음 짓는다. **kind=bin 이라 embed-resource 의
      #            `rustc-link-arg-bins` 를 받아 manifest 가 붙는다고 본다 — 즉 0xC0000139 축 밖이다.**
      #            ★단 이건 cargo 의 링크 인자 적용 규칙에서 따라 나온 추론이지 이 조합의 실측이 아니다★
      #            (실측된 것은 lib 내장 타깃이 `-tests` 를 못 받는다는 반대쪽 사실 — ADR-0174).
      #            여기서 0xC0000139 가 나오면 그 추론이 틀린 것이니 `[[bin]] test = false` 로 끈다.
      #
      # ★아래 --skip 6건 = CI 레인 한정 제외(실 claude 바이너리 의존 축)★
      # 이 6건은 수신자로 **실 claude** 를 띄워 턴 신호·중계를 관측한다. 러너에는 claude 가 없다.
      # 스폰 실패 가드(`spawn_json_agent` → `require_claude`)가 있지만 러너에서는 못 막는다:
      # 그 가드는 ① spawn 호출 성공 ② 5초 내 목록 등장 만 보는데, claude 부재 시에도 프로세스는
      # 일단 떠서 목록에 잠깐 잡히고 곧 죽는다 → 가드 통과 후 "잠듦" 상태에서 단언이 깨진다.
      # 어느 건이 터지는지는 러너 타이밍에 따라 달라진다(run 31168638281 = c2_live,
      # 31169137744 = mcp_send_message — 같은 코드에 다른 실패). 그래서 개별이 아니라 축 단위로 뺀다.
      # ★이 축의 CI 커버리지는 0 이고 그것을 받아들였다★ — 로컬(claude 있음)에서만 검증된다. 그래서
      # 로컬에서는 관측 실패가 통과가 아니라 실패다(사용자 결정 2026-10-02 · T-46) — 단 c1 은 `#[ignore]`.
      # claude 부재는 위 가드가 못 잡고(스폰은 성공한다) 뒤의 단언이 실패한다.
      - name: cargo test --workspace
        shell: bash
        run: |
          cargo test --locked --workspace -- \
            --skip c1_park_then_spawn_auto_delivers \
            --skip c2_live_mid_turn_send_parks_and_delivers_after_turn_end \
            --skip control_send_delivery_observation_records_bytes_and_correlated_ids \
            --skip control_send_relays_wrapped_line_to_json_agent \
            --skip control_send_revoked_sender_still_delivers_observation \
            --skip mcp_send_message_tool_happy_and_error

      # 아래 다섯 스텝 = 셸 패키지(`engram-dashboard`)의 테스트 타깃을 **하나씩** 집는다 —
      #   통합 4종(`src-tauri/tests/`) + 단위 스위트 1종(`lib_unit` = `[[test]] path = "src/lib.rs"`).
      #   ★`src-tauri/tests/stop_smoke.rs` 에는 스텝을 세우지 않는다★ — 시험 셋이 전부 `#[ignore]` 라 여기서 돌
      #   것이 없고, 컴파일은 위 워크스페이스 회귀가 덮는다(실행은 로컬 실 데몬 레인 — `/qa` 바인딩).
      # ★2026-08-24: 이제 이 스위트들의 유일한 실행 경로가 아니다★ — 위 워크스페이스 회귀가 이 패키지를
      #   함께 돈다(제외 해제 · 겹침을 남긴 사유의 정본 = 그 스텝 주석). 이 다섯 줄이 남아 있는 값어치는
      #   둘이다: ① 실패가 **어느 스위트**에서 났는지를 스텝 이름이 짚는다(「실패 보고 시 게이트 명칭」).
      #   ② `--test lib_unit` 은 **타깃 부재를 실패로** 만든다 — 위 줄이 구조적으로 못 잡는 축이다.
      # 통합 타깃(`src-tauri/tests/`)은 engram_dashboard_lib 를 rlib 으로 소비해 정상 기립한다
      #   (실측 2026-08-17 — Wry 사슬이 링크에서 빠진다. ADR-0174 「근거」).
      # ★맨 아래 `cargo build --locked` 가 이걸 대신하지 않는다★ — build 는 테스트 타깃을 컴파일하지
      #   않는다(컴파일 커버리지 자체는 이제 위 워크스페이스 회귀도 함께 준다 — 그래도 이 줄들이 지는
      #   ①②는 그쪽에 없다).
      # ★`--test <이름>` 을 `--lib` 이나 `--all-targets` 로 바꾸지 말 것★ — 그 둘은 **여전히 즉사한다**.
      #   `[lib] test = false` 는 **기본 선택**에서만 빼므로 명시로 부르면 manifest 를 못 받는 내장 lib
      #   테스트 타깃이 그대로 골라져 0xC0000139 로 죽는다(ADR-0174 「영향/불변식」 · 실측 2026-08-24).
      # ★`-p` 단독·`--tests` 로 넓히지도 말 것★ — 이쪽은 즉사하지 않는다(둘 다 기본 선택을 따라 그 내장
      #   타깃을 안 고른다). 넓히면 안 되는 이유는 위 ① 하나다: 다섯 타깃이 한 스텝에 뭉치면 어느 타깃이
      #   깨졌는지가 판정에서 섞인다. (옛 사유 "`lib_unit` 의 알려진 실패를 통째로 끌어온다" 는 그 실패가
      #   전부 고쳐지며 죽었다 — 결론만 남기고 사유를 갈아 끼웠다.)
      # `-- --test-threads=4` 는 붙이지 않는다 — CI 는 그 플래그를 쓰지 않고(CLAUDE.md 「빌드·검증 명령」),
      #   애초에 이 스위트는 인메모리 fake 포트뿐이라 자식 프로세스를 하나도 띄우지 않는다.
      # 검증 레인(ADR-0131 결정 2)에 둔다 — 릴리즈 잡이 아니다. release-build 는 태그에서만 돌고
      #   `needs: [backend, …]` 로 이 잡에 매달리므로, 여기 두면 배포 앞 게이트로도 함께 선다.
      - name: cargo test -p engram-dashboard --test layout_apply
        shell: bash
        run: cargo test --locked -p engram-dashboard --test layout_apply

      # 같은 패키지의 또 다른 **통합** 타깃(`src-tauri/tests/layout_commands.rs`) — 스텝을 따로 가르는
      # 사유는 위 layout_apply 블록이 정본이다(실패한 스위트를 스텝 이름이 짚는다 · 대상 선택은 타깃
      # 단위). layout_apply 는 적용 서비스 자체를 재고, 이쪽은 창·탭·슬롯
      # 명령 선언(`layout::commands`) + 인바운드 수신기(데몬 명령을 적용 서비스로 라우팅하는 계층)를 잰다.
      # `-- --test-threads=4` 는 붙이지 않는다 — 역시 인메모리 fake 포트뿐이라 자식 프로세스가 없다.
      - name: cargo test -p engram-dashboard --test layout_commands
        shell: bash
        run: cargo test --locked -p engram-dashboard --test layout_commands

      # 같은 패키지의 셋째 **통합** 타깃(`src-tauri/tests/daemon_client_pending.rs`) — 스텝을 따로 가르는
      # 사유는 위 layout_apply 블록이 정본이다(실패한 스위트를 스텝 이름이 짚는다).
      # 재는 것은 데몬 클라이언트의 pending 슬롯 승계다: 바깥
      # 호출자가 정한 request_id 가 겹쳐도 연결 태스크가 죽지 않고 옛 대기자가 오류로 깨어난다
      # (옛 `debug_assert!(false)` 회귀 = 셸↔데몬 영구 단절).
      # `-- --test-threads=4` 는 붙이지 않는다 — 소켓·자식 프로세스가 하나도 없다.
      - name: cargo test -p engram-dashboard --test daemon_client_pending
        shell: bash
        run: cargo test --locked -p engram-dashboard --test daemon_client_pending

      # 같은 패키지의 넷째 **통합** 타깃(`src-tauri/tests/daemon_client_replay.rs`) — 스텝을 따로 가르는
      # 사유는 위 layout_apply 블록이 정본이다(실패한 스위트를 스텝 이름이 짚는다).
      # 재는 것은 replay single-flight 의 거절 배선이다:
      # 데몬이 Subscribe 를 거절하면 슬롯이 풀리고 병합된 다음 세대의 Subscribe 가 실제로 만들어진다
      # (안 풀리면 그 에이전트의 출력이 모든 창에서 영구 두절 — 실측 2026-08-19).
      # `-- --test-threads=4` 는 붙이지 않는다 — 소켓·자식 프로세스가 하나도 없다.
      - name: cargo test -p engram-dashboard --test daemon_client_replay
        shell: bash
        run: cargo test --locked -p engram-dashboard --test daemon_client_replay

      # 같은 패키지의 다섯째 타깃 — 위 넷과 달리 통합이 아니라 **단위** 스위트다
      # (`[[test]] name = "lib_unit"`, `path = "src/lib.rs"` → `src/**` 의 `#[cfg(test)]` 전부).
      # ★2026-08-24: 이름 필터(`-- export_bindings_`)를 뗐다 — 스위트 전체가 돈다★
      #   필터가 있던 사유(나머지에 알려진 실패 32 건 — daemon_client 의 app:None 단락이라는 선재 하네스
      #   부패. 제품 결함 아님)는 그 32 건이 전부 고쳐지며 죽었다. **판정 = 실패 0 이어야 PASS다.**
      #   ★기대 건수를 여기 박지 말 것★ — 테스트가 하나 늘 때마다 낡는다(이 자리에 있던 "217 건"·"8 건"이
      #   실제로 그렇게 낡았다). 판정에 필요한 것은 실패 0 뿐이다.
      #
      # ★이 스텝이 지키는 것은 테스트 실행만이 아니다 — 그 스위트를 서게 하는 다리 셋 중 ②를
      #   워크플로 전체에서 여기서만 잡는다★
      #   이 패키지의 lib 내장 유닛테스트 타깃은 manifest 리소스를 못 받아 로더 단계에서 0xC0000139
      #   (ENTRYPOINT_NOT_FOUND) 로 즉사했다. 지금 도는 이유는 셋이 함께 서 있어서다:
      #     ① `src-tauri/Cargo.toml` 의 `[lib] test = false`
      #     ② `src-tauri/Cargo.toml` 의 `[[test]] name = "lib_unit"` (kind=test 라야 `-tests` 가 닿는다)
      #     ③ `src-tauri/build.rs` 의 `cargo:rustc-link-arg-tests=<OUT_DIR 의 리소스 .lib>`
      #   하나만 빠져도 **조용히** 무너진다. 누가 무엇을 잡는지가 갈린다:
      #     ② 부재 → 이 스텝이 "no test target named `lib_unit`" 로 실패한다. ★위 워크스페이스 회귀는
      #        이걸 못 잡는다★ — 그쪽엔 스위트가 통째로 증발한 채 초록으로 남는다(침묵 ≠ 실패).
      #     ① 부재 → 죽는 내장 타깃이 **기본 선택**으로 돌아와 위 워크스페이스 회귀가 0xC0000139 로
      #        죽는다. 반대로 이 스텝은 그 타깃을 아예 안 고르므로 초록으로 남는다.
      #     ③ 부재 → 테스트 exe 가 뜨기도 전에 죽는다(양쪽 다 빨개진다).
      #   위 통합 타깃 4 종은 이 축을 못 본다 — 그쪽은 원래부터 `-tests` 인자를 받고 있었고, 그래서
      #   ②③이 사라져도 멀쩡히 초록이다.
      #
      # 이 스위트가 `src-tauri/bindings/*.ts` 를 다시 굽는다(ts-rs derive 가 `#[ts(export)]` 타입마다
      #   만드는 `export_bindings_*` 가 그 안에 있다) — 그래서 이 스텝은 아래 'Gate: ts-rs bindings …'
      #   보다 반드시 **앞**에 있어야 한다. 바인딩 **대조**는 여기서 하지 않는다: 그 게이트 한 곳이 세
      #   디렉터리를 모아서 본다(agent 와 같은 모양 — 재생성 스텝 따로, diff 게이트 하나).
      # `-- --test-threads=4` 는 붙이지 않는다 — 이 스위트는 인메모리 하네스·소켓뿐이라 자식 프로세스가 없다.
      - name: cargo test -p engram-dashboard --test lib_unit
        shell: bash
        run: cargo test --locked -p engram-dashboard --test lib_unit

      # 아래 6개는 워크스페이스 회귀와 테스트 집합이 겹치지만, 검증 대상이 다르다 —
      # "이 crate 가 단독 feature 집합으로도 선다"는 격리 하네스 주장(ADR-0012)을 지킨다.
      # feature 합집합은 cargo 호출 1회 단위라 `--workspace` 는 이 축을 볼 수 없다.

      # ADR-0175 결정 1: 바닥 crate(`base` — 범용 도우미 · 로깅, ADR-0269). 워크스페이스 crate 의존 0 이 존재
      # 이유라 이 crate 도 위와 같은 단독 기립 축으로 확인한다.
      # `-- --test-threads=4` 는 붙이지 않는다 — 이 crate 엔 자식 프로세스를 띄우는 시험이 없다(실 `cmd.exe` 를
      #   띄우던 PID 헬퍼 시험은 헬퍼와 함께 아래 `platform` 으로 나갔다 — ADR-0266). 로컬 명령에도 안 붙는다.
      - name: cargo test -p engram-dashboard-base
        shell: bash
        run: cargo test --locked -p engram-dashboard-base

      # ADR-0266: OS 층 crate(`platform`). 워크스페이스 crate 의존 0(base 도 아니다)이 불변식이라 이 crate 도
      #   위와 같은 단독 기립 축으로 확인한다 — 불변식 · 게이트의 정본은 그 crate lib.rs 헤더다.
      # `-- --test-threads=4` 는 붙이지 않는다 — `process` 의 시험(`child_pids_finds_spawned_child` 등)이 실
      #   `cmd.exe` 를 띄우긴 하지만 CI 는 그 플래그를 아예 쓰지 않는다(CLAUDE.md 「빌드·검증 명령」 — 그
      #   플래그가 겨냥하는 조건이 러너에 없다). 로컬 명령에는 붙는다.
      - name: cargo test -p engram-dashboard-platform
        shell: bash
        run: cargo test --locked -p engram-dashboard-platform

      - name: cargo test -p engram-dashboard-agent
        shell: bash
        run: cargo test --locked -p engram-dashboard-agent

      # ADR-0134: 명령 버스 도구 crate(신설) — 워크스페이스 crate 의존 0 이 존재 이유라 이 crate 도
      # 위와 같은 단독 기립 축으로 확인한다(TRD S20 §6 Step 1).
      - name: cargo test -p engram-dashboard-command
        shell: bash
        run: cargo test --locked -p engram-dashboard-command

      - name: cargo test -p engram-dashboard-protocol
        shell: bash
        run: cargo test --locked -p engram-dashboard-protocol

      # 위 스텝은 바인딩을 **재생성만** 한다 — ts_export.rs 에 단언이 하나도 없어서, 그것만으로는
      # wire 계약과 커밋된 .ts 의 어긋남이 초록으로 지나간다. 실제 소비자는 frontend job 의 tsc 인데
      # 그쪽은 다른 러너에서 **커밋된** .ts 를 본다. 재생성 결과가 커밋본과 다르면 여기서 잡는다.
      # ★줄바꿈 잡음으로는 안 터진다★: index blob 이 LF 이고 git 이 비교 전에 작업본을 같은 방식으로
      #   정규화하므로 CRLF 차이만으로는 diff 가 나지 않는다(autocrlf=true 인 Windows 에서 재생성 후
      #   `git diff --exit-code` → 0 실측). 잡음이 보이는 것은 `git status` 쪽이지 `git diff` 가 아니다.
      # agent/bindings/ 도 같은 게이트에 든다(ADR-0134): 위 `cargo test -p engram-dashboard-agent` 가
      #   `agent.*` 선언에서 .ts 와 commands.schema.json 을 재생성하므로, 선언을 고치고 생성물을 안 밀면
      #   여기서 걸린다. **생성 지점이 crate 마다로 흩어졌으므로 이 경로 목록도 함께 늘어난다.**
      # ★`git diff` 는 untracked 파일을 보지 않는다★: 처음 생성되는 .ts 는 아직 커밋된 적이 없어
      #   비교 대상 자체가 없고, 그러면 매치 없이 초록으로 지나간다(`SlotContent.ts` 사건 —
      #   `docs/process/S20-command-bus/trd.md` §5). `git add -N`(intent-to-add)로 두 바인딩
      #   디렉터리를 인덱스에 **내용 없이** 등록해 두면, 그 다음 `git diff` 가 신규 파일도 "전체가
      #   추가된 diff"로 봐서 잡는다. 빈 blob 등록일 뿐 실제 스테이징이 아니므로 이후 커밋 내용에는
      #   영향이 없다.
      # 셋째 생성물 디렉터리 `src-tauri/bindings/` 도 2026-08-24 부터 이 게이트에 든다 —
      #   위 "생성 지점이 crate 마다로 흩어졌으므로 이 경로 목록도 함께 늘어난다" 가 가리키던 그 항목이다.
      #   그것을 굽는 `export_bindings_*` 는 셸 패키지의 **단위** 스위트 타깃(`lib_unit`) 안에 살고,
      #   이 잡에서 **두 번** 구워진다 — 워크스페이스 회귀(그 패키지 제외가 풀렸다)와 `--test lib_unit`
      #   스텝. ★이 게이트는 재생성을 하지 않고 대조만 한다★ — 그래서 요구는 하나뿐이다: 굽는 스텝이
      #   이 게이트보다 **앞**일 것(지금 둘 다 앞이다).
      # ★이 디렉터리를 목록에서 빼지 말 것★ — 편입 전까지 여기는 대조 없이 표류했고, 편입한 변경이
      #   실제로 drift 를 재생성해 냈다.
      # ★`-f` 를 빼지 말 것★: `git add` 는 무시된 경로를 조용히 건너뛰므로, 어느 crate 의 `.gitignore` 에
      #   `*.ts` 나 `bindings/` 같은 넓은 줄이 생기면 그 생성물이 인덱스에 안 올라가고 diff 가 깨끗해져
      #   **게이트가 소리 없이 해제된다**(지금은 세 디렉터리 다 무시 대상이 아니다 — 실측 2026-08-24).
      - name: 'Gate: ts-rs bindings are in sync with the wire contract'
        shell: bash
        run: |
          git add -N -f -- crates/engram-dashboard-protocol/bindings/ crates/engram-dashboard-agent/bindings/ src-tauri/bindings/
          if ! git diff --exit-code -- crates/engram-dashboard-protocol/bindings/ crates/engram-dashboard-agent/bindings/ src-tauri/bindings/; then
            echo "FAIL — 재생성된 바인딩이 커밋본과 다르다(선언 ↔ 생성물 drift, 신규 미커밋 파일 포함). 위 diff 를 반영해 커밋할 것."
            exit 1
          fi
          echo "PASS — bindings in sync"

      - name: cargo test -p engram-dashboard-messaging
        shell: bash
        run: cargo test --locked -p engram-dashboard-messaging

      # net 게이트 5 — 두 feature 조합이 각각 컴파일·통과해야 한다.
      # net 의 default feature 가 비어 있어 맨 명령은 `auth` 만 컴파일하고, `#[cfg(feature = "server")]`
      # 아래 모듈은 컴파일 대상에서 아예 빠진다(가려진 코드는 오류를 내지 않는다).
      # 반대로 워크스페이스 스코프 명령은 데몬이 server 를 켜므로 항상 ON 쪽만 본다.
      # 각 줄이 상대가 못 보는 쪽을 맡으므로 한 줄로 줄이지 말 것.
      - name: 'net gate 5a: cargo test -p engram-dashboard-net (features off)'
        shell: bash
        run: cargo test --locked -p engram-dashboard-net

      - name: 'net gate 5b: cargo test -p engram-dashboard-net --all-features'
        shell: bash
        run: cargo test --locked -p engram-dashboard-net --all-features

      # ADR-0177: 재사용 전송 lib(`transport` — 신설). 워크스페이스 crate 의존 0 이 존재 이유라
      #   위 crate 들과 같은 단독 기립 축으로 확인한다 — 기대값의 정본은 그 crate lib.rs 헤더
      #   「격리 게이트」의 게이트 ④이고 아래 세 스텝(4a·4b·4d)은 부르기만 한다. 4c 는 같은 헤더의
      #   게이트 ⑤(실소켓 스위트가 비지 않았나)를 부른다.
      # ★feature 목록을 손으로 박아 `--all-features` 를 대체하지 말 것★ — `--all-features` 쪽이 `ws`
      #   어댑터의 optional 서드파티와 실소켓 테스트까지 컴파일한다. 그게 의도다.
      # `-- --test-threads=4` 는 붙이지 않는다 — CI 는 그 플래그를 아예 쓰지 않는다(CLAUDE.md
      #   「빌드·검증 명령」 — 그 플래그가 겨냥하는 보안 소프트웨어 조건이 러너에 없고, 낮추면 CI 만
      #   느려진다). 로컬 명령에도 이 crate 에는 안 붙는다 — 자식 프로세스를 하나도 안 띄운다.
      - name: 'transport gate 4a: cargo test -p engram-dashboard-transport (features off)'
        shell: bash
        run: cargo test --locked -p engram-dashboard-transport

      - name: 'transport gate 4b: cargo test -p engram-dashboard-transport --all-features'
        shell: bash
        run: cargo test --locked -p engram-dashboard-transport --all-features

      # ★위 4a/4b 는 「명령이 성공했나」만 본다 — 스위트가 통째로 비어도 그대로 초록이다★. `tests/` 의
      #   실소켓 파일 셋은 각각 파일 수준 `#![cfg(all(feature = "ws", feature = "test-support"))]` 뒤에
      #   살아서, 그 조건이 거짓이 되면(feature 이름 오타·개명·다른 feature 로 접기) 세 바이너리가
      #   **테스트 0개로 컴파일되고 통과한다.** 그래서 이 스텝은 종료코드를 믿지 않고 **기대하는 것의
      #   이름과 최소 개수를 CI 가 직접 말한다**(선례 = ts-rs 바인딩 게이트가 vacuous 였던 사건,
      #   ADR-0131 「적대 리뷰가 적출한 것」 1). 기대값의 정본 = 그 crate lib.rs 헤더의 게이트 ⑤.
      # `-- --list` 는 하네스가 자기 목록만 찍고 아무것도 돌리지 않는다 — `: test` 로 끝나는 줄 하나가
      #   테스트 하나다(`: bench` 는 벤치라 안 센다). 패턴 끝의 `\s*` 는 줄끝 CR 방어다.
      # ★기대값은 「1개 이상」이고 실수를 올리지 않는다★ — 테스트를 더하거나 합칠 때마다 빨개지면 개수의
      #   정본이 둘이 된다. 이 게이트가 겨냥하는 실패는 **0개**다.
      # ★잡는 것 / 못 잡는 것★ — 잡는다: 타깃 소실(`--test <이름>` 이 0 아닌 종료코드로 죽는다) · 파일
      #   수준 cfg 가 거짓(목록이 0줄) · 파일 삭제. 못 잡는다: 남은 테스트가 **무엇을 재나**(본문이 빈
      #   `#[tokio::test]` 도 1개로 센다) · 개별 테스트의 `#[ignore]`(목록에는 그대로 오른다) · 스위트
      #   **안쪽**에서 개별 테스트에 걸린 `#[cfg]`.
      - name: 'transport gate 4c: socket suites are not hollowed out (named targets + non-empty)'
        shell: bash
        run: |
          for t in ws_dial ws_reject ws_write_deadline; do
            set +e
            out=$(cargo test --locked -p engram-dashboard-transport --all-features --test "$t" -- --list)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "FAIL — cargo test --test $t exited $rc (타깃이 사라졌나·개명했나)"
              printf '%s\n' "$out"
              exit 1
            fi
            set +e
            n=$(printf '%s\n' "$out" | grep -cE ': test[[:space:]]*$')
            rgrc=$?
            set -e
            if [ "$rgrc" -gt 1 ]; then echo "FAIL — grep errored (exit $rgrc)"; exit 1; fi
            if [ "$rgrc" -eq 1 ]; then n=0; fi
            echo "$t: $n test(s) listed"
            if [ "$n" -lt 1 ]; then
              echo "FAIL — $t 이 테스트 0개로 컴파일됐다 — 파일 수준 cfg(feature ws + test-support)가 거짓이다"
              printf '%s\n' "$out"
              exit 1
            fi
          done
          echo "PASS — 세 실소켓 스위트가 각각 1개 이상 등재됐다"

      # 기대값·근거의 정본 = 그 crate lib.rs 헤더 「격리 게이트」의 게이트 ④ 셋째 줄.
      - name: 'transport gate 4d: cargo check -p engram-dashboard-transport --features ws (consumer combo)'
        shell: bash
        run: cargo check --locked -p engram-dashboard-transport --features ws

      # 워크스페이스 전체 빌드(회귀 명령이 제외한 src-tauri 까지 여기서 컴파일된다).
      - name: cargo build
        shell: bash
        run: cargo build --locked

  # ── 포맷 + 격리 게이트 ───────────────────────────────────────────────────────
  # 컴파일이 없어 백엔드 잡과 병렬로 빠르게 끝난다(cargo tree 게이트는 의존 해석만 한다).
  gates:
    name: fmt + isolation gates
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve and assert pinned toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          expected=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)
          if [ -z "$expected" ]; then echo "FAIL — rust-toolchain.toml 에서 channel 을 읽지 못했다"; exit 1; fi
          actual=$(rustc --version | awk '{print $2}')
          if [ "$actual" != "$expected" ]; then
            echo "FAIL — pinned '$expected' but active rustc is '$actual'"
            exit 1
          fi
          echo "PASS — toolchain $actual matches rust-toolchain.toml"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gates

      # windows-latest 러너에 ripgrep 이 있는지는 이미지 문서가 보장하지 않는다 → 버전을 박아 직접 깐다.
      # 게이트 판정이 정규식 동작에 달려 있으므로 러너 이미지가 무엇을 들고 있든 같은 rg 로 돈다.
      # GITHUB_PATH 는 기존 PATH 앞에 붙으므로 러너에 rg 가 이미 있어도 이쪽이 이긴다.
      - name: Install ripgrep (pinned 14.1.1, checksum-verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '14.1.1'
          # 릴리스가 배포하는 공식 .sha256 값. 전송 중 손상과 asset 사후 교체를 잡는다.
          # (같은 릴리스에서 온 값이라 릴리스 자체가 오염된 경우까지 막지는 못한다 — 그건 별개 문제.)
          $sha = 'd0f534024c42afd6cb4d38907c25cd2b249b79bbe6cc1dbee8e3e37c2b6e25a1'
          $url = "https://github.com/BurntSushi/ripgrep/releases/download/$ver/ripgrep-$ver-x86_64-pc-windows-msvc.zip"
          $zip = "$env:RUNNER_TEMP\rg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          if ($actual -ne $sha) { throw "ripgrep archive checksum mismatch: expected $sha, got $actual" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\rg" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\rg" -Recurse -Filter rg.exe | Select-Object -First 1
          if (-not $exe) { throw "rg.exe not found in the extracted archive" }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # 아래 검증 스텝이 쓸 기대값 — 버전 문자열을 YAML 에 두 번 적지 않으려고 여기서 넘긴다.
          "RG_EXPECTED_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 버전까지 확인하는 이유: 위 설치가 실패했는데 러너 이미지에 우연히 다른 rg 가 있으면, 단순
      # `rg --version` 은 통과해 버려 게이트가 핀되지 않은 rg 로 도는 것을 못 잡는다.
      # 정확히 일치를 보는 이유: 부분 일치로 두면 14.1.10 같은 상위 버전이 14.1.1 로 통과한다.
      - name: Verify ripgrep is the pinned build
        shell: bash
        run: |
          rg --version
          actual=$(rg --version | head -1 | awk '{print $2}')
          if [ "$actual" != "$RG_EXPECTED_VERSION" ]; then
            echo "FAIL — expected ripgrep $RG_EXPECTED_VERSION, got '$actual'"
            exit 1
          fi
          echo "PASS — ripgrep $actual"

      # cargo fmt 는 의존을 해석하지 않으므로 --locked 를 붙이지 않는다(cargo-fmt 가 받지 않는 플래그다).
      - name: cargo fmt --check
        shell: bash
        run: cargo fmt --check

      # ★아래 grep 게이트 전부의 공통 함정 — 종료코드 반전★
      # rg 는 "매치를 찾으면 0, 못 찾으면 1, 오류면 2 이상" 으로 끝난다. 그런데 이 게이트들이 통과인
      # 조건은 **매치 0** 이다. 즉 rg 의 종료코드를 그대로 스텝 성공으로 쓰면 판정이 정확히 뒤집힌다.
      # 또 `|| true` 나 `if rg …; then` 로 넘기면 rc=2(경로 오타·rg 부재 등)가 "매치 없음" 과 같은
      # 갈래로 들어가 게이트가 조용히 항상 통과한다. 그래서 세 갈래(0 / 1 / 2+)를 명시적으로 가른다.
      # `set +e` 가 필요한 이유: Actions 의 bash 는 `set -e` 로 도는데 `hits=$(rg …)` 는 rg 의 종료코드를
      # 그대로 물려받아, 매치가 없는 **정상 통과** 경로에서 스텝이 먼저 죽는다.

      # 옛 게이트명은 'Gate: core isolation — no `use tauri` in core' 였다(crate 개명 ADR-0175 전).
      #   ADR-0003 의 코어 격리 불변식 그대로이고 대상 crate 이름만 `core` → `agent` 로 바뀌었다.
      - name: 'Gate: agent crate isolation — no `use tauri` in the agent crate'
        shell: bash
        run: |
          set +e
          hits=$(rg "^\s*use tauri" crates/engram-dashboard-agent/src/)
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # ADR-0134: 신규 crate 이름(`command`)이 알파벳에 없으면 메시징이 도구 crate 를 써도 안 잡힌다.
      #   ADR-0175 의 `base` · ADR-0266 의 `platform` · ADR-0129 의 `net` · ADR-0177 의 `transport` 도 같은 이유로
      #   알파벳에 넣는다. ★새 워크스페이스 crate 가 생길 때마다 여기 이름을 더하고, 지운 crate 는 뺀다★(손으로
      #   박은 알파벳이 이 정규식의 가장 큰 구멍이고, 아래 상한 게이트가 그 구멍을 덮는다).
      - name: 'Gate: messaging kernel isolation — no workspace crate refs'
        shell: bash
        run: |
          set +e
          hits=$(rg "engram_dashboard_(agent|base|daemon|protocol|command|platform|net|transport)" crates/engram-dashboard-messaging/src/)
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # 위 게이트는 소스의 심볼 경로만 본다 — 매니페스트 텍스트 정규식으로 이 구멍을 닫으려 했으나
      # (이전 버전: `rg 'package\s*=\s*"engram-dashboard-' Cargo.toml`) 교차 리뷰에서 같은 종류의
      # 구멍이 두 곳 더 확인됐다. **매니페스트도 결국 텍스트라 정규식이 못 보는 정상 TOML 문법이
      # 항상 남는다** — 그래서 매니페스트 재작성 대신 net 게이트 3 과 같은 계기로 옮긴다:
      # 텍스트가 아니라 **해석된 의존 그래프**(`cargo tree`)를 읽으면 아래 문법 형태 자체가 무의미해진다.
      #   ① quoting — TOML literal string 은 작은따옴표도 유효하다: `package = 'engram-dashboard-command'`.
      #      정규식은 큰따옴표만 봤으므로 그대로 빠져나간다.
      #   ② build-dependencies — `build.rs` 전용 워크스페이스 crate 는 `[build-dependencies]` 테이블에
      #      들어가고 rename 없이도 매니페스트 정규식(rename 이 없으면 `package =` 키 자체가 안 생긴다)과
      #      위 소스 정규식(스캔 범위가 `src/` 뿐이라 크레이트 루트의 `build.rs` 는 안 본다) 양쪽을 다
      #      빠져나간다.
      # `-e normal,dev,build --target all --all-features` 를 줄이지 말 것 — net 게이트 3 과 동일 이유로
      # (rename·비활성 target·optional 이 새어나간다) 형태가 샌다. 기존 소스 정규식 게이트는 그대로
      # 둔다 — 이건 additive.
      - name: 'Gate: messaging kernel isolation — direct workspace deps ceiling (exactly 1 = self)'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-messaging --depth 1 --prefix none -e normal,dev,build --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          out=$(printf '%s\n' "$tree" | rg "^engram-dashboard" | sort -u)
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$out" ]; then n=0; else n=$(printf '%s\n' "$out" | wc -l | tr -d '[:space:]'); fi
          echo "found $n direct workspace dep(s):"
          printf '%s\n' "$out"
          if [ "$n" -ne 1 ]; then echo "FAIL — expected exactly 1(자기 자신) — 워크스페이스 crate 의존이 반입됐다"; exit 1; fi
          echo "PASS"

      # ADR-0134: 도구 crate(`command`)의 존재 이유 자체가 "워크스페이스 crate 의존 0" 이다
      # (`crates/engram-dashboard-command/src/lib.rs` 헤더 불변식 1). 그 헤더가 적어 둔 게이트
      # (`rg "path\s*=" Cargo.toml`) 는 위 messaging 게이트가 방금 폐기한 매니페스트 정규식과 같은
      # 구멍(quoting·build-dependencies)을 처음부터 안고 있어, 텍스트 정규식으로 세웠다가 나중에 또
      # 교체하지 않고 처음부터 해석된 그래프로 본다. net 게이트 3 과 같은 계기 — 자세한 이유는 그 게이트
      # 주석 참조.
      - name: 'Gate: command tool crate — direct workspace deps ceiling (exactly 1 = self)'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-command --depth 1 --prefix none -e normal,dev,build --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          out=$(printf '%s\n' "$tree" | rg "^engram-dashboard" | sort -u)
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$out" ]; then n=0; else n=$(printf '%s\n' "$out" | wc -l | tr -d '[:space:]'); fi
          echo "found $n direct workspace dep(s):"
          printf '%s\n' "$out"
          if [ "$n" -ne 1 ]; then echo "FAIL — expected exactly 1(자기 자신) — 워크스페이스 crate 의존이 반입됐다"; exit 1; fi
          echo "PASS"

      # ADR-0175 결정 1: 바닥 crate(`base`)의 입주 조건 ②는 "도메인 지식 0" 이고, 그 실물이 워크스페이스
      # crate 의존 0 이다(그 crate lib.rs 헤더가 정본). 여기가 그 벽이다 — 컴파일러는 잎을 강제하지 않는다.
      # 위 두 게이트와 같은 형태·같은 플래그다(줄이면 rename·비활성 target·optional 이 샌다).
      # ★소스 정규식 게이트를 따로 두지 않는 이유★: `base` 는 남을 안 부르는 것이 불변식이라 상한 게이트
      #   하나로 충분하다(메시징처럼 "부르는 이름 알파벳" 을 손으로 관리할 필요가 없다).
      - name: 'Gate: base leaf crate — direct workspace deps ceiling (exactly 1 = self)'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-base --depth 1 --prefix none -e normal,dev,build --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          out=$(printf '%s\n' "$tree" | rg "^engram-dashboard" | sort -u)
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$out" ]; then n=0; else n=$(printf '%s\n' "$out" | wc -l | tr -d '[:space:]'); fi
          echo "found $n direct workspace dep(s):"
          printf '%s\n' "$out"
          if [ "$n" -ne 1 ]; then echo "FAIL — expected exactly 1(자기 자신) — 워크스페이스 crate 의존이 반입됐다"; exit 1; fi
          echo "PASS"

      # ADR-0003 의 격리 불변식이 걸리는 축은 crate 이름이 아니라 **어느 바이너리에 링크되나** 다.
      #   `base` 는 headless 데몬에 링크되므로, 여기서 Tauri 를 부르는 순간 창도 webview 도 없는 그
      #   바이너리가 전송 방식에 묶인다 — ADR-0003 이 막으려던 바로 그 실패다.
      # ★"잎 crate 라 안전하다" 로 이 스텝을 지우지 말 것★: 잎 성질은 **워크스페이스 crate** 축의 말이고,
      #   바로 위 상한 게이트도 `rg "^engram-dashboard"` 로 워크스페이스 멤버만 센다. 서드파티인 `tauri` 는
      #   그 게이트를 그대로 통과한다 — 두 게이트는 서로 다른 축이다.
      # base 입주자는 agent 게이트의 스캔 범위(`crates/engram-dashboard-agent/src/`) 밖에 산다(ADR-0175
      #   결정 1). 이 스텝이 없으면 어느 게이트도 그 입주자를 안 본다 — `logging::init_logging_with_file` 이
      #   "이벤트 하나만 쏘면 편한" 대표 자리다.
      - name: 'Gate: base crate isolation — no `use tauri` in the base crate'
        shell: bash
        run: |
          set +e
          hits=$(rg "^\s*use tauri" crates/engram-dashboard-base/src/)
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # ADR-0175 결정 1 의 입주 조건 ③(입주자끼리 서로 참조하지 않을 것)의 벽. ①②와 달리 이 조건에는
      #   기계 검증이 없었다 — ②는 위 상한 게이트가, ①은 사람이 본다.
      # ★왜 지켜야 하나★: 입주자가 서로 엮이면 그건 한 덩어리이고, 한 덩어리를 바닥에 두면 그 전체가 모든
      #   소비자에게 딸려 간다 — ADR-0151 「거부한 대안」 E 의 `bevy_core` 선례(ADR-0269 「거부한 대안」 1 이
      #   다시 잰다)가 실패한 시작점이 정확히 여기다.
      # ★`crate::` 단독으로 넓히지 말 것★: 그건 평범한 Rust 라 게이트가 아니라 잡음이 된다. 모듈 **이름**을
      #   박아 두는 대가로 입주자가 늘면 여기 이름을 더해야 한다(메시징 정규식과 같은 종류의 구멍).
      # ★알려진 한계★: `logging` 이 나중에 하위 모듈을 가지면 그 안의 `crate::logging::…` 자기 참조가
      #   오탐된다. 그때는 상대 경로(`super::`)로 부르거나 이 게이트를 다시 판정한다.
      - name: 'Gate: base leaf crate — tenants must not reference each other'
        shell: bash
        run: |
          set +e
          hits=$(rg "(crate|super)::(logging|text|time|path|sync|testing|writable)" crates/engram-dashboard-base/src/)
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # ADR-0269 결정 5 · ADR-0275 결정 5: base 의 시험 기능 `test-support`(`testing` 모듈과 그 뒤의 시험 도우미를 연다)는
      #   소비 crate 의 `[dev-dependencies]` 에서만 켠다. 워크스페이스가 `resolver = "2"` 라 dev 그래프의
      #   기능은 운영 빌드로 합쳐지지 않는다 — 이 스텝은 누가 `[dependencies]` 쪽에 그 기능을 켜는 것을 잡는다.
      #   운영 바이너리를 내는 둘(데몬 · 셸)의 정상 · build 그래프를 해석된 그래프로 읽는다(매니페스트 grep 이 아니다).
      # ★셋째 검사(agent dev 그래프 → 1줄 이상)를 지우지 말 것★: 기능 이름이 바뀌면 0 기대 둘은 매치할 낱말을
      #   잃고 조용히 통과한다 — 짝이 그 눈먼 통과를 빨갛게 만든다(transport lib.rs 헤더 게이트 ⑤ 와 같은 근거).
      # ★한계★: 해석된 그래프를 읽을 뿐이라 `--all-targets` 를 한 호출로 짓는 빌드의 기능 합집합은 못 본다
      #   (daemon `Cargo.toml` 「운영 빌드 주의」 — 배포 바이너리를 그렇게 짓지 않는 것이 규칙이다).
      - name: 'Gate: base test-support stays out of release graphs (daemon · shell = 0, agent dev >= 1)'
        shell: bash
        run: |
          for pkg in engram-dashboard-daemon engram-dashboard; do
            set +e
            tree=$(cargo tree --locked -p "$pkg" -e normal,build,features -i engram-dashboard-base --target all)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree -p $pkg exited $rc"; printf '%s\n' "$tree"; exit 1; fi
            set +e
            hits=$(printf '%s\n' "$tree" | rg 'feature "test-support"')
            rgrc=$?
            set -e
            case "$rgrc" in
              1) echo "PASS — $pkg normal graph: 0 matches" ;;
              0) echo "FAIL — $pkg 운영 그래프에 base test-support 가 켜졌다:"; printf '%s\n' "$tree"; exit 1 ;;
              *) echo "FAIL — rg errored (exit $rgrc)"; exit 1 ;;
            esac
          done
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-agent -e normal,dev,features -i engram-dashboard-base --target all)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree -p engram-dashboard-agent exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          hits=$(printf '%s\n' "$tree" | rg 'engram-dashboard-base feature "test-support"')
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$hits" ]; then n=0; else n=$(printf '%s\n' "$hits" | wc -l | tr -d '[:space:]'); fi
          echo "agent dev graph: $n match(es)"
          if [ "$n" -lt 1 ]; then echo "FAIL — expected >= 1 — 기능 이름이 바뀌었나(그러면 위 0 기대 둘이 눈먼 채 통과한다)"; printf '%s\n' "$tree"; exit 1; fi
          echo "PASS"

      # ADR-0266 「영향」: OS 층 crate(`platform`)의 격리 게이트 ① · ②. 기대값 · 근거 · 「지우지 말 것」의 정본은
      #   `crates/engram-dashboard-platform/src/lib.rs` 헤더의 「격리 게이트」 절이고 여기는 부르기만 한다.
      #   (③ 시험 기능 누수 게이트는 그 아래 스텝이 따로 진다.)
      # ★①②가 각각 다른 축이라 하나로 줄이지 말 것★ — ①은 워크스페이스 멤버만 세므로 서드파티 `tauri` 를
      #   그냥 통과시킨다(그 축이 ②).
      # 형태 · 플래그는 messaging · command · base · transport 상한 게이트와 같다. ①에 경로 사전점검이 없는
      #   까닭도 transport 게이트 1 과 같다 — 패키지가 사라지거나 개명하면 `cargo tree -p` 가 0 이 아닌
      #   종료코드로 죽어 첫 분기가 잡는다.
      - name: 'platform gate 1: direct workspace deps ceiling (exactly 1 = self)'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-platform --depth 1 --prefix none -e normal,dev,build --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          out=$(printf '%s\n' "$tree" | rg "^engram-dashboard" | sort -u)
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$out" ]; then n=0; else n=$(printf '%s\n' "$out" | wc -l | tr -d '[:space:]'); fi
          echo "found $n direct workspace dep(s):"
          printf '%s\n' "$out"
          if [ "$n" -ne 1 ]; then echo "FAIL — expected exactly 1(자기 자신) — 워크스페이스 crate 의존이 반입됐다"; exit 1; fi
          echo "PASS"

      # ★`test -d` 를 지우지 말 것★ — crate 를 옮기거나 개명하면 rg 는 매치 0 을 뱉고 0 = PASS 라 벽이
      #   조용히 사라진다(rc=2 갈래도 같은 것을 잡지만 사유를 못 찍는다 — transport 게이트 2 와 같다).
      - name: 'platform gate 2: no `use tauri` in the platform crate'
        shell: bash
        run: |
          set +e
          d=crates/engram-dashboard-platform/src
          if [ ! -d "$d" ]; then echo "FAIL — 게이트 대상 디렉터리가 없다: $d (개명했나·이사했나)"; exit 1; fi
          hits=$(rg "^\s*use tauri" "$d/")
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # TRD 1-3 §3-8 · §4-2 ③(ADR-0266 「영향」 · base 시험 기능 스텝(ADR-0275 결정 5)과 같은 축): platform 의 시험 기능
      #   `test-support`(`testing` 모듈 · `group::GroupRef::gone` · `spawn::wmi_create_raw` — 시험 도우미를 부르는 쪽 시험에 연다)는 소비 crate(agent · 셸)의
      #   `[dev-dependencies]` 에서만 켠다. 워크스페이스가 `resolver = "2"` 라 dev 그래프의 기능은 운영 빌드로
      #   합쳐지지 않는다 — 이 스텝은 누가 `[dependencies]` 쪽에 그 기능을 켜는 것을 잡는다. 운영 바이너리를
      #   내는 둘(데몬 · 셸)의 정상 · build 그래프를 해석된 그래프로 읽는다(매니페스트 grep 이 아니다). 셸은
      #   platform 을 운영 의존으로 직접 지고(데몬 찾기 · 띄우기 · 끄기 · 화면 상태의 앞 창 판정 `window` · 임시 파일
      #   주인 생존 판정) 그 기능은 dev 줄에서만 켠다 — 데몬도 dev-dependency 로 물지만 `-e` 에 `dev` 가 없어 dev
      #   간선은 세지 않는다.
      # ★꼴은 TRD 1-3 §4-2 의 명령이 아니라 착지한 base 스텝을 따른다★ — `-e` 의 `build` 와 짝의 crate 이름
      #   한정은 base 게이트가 리뷰 지적으로 더한 것이다(5fb25ab — build 의존을 못 봤다). 낡은 쪽은 TRD 다.
      # ★셋째 검사(agent dev 그래프 → 1줄 이상)를 지우지 말 것★: 기능 이름이 바뀌면 0 기대 둘은 매치할 낱말을
      #   잃고 조용히 통과한다 — 짝이 그 눈먼 통과를 빨갛게 만든다(base 시험 기능 스텝과 같은 근거).
      # ★한계★: base 시험 기능 스텝과 같다 — 해석된 그래프를 읽을 뿐이라 `--all-targets` 를 한 호출로 짓는
      #   빌드의 기능 합집합은 못 본다(daemon `Cargo.toml` 「운영 빌드 주의」).
      - name: 'platform gate 3: test-support stays out of release graphs (daemon · shell = 0, agent dev >= 1)'
        shell: bash
        run: |
          for pkg in engram-dashboard-daemon engram-dashboard; do
            set +e
            tree=$(cargo tree --locked -p "$pkg" -e normal,build,features -i engram-dashboard-platform --target all)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree -p $pkg exited $rc"; printf '%s\n' "$tree"; exit 1; fi
            set +e
            hits=$(printf '%s\n' "$tree" | rg 'feature "test-support"')
            rgrc=$?
            set -e
            case "$rgrc" in
              1) echo "PASS — $pkg normal graph: 0 matches" ;;
              0) echo "FAIL — $pkg 운영 그래프에 platform test-support 가 켜졌다:"; printf '%s\n' "$tree"; exit 1 ;;
              *) echo "FAIL — rg errored (exit $rgrc)"; exit 1 ;;
            esac
          done
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-agent -e normal,dev,features -i engram-dashboard-platform --target all)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree -p engram-dashboard-agent exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          hits=$(printf '%s\n' "$tree" | rg 'engram-dashboard-platform feature "test-support"')
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$hits" ]; then n=0; else n=$(printf '%s\n' "$hits" | wc -l | tr -d '[:space:]'); fi
          echo "agent dev graph: $n match(es)"
          if [ "$n" -lt 1 ]; then echo "FAIL — expected >= 1 — 기능 이름이 바뀌었나(그러면 위 0 기대 둘이 눈먼 채 통과한다)"; printf '%s\n' "$tree"; exit 1; fi
          echo "PASS"

      # ADR-0270 「영향」 불변식 「셸(`src-tauri`)은 agent crate 를 운영 의존하지 않는다」의 기계 벽(TRD 2-1 D6).
      #   셸(`engram-dashboard`)의 정상 · build 그래프에 `engram-dashboard-agent` 가 0 줄이어야 PASS(짝: 데몬의 같은
      #   그래프에 1 줄 이상). 해석된 그래프를 읽는다 — 매니페스트 grep 이 아니라서 다른 의존이 agent 를 끌어오는
      #   전이 경로까지 잡는다. ★판정 함수(`shell_agent_gate`)는 여기 하나에만 둔다★ — `/qa` 바인딩 4i 블록이 이것을
      #   읽어 그대로 부른다.
      # ★`cargo tree -i engram-dashboard-agent` 로 바꾸지 말 것★ — 대상이 그래프에 없으면 rc=101 로 죽어 「없다」가
      #   FAIL 로 읽힌다(실측 — TRD 2-1 §1-4). 그래서 그래프 전체를 찍고 줄을 찾는다.
      # ★`-e` 에 `dev` 를 넣지 말 것★ — 셸 → (dev) 데몬 → agent 는 일부러 남아 있다(셸 통합 시험이 데몬을 쓴다 ·
      #   작업 순서 2-4). 넣으면 그 간선으로 늘 빨갛다.
      # ★짝(데몬 → 1 줄 이상)을 지우지 말 것★ — agent 를 개명하거나 접두를 바꾸거나 패턴에 오타가 나면 0 기대 줄이
      #   매치할 이름을 잃고 눈먼 채 통과한다. 셸 패키지를 개명하면 `cargo tree -p` 가 죽어 FAIL 이다.
      # ★`^…␣` 앵커(뒤 공백)를 빼지 말 것★ — 빼면 같은 접두의 다른 이름이 걸린다(platform 게이트 ⑦ 과 같다).
      # ★함수 본문에 `}` 한 글자뿐인 줄을 두지 말 것★ — 4i 블록은 함수 머리부터 첫 그런 줄까지를 함수로 읽는다.
      - name: 'shell gate 1: no agent crate in the shell release graph (shell = 0, daemon >= 1)'
        shell: bash
        run: |
          shell_agent_gate() {
            local tree hits n rc
            tree=$(cargo tree --locked -p engram-dashboard -e normal,build --target all --all-features --prefix none) || { echo "FAIL — cargo tree -p engram-dashboard errored"; return 1; }
            rc=0; hits=$(printf '%s\n' "$tree" | rg '^engram-dashboard-agent ') || rc=$?
            [ "$rc" -le 1 ] || { echo "FAIL — rg errored (exit $rc)"; return 1; }
            if [ -n "$hits" ]; then echo "FAIL — 셸 운영 그래프(normal · build)에 agent 가 있다(ADR-0270 — 셸은 agent 를 의존하지 않는다):"; printf '%s\n' "$hits"; return 1; fi
            echo "shell normal/build graph: 0 agent line(s)"
            tree=$(cargo tree --locked -p engram-dashboard-daemon -e normal,build --target all --all-features --prefix none) || { echo "FAIL — cargo tree -p engram-dashboard-daemon errored"; return 1; }
            rc=0; hits=$(printf '%s\n' "$tree" | rg '^engram-dashboard-agent ') || rc=$?
            [ "$rc" -le 1 ] || { echo "FAIL — rg errored (exit $rc)"; return 1; }
            if [ -z "$hits" ]; then echo "FAIL — 짝: 데몬 운영 그래프에서도 agent 0 줄 — crate 이름이 바뀌었나 · 패턴이 망가졌나(그러면 위 0 기대가 눈먼 채 통과한다)"; return 1; fi
            n=$(printf '%s\n' "$hits" | wc -l | tr -d '[:space:]')
            echo "daemon normal/build graph: $n agent line(s)"
            echo "PASS — 셸 운영 그래프에 agent 없음(짝: 데몬 $n 줄)"
          }
          shell_agent_gate

      # ADR-0266 불변식 「운영 OS 분기는 platform crate 안에만」 — platform 밖에서 OS cfg 술어를 쓰는 `.rs` 파일 목록이
      #   아래 명단과 정확히 같아야 PASS(짝: 같은 matcher 가 platform 안에서는 1 파일 이상). ★명단(heredoc) · 정규식
      #   (`os_cfg_re`) · 파일 찾기 함수(`os_cfg_files`)는 여기 하나에만 둔다★ — `/qa` 바인딩 4f 블록이 이 셋을 읽는다.
      #   ★대상 범위 · 짝 · 대조는 4f 블록이 따로 되풀어 적는다★ — 이 스텝의 그쪽을 고치면 4f 블록도 맞춘다.
      #   matcher · 짝 · 범위 · 한계 · 명단을 고치는 법의 정본 = `crates/engram-dashboard-platform/src/lib.rs` 헤더 게이트 ④.
      - name: 'platform gate 4: OS cfg outside platform — exactly the fixed file list'
        shell: bash
        run: |
          os_cfg_re='(?(DEFINE)(?<CMT>//[^\n]*+|/\*(?s:.)*?\*/)(?<STR>[bc]?"(?:[^"\\]|\\(?s:.))*+")(?<RAW>[bc]?r(?<rh>#*+)"(?s:.)*?"\k<rh>)(?<ID>[A-Za-z_][A-Za-z0-9_]*+(?![#"]))(?<OS>\b(?:windows|unix)\b|\btarget_(?:os|family|env|vendor)(?:\s++|(?&CMT))*+=)(?<ATOM>(?&CMT)|(?&STR)|(?&RAW)|(?&ID)|[^()"/A-Za-z_]|/(?![/*]))(?<NOS>(?&CMT)|(?&STR)|(?&RAW)|(?!(?&OS))(?&ID)|[^()"/A-Za-z_]|/(?![/*]))(?<P>\((?:(?&ATOM)|(?&P))*+\))(?<Q>\((?:(?&NOS)|(?!(?&Q))(?&P))*+(?:(?&OS)|(?&Q))))(?://[^\n]*+|/\*(?s:.)*?\*/|\b[bc]?r(?<h>#*)"(?s:.)*?"\k<h>|"(?:[^"\\]|\\(?s:.))*+"|\x27(?:[^\x27\\\n]|\\[^\n]|\\x[0-9a-fA-F]{2}|\\u\{[0-9a-fA-F]{1,6}\})\x27)(*SKIP)(*FAIL)|\b(?:cfg!?|cfg_attr)\s*(?=(?&P))(?&Q)'
          if ! rg --pcre2-version; then echo "FAIL — 이 rg 에는 PCRE2 가 없다(게이트 ④ 의 matcher 가 그것에 기댄다)"; exit 1; fi
          for d in crates src-tauri crates/engram-dashboard-platform/src; do
            if [ ! -d "$d" ]; then echo "FAIL — 게이트 대상 디렉터리가 없다: $d (개명했나·이사했나)"; exit 1; fi
          done
          # 인자 = rg 경로 · glob. 출력 = OS cfg 술어를 쓰는 파일(정렬). rg 가 2 이상으로 죽으면 2 를 돌려준다.
          os_cfg_files() {
            local out rc=0
            out=$(rg -P -U -l --color never "$os_cfg_re" "$@") || rc=$?
            [ "$rc" -le 1 ] || return 2
            # Windows 의 rg 가 찍는 `\` 를 `/` 로 — `\134`(8진)인 것은 에이전트 셸 도구가 `\\` 를 `\` 로 접기 때문이다.
            printf '%s\n' "$out" | tr '\134' '/' | sed '/^$/d' | LC_ALL=C sort -u
          }
          own=$(os_cfg_files crates/engram-dashboard-platform/src -g '*.rs') || { echo "FAIL — rg errored"; exit 1; }
          if [ -z "$own" ]; then echo "FAIL — 같은 matcher 가 platform 안에서 0 파일을 문다 — 정규식이 망가졌나(그러면 아래 대조가 눈먼다)"; exit 1; fi
          actual=$(os_cfg_files crates src-tauri -g '*.rs' -g '!crates/engram-dashboard-platform/**') || { echo "FAIL — rg errored"; exit 1; }
          expected=$(sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' <<'OS_CFG_FILES' | LC_ALL=C sort
          # 시험 분기뿐
          crates/engram-dashboard-agent/src/backend/claude/leftover.rs
          crates/engram-dashboard-agent/src/backend/claude/mod.rs
          crates/engram-dashboard-agent/src/backend/claude/usage_probe.rs
          crates/engram-dashboard-agent/src/backend/codex/mod.rs
          crates/engram-dashboard-agent/src/backend/codex/thread_lock.rs
          crates/engram-dashboard-agent/src/backend/codex/transport.rs
          crates/engram-dashboard-agent/src/backend/mod.rs
          crates/engram-dashboard-agent/src/manager.rs
          crates/engram-dashboard-agent/src/session.rs
          crates/engram-dashboard-agent/src/transport/process_group.rs
          crates/engram-dashboard-agent/src/transport/pty.rs
          crates/engram-dashboard-agent/src/transport/stdio.rs
          crates/engram-dashboard-agent/src/usage/process.rs
          crates/engram-dashboard-agent/src/usage/scratch.rs
          crates/engram-dashboard-base/src/logging/mod.rs
          crates/engram-dashboard-daemon/src/messaging_host.rs
          crates/engram-dashboard-net/src/instance.rs
          crates/engram-dashboard-net/src/portfile.rs
          src-tauri/src/discovery/tests.rs
          # 통합 시험(`tests/`)
          crates/engram-dashboard-agent/tests/activation.rs
          crates/engram-dashboard-agent/tests/backend_contract.rs
          crates/engram-dashboard-agent/tests/canonical_name_wiring.rs
          crates/engram-dashboard-agent/tests/reaper.rs
          crates/engram-dashboard-agent/tests/stdio_physical_pipe.rs
          crates/engram-dashboard-agent/tests/stdio_smoke.rs
          crates/engram-dashboard-agent/tests/submit_delivery_boundary.rs
          crates/engram-dashboard-daemon/tests/ws_e2e.rs
          src-tauri/tests/stop_smoke.rs
          # 시험 하네스 bin · 예제
          crates/engram-dashboard-daemon/src/bin/roundtrip_smoke.rs
          crates/engram-dashboard-daemon/src/bin/saturation_pilot.rs
          crates/engram-dashboard-agent/examples/spike.rs
          crates/engram-dashboard-agent/examples/spike_breakaway.rs
          # 시한부 운영 예외(ADR-0275 결정 15)
          src-tauri/src/fsutil.rs
          OS_CFG_FILES
          )
          if [ "$actual" = "$expected" ]; then
            n=$(printf '%s\n' "$actual" | wc -l | tr -d '[:space:]')
            echo "PASS — platform 밖 OS cfg 파일 $n 개가 명단과 같다"
            exit 0
          fi
          echo "FAIL — platform 밖 OS cfg 파일이 명단과 다르다"
          echo "명단 밖인데 걸린 파일(운영 분기면 platform 으로 옮긴다 · 시험 · 하네스면 명단에 더한다):"
          LC_ALL=C comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          echo "명단에 있는데 안 걸린 파일(분기를 걷었거나 옮겼다 — 명단에서 뺀다):"
          LC_ALL=C comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          exit 1

      # ADR-0266 불변식의 의존 축 — 워크스페이스 멤버 중 아래 OS crate 를 **운영 의존**(normal · build · 대상 OS 무관)으로
      #   **직접** 가진 것이 platform 하나여야 PASS(짝: platform 이 1 개 이상 가진다). dev 의존은 세지 않는다.
      #   ★목록(`os_dep_re` — 손으로 적은 명시 목록) · 판정 함수(`os_dep_gate`)는 여기 하나에만 둔다★ — `/qa` 바인딩
      #   4g 블록이 이 둘을 읽어 그 함수를 그대로 부른다. 짝 · 범위 · 한계의 정본 = `crates/engram-dashboard-platform/src/lib.rs`
      #   헤더 게이트 ⑤.
      # ★함수 본문에 `}` 한 글자뿐인 줄을 두지 말 것★ — 4g 블록은 함수 머리부터 첫 그런 줄까지를 함수로 읽는다.
      - name: 'platform gate 5: OS crates as direct normal/build deps — platform only'
        shell: bash
        run: |
          os_dep_re='^(windows|windows-sys|winapi|libc|nix|rustix|objc2.*|objc|cocoa|core-foundation|core-graphics|security-framework|mach2)$'
          os_dep_gate() {
            local tree hits own bad
            tree=$(cargo tree --locked --workspace --no-dedupe --depth 1 --prefix depth -e normal,build --target all --all-features) || { echo "FAIL — cargo tree errored"; return 1; }
            hits=$(printf '%s\n' "$tree" | awk -v re="$os_dep_re" '/^0/ { m = substr($1, 2); next } /^1/ && substr($1, 2) ~ re { print m " -> " substr($1, 2) }' | LC_ALL=C sort -u)
            own=$(printf '%s\n' "$hits" | awk '$1 == "engram-dashboard-platform"')
            bad=$(printf '%s\n' "$hits" | awk 'NF && $1 != "engram-dashboard-platform"')
            printf 'found:\n%s\n' "$hits"
            if [ -z "$own" ]; then echo "FAIL — 짝: platform 에서 0 개 — 목록 정규식이나 cargo tree 출력 꼴이 망가졌나(그러면 아래 판정이 눈먼다)"; return 1; fi
            if [ -n "$bad" ]; then echo "FAIL — platform 밖 멤버가 OS crate 를 운영 의존으로 직접 가진다(그 OS 호출을 platform 으로 옮긴다):"; printf '%s\n' "$bad"; return 1; fi
            echo "PASS — OS crate 운영 직접 의존은 platform 에만"
          }
          os_dep_gate

      # ADR-0266 불변식의 표준 라이브러리 축 — platform 밖에서 `std::os::windows` · `std::os::unix` 를 `//` 주석 밖에 쓰는
      #   `.rs` 파일 목록이 아래 명단과 정확히 같아야 PASS(짝: 같은 matcher 가 platform 안에서는 1 파일 이상).
      #   ★정규식(`std_os_re`) · 판정 함수(`std_os_gate` — 대상 범위 · 짝 · 대조 · 메시지 전부) · 명단(heredoc)은 여기
      #   하나에만 둔다★ — `/qa` 바인딩 4h 블록이 이 셋을 읽어 그 함수를 그대로 부른다. 짝 · 범위 · 한계 · 명단을 고치는
      #   법의 정본 = `crates/engram-dashboard-platform/src/lib.rs` 헤더 게이트 ⑥.
      # ★함수 본문에 `}` 한 글자뿐인 줄을 두지 말 것★ — 4h 블록은 함수 머리부터 첫 그런 줄까지를 함수로 읽는다.
      - name: 'platform gate 6: std::os::windows/unix outside platform — exactly the fixed file list'
        shell: bash
        run: |
          std_os_re='^(?:[^/]|/[^/])*?\bstd::os::(?:windows|unix)\b'
          # 인자 = 명단 원문(`#` 주석 · 빈 줄 · 들여쓰기를 받는다 — 4h 블록은 ci.yml 원문 그대로 넘긴다).
          #   `\134` 는 게이트 ④ 의 `os_cfg_files` 와 같은 이유다.
          std_os_gate() {
            local d own actual expected n rc=0
            for d in crates src-tauri crates/engram-dashboard-platform/src; do
              [ -d "$d" ] || { echo "FAIL — 게이트 대상 디렉터리가 없다: $d (개명했나·이사했나)"; return 1; }
            done
            expected=$(printf '%s\n' "$1" | sed -e 's/[[:space:]]*#.*$//' -e 's/^[[:space:]]*//' -e '/^$/d' | LC_ALL=C sort)
            own=$(rg -l --color never "$std_os_re" crates/engram-dashboard-platform/src -g '*.rs') || rc=$?
            [ "$rc" -le 1 ] || { echo "FAIL — rg errored (exit $rc)"; return 1; }
            [ -n "$own" ] || { echo "FAIL — 짝: 같은 matcher 가 platform 안에서 0 파일을 문다 — 정규식이 망가졌나(그러면 아래 대조가 눈먼다)"; return 1; }
            rc=0
            actual=$(rg -l --color never "$std_os_re" crates src-tauri -g '*.rs' -g '!crates/engram-dashboard-platform/**') || rc=$?
            [ "$rc" -le 1 ] || { echo "FAIL — rg errored (exit $rc)"; return 1; }
            actual=$(printf '%s\n' "$actual" | tr '\134' '/' | sed '/^$/d' | LC_ALL=C sort -u)
            if [ "$actual" = "$expected" ]; then
              n=$(printf '%s\n' "$actual" | wc -l | tr -d '[:space:]')
              echo "PASS — platform 밖 std::os 파일 $n 개가 명단과 같다"
              return 0
            fi
            echo "FAIL — platform 밖 std::os 파일이 명단과 다르다"
            echo "명단 밖인데 걸린 파일(운영 코드면 platform 으로 옮긴다 · 시험 · 예제면 명단에 더한다):"
            LC_ALL=C comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
            echo "명단에 있는데 안 걸린 파일(쓰임을 걷었거나 옮겼다 — 명단에서 뺀다):"
            LC_ALL=C comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
            return 1
          }
          list=$(cat <<'STD_OS_FILES'
          # 시험 분기뿐(`#[cfg(test)]` 모듈 안)
          crates/engram-dashboard-agent/src/backend/claude/usage_probe.rs
          crates/engram-dashboard-agent/src/usage/process.rs
          crates/engram-dashboard-agent/src/usage/scratch.rs
          crates/engram-dashboard-base/src/logging/mod.rs
          crates/engram-dashboard-net/src/instance.rs
          # 예제
          crates/engram-dashboard-agent/examples/spike_breakaway.rs
          STD_OS_FILES
          )
          std_os_gate "$list"

      # ADR-0175 결정 3 이 `replay_flight` 를 코어에서 셸 패키지 안으로 옮기며, 그 파일 헤더가 내세우던
      #   순수성 주장(소켓·tokio·Tauri·protocol 의존 0)이 **어느 게이트의 스캔 범위에도 안 들어가게 됐다**
      #   — 위 소스 정규식 게이트는 전부 `crates/…/src/` 로 스코프돼 있고 `src-tauri/src/` 를 보는 것은
      #   하나도 없었다. 결정 1(`base` 신설)은 새 집에 게이트를 세웠는데 결정 3 은 세우지 않았다.
      # ★형제 crate 게이트와 달리 컴파일러 backstop 이 없다★ — `agent`·`base` 는 `tauri` 를 Cargo.toml 에
      #   아예 안 물어 위반이 컴파일 에러로 먼저 죽고 `use tauri` grep 은 값싼 조기 신호일 뿐이다. 반면
      #   이 패키지는 `tauri`·`tokio`·`engram-dashboard-protocol` 을 전부 의존하므로 위반이 그냥 컴파일된다.
      #   그래서 여기서는 이 정규식이 **유일한 벽**이고, `use` 줄만 보는 형태로는 인라인 완전경로
      #   (`tokio::spawn(...)`) 한 줄에 그대로 뚫린다 — 그 형태를 함께 잡는 이유가 이것이다.
      # ★접두 가드 `^(?:[^/]|/[^/])*?` = 「이 줄에서 아직 `//` 를 만나지 않았다」★ — 그래서 `//!`·`///`·꼬리
      #   주석 안의 자기인용이 오탐되지 않는다(대상 파일의 헤더가 이 게이트를 인용한다). Rust regex 는
      #   lookaround 가 없어 이 형태 말고는 「주석 밖」을 표현할 수단이 없다.
      # ★`\b` + `::` 요구가 정당한 이웃을 가른다★ — 이 모듈은 `std::time::Instant` 를 쓴다(결정론 하네스의
      #   주입점). `tokio::time::Instant` 만 잡고 std 쪽은 안 잡아야 해서 crate 뿌리 이름을 물었고, `\b` 가
      #   `my_tauri::` 같은 부분일치를 막는다.
      # ★알려진 한계 = 블록 주석(`/* */`)★ — 그 안쪽은 접두 가드가 못 막는다. 대상 파일은 `//` 만 쓴다.
      # ★`test -f` 를 지우지 말 것★ — 파일이 또 이사하면 rg 는 매치 0 을 뱉고 0 = PASS 라 벽이 조용히
      #   사라진다(rc=2 갈래도 같은 것을 잡지만 사유를 못 찍는다). `-d` 가 아니라 `-f` 다 — 대상이 파일이다.
      - name: 'Gate: replay_flight purity — no transport/wire ingress'
        shell: bash
        run: |
          set +e
          f=src-tauri/src/daemon_client/replay_flight.rs
          if [ ! -f "$f" ]; then echo "FAIL — 게이트 대상 파일이 없다: $f (또 이사했나)"; exit 1; fi
          hits=$(rg "^(?:[^/]|/[^/])*?\b(tauri|tokio|engram_dashboard_[a-z_]+|std::net)::" "$f")
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # ADR-0177: 재사용 전송 lib(`transport` — 신설)의 격리 게이트 셋. 기대값·근거·「지우지 말 것」의
      #   정본은 `crates/engram-dashboard-transport/src/lib.rs` 헤더의 「격리 게이트」 절이고 여기는
      #   부르기만 한다 — 기대값을 이 워크플로에 다시 해설해 두 번째 정본을 만들지 않는다.
      #   그 헤더의 게이트 ④(세 feature 조합이 각각 컴파일된다)와 ⑤(실소켓 스위트가 비지 않았나)는
      #   컴파일이 필요해 backend 잡에 있다(`transport gate 4a`/`4b`/`4c`/`4d`).
      # ★셋이 각각 다른 축이라 하나로 줄이지 말 것★ — ①은 워크스페이스 멤버만 세므로 서드파티 `tauri` 를
      #   그냥 통과시키고(그 축이 ②), ③은 crate **안쪽** 층 경계라 ①②가 아예 안 본다.
      # 종료코드 반전·`set +e` 함정은 이 잡 위쪽 공통 주석 그대로다.

      # 형태·플래그는 messaging·command·base 상한 게이트와 같다(줄이면 rename·`[dependencies.<이름>]`
      #   테이블 형·`[build-dependencies]`·비활성 target·optional 이 전부 정상 Cargo 문법으로 샌다).
      # ★이 게이트에만 경로 존재 사전점검이 없다 — 필요가 없어서다★: rg 가 읽는 것은 파일이 아니라
      #   cargo tree 의 stdout 이고, 패키지가 사라지거나 개명하면 `cargo tree -p` 자체가 0 이 아닌
      #   종료코드로 죽어 아래 첫 분기가 잡는다. 아래 ②③은 경로를 직접 훑으므로 사전점검이 있다.
      - name: 'transport gate 1: direct workspace deps ceiling (exactly 1 = self)'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-transport --depth 1 --prefix none -e normal,dev,build --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          out=$(printf '%s\n' "$tree" | rg "^engram-dashboard" | sort -u)
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$out" ]; then n=0; else n=$(printf '%s\n' "$out" | wc -l | tr -d '[:space:]'); fi
          echo "found $n direct workspace dep(s):"
          printf '%s\n' "$out"
          if [ "$n" -ne 1 ]; then echo "FAIL — expected exactly 1(자기 자신) — 워크스페이스 crate 의존이 반입됐다"; exit 1; fi
          echo "PASS"

      # ADR-0003 의 격리 불변식. ★위 ①이 이 축을 덮는다고 읽지 말 것★ — ①은 `rg "^engram-dashboard"` 로
      #   워크스페이스 멤버만 세므로 서드파티 `tauri` 는 그 게이트를 그대로 통과한다.
      # ★`test -d` 를 지우지 말 것★ — crate 를 옮기거나 개명하면 rg 는 매치 0 을 뱉고 0 = PASS 라 벽이
      #   조용히 사라진다(rc=2 갈래도 같은 것을 잡지만 사유를 못 찍는다).
      - name: 'transport gate 2: no `use tauri` in the transport crate'
        shell: bash
        run: |
          set +e
          d=crates/engram-dashboard-transport/src
          if [ ! -d "$d" ]; then echo "FAIL — 게이트 대상 디렉터리가 없다: $d (개명했나·이사했나)"; exit 1; fi
          hits=$(rg "^\s*use tauri" "$d/")
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # 순수 층(`pending.rs`·`stream.rs`·`machine.rs`)이 런타임·소켓·워크스페이스 crate 를 안 무는 벽.
      # ★같은 crate 안이라 컴파일러 backstop 이 없다★ — `tokio` 한 줄이 그냥 컴파일되므로 이 정규식이
      #   유일한 벽이다. 형태의 근거는 위 `replay_flight` 순수성 게이트 주석과 같다(접두
      #   `^(?:[^/]|/[^/])*?` = 「아직 `//` 를 안 만났다」 → 주석 밖만 잡아 헤더 자기인용이 오탐되지 않고 ·
      #   `use` 줄만 앵커하면 인라인 완전경로 `tokio::spawn(…)` 한 줄에 뚫리며 · `\b`+`::` 가 정당한 이웃
      #   `std::time::Instant` 를 가른다).
      # ★파일이 사라져도 매치는 0 = PASS 라 세 파일의 존재를 먼저 본다★(`-d` 가 아니라 `-f` — 대상이 파일이다).
      # ★`$files` 를 따옴표로 감싸지 말 것★ — 세 경로로 갈라져 rg 인자가 돼야 한다(경로에 공백이 없다).
      - name: 'transport gate 3: pure layer isolation (pending/stream/machine)'
        shell: bash
        run: |
          set +e
          files='crates/engram-dashboard-transport/src/pending.rs crates/engram-dashboard-transport/src/stream.rs crates/engram-dashboard-transport/src/machine.rs'
          for f in $files; do
            if [ ! -f "$f" ]; then echo "FAIL — 게이트 대상 파일이 없다: $f (개명했나·이사했나)"; exit 1; fi
          done
          hits=$(rg "^(?:[^/]|/[^/])*?\b(tokio|futures_util|futures|engram_dashboard_[a-z_]+|std::net)::" $files)
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      - name: 'net gate 1: source refs — no daemon/messaging'
        shell: bash
        run: |
          set +e
          hits=$(rg "engram_dashboard_(daemon|messaging)" crates/engram-dashboard-net/src/)
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # net gate 2a — platform 심볼 allowlist(심볼 단위): ① 뽑은 심볼 목록 = 아래 다섯 이름(정확히) ② crate 이름을
      #   심볼 꼴이 아닌 모양으로 부르는 줄 0. 2b 와 짝이다(하나만 남기지 말 것). 근거 · 한계의 정본 =
      #   `crates/engram-dashboard-net/src/lib.rs` 헤더 게이트 2.
      - name: 'net gate 2a: platform symbol allowlist — exactly these 5 names, no hidden import forms'
        shell: bash
        run: |
          set +e
          raw=$(rg -o --no-filename "engram_dashboard_platform::[A-Za-z0-9_:]+" crates/engram-dashboard-net/src/)
          rc=$?
          set -e
          if [ "$rc" -gt 1 ]; then echo "FAIL — rg errored (exit $rc)"; exit 1; fi
          out=$(printf '%s\n' "$raw" | sed '/^$/d' | LC_ALL=C sort -u)
          expected=$(LC_ALL=C sort <<'NET_PLATFORM_SYMBOLS'
          engram_dashboard_platform::fs::is_access_denied
          engram_dashboard_platform::fs::is_sharing_violation
          engram_dashboard_platform::fs::open_deny_write
          engram_dashboard_platform::process::current_process_start_time
          engram_dashboard_platform::process::pid_alive_with_start_time
          NET_PLATFORM_SYMBOLS
          )
          echo "found symbol(s):"
          printf '%s\n' "$out"
          if [ "$out" != "$expected" ]; then
            echo "FAIL — expected exactly these 5:"
            printf '%s\n' "$expected"
            exit 1
          fi
          set +e
          hidden=$(rg -n '^(?:[^/]|/[^/])*?\bengram_dashboard_platform(?:[^:]|:[^:]|::[^A-Za-z0-9_]|:{0,2}$)' crates/engram-dashboard-net/src/)
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 5 names, 0 hidden import forms" ;;
            0) echo "FAIL — platform 을 심볼 꼴이 아닌 모양(별칭 · 중괄호 · glob · 끊긴 경로)으로 부른다:"; printf '%s\n' "$hidden"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # net gate 2b — 에이전트 런타임 재유입 0줄(2a 의 짝). 패턴의 괄호 · 맨 crate 이름 · 값어치의 정본 =
      #   `crates/engram-dashboard-net/src/lib.rs` 헤더 게이트 2b.
      - name: 'net gate 2b: no agent runtime symbols — 0 matches'
        shell: bash
        run: |
          set +e
          hits=$(rg "engram_dashboard_(a)gent" crates/engram-dashboard-net/src/)
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # 매니페스트 텍스트가 아니라 **해석된 의존 그래프**를 읽는다 — rename·테이블 형·비활성 target·
      # optional 같은 정상 Cargo 문법이 텍스트 grep 을 빠져나가기 때문. 플래그를 줄이면 그만큼 형태가
      # 새므로(-e build↔build-deps · --target all↔비활성 target · --all-features↔optional) 줄이지 말 것.
      # --locked 는 커밋된 Cargo.lock 그대로 읽게 한다 — 없으면 새로 해석한 그래프를 단언해 소비자가
      # 실제로 보는 것과 다른 답을 낼 수 있다.
      - name: 'net gate 3: direct workspace deps — exactly 3'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-net --depth 1 --prefix none -e normal,dev,build --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          out=$(printf '%s\n' "$tree" | rg "^engram-dashboard" | sort -u)
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$out" ]; then n=0; else n=$(printf '%s\n' "$out" | wc -l | tr -d '[:space:]'); fi
          echo "found $n direct workspace dep(s):"
          printf '%s\n' "$out"
          if [ "$n" -ne 3 ]; then echo "FAIL — expected exactly 3"; exit 1; fi
          echo "PASS"

      # 패턴의 괄호는 오타가 아니다 — 맨 이름으로 적으면 이 게이트를 설명하는 net crate 의 헤더 주석이
      # 자기 자신에 걸려 영원히 통과하지 못한다. 단어 경계도 일부러 안 건다(부분 문자열까지 문다).
      - name: 'net gate 4: no auth vocabulary re-entry'
        shell: bash
        run: |
          set +e
          hits=$(rg "(A)gentCommand|(P)ROTOCOL_VERSION" crates/engram-dashboard-net/src/)
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # platform 게이트 ⑦ — 동기 crate 에 async 런타임이 **조용히** 딸려오는 것을 잡는다(net 게이트 5 는 컴파일
      #   여부만 보는데, 조용히 딸려온 의존은 컴파일을 깨지 않는다). 셋 다 정상 그래프(`-e normal`)를 읽는다:
      #   1. agent → 0줄 — tokio 없는 동기 crate 이면서 base · command · platform 을 운영 의존으로 지므로 셋이 이 한
      #      줄로 함께 덮인다.
      #   2. net(기본 feature) → 0줄 — feature 0개 소비자에게 async 런타임이 딸려오는 것. 실제로 한 번 터진 회귀이고
      #      net 의 `default = []` 결정을 부른 원인이다.
      #   3. 짝: net `--features server` → 1줄 이상(ADR-0278 꼴) — `server` 가 tokio · tokio-tungstenite · futures-util
      #      을 켠다.
      #   대상 · 범위 · 한계의 정본 = `crates/engram-dashboard-platform/src/lib.rs` 헤더 게이트 ⑦.
      # ★`^…␣` 앵커(뒤 공백 포함)를 빼지 말 것★: 맨 부분문자열로 적으면 ter(mio)s 가
      #   걸려 기대값이 0 이 아니게 되고, 그러면 사람이 매번 판정해야 한다(= 게이트가 죽는다).
      # ★짝을 지우지 말 것★ — 패턴이 깨지거나 `cargo tree` 출력 꼴이 바뀌면 0 기대 둘이 매치할 줄을 잃고 눈먼 채
      #   통과한다. 짝이 그 눈먼 통과를 빨갛게 만든다. 대상 crate 를 개명하면 `cargo tree -p` 가 죽어 FAIL 이다.
      # ADR-0282
      - name: 'platform gate 7: no async-runtime ingress (agent · net default = 0, net server >= 1)'
        shell: bash
        run: |
          # $1 = 기대(zero = 0줄 · some = 1줄 이상) · 나머지 = `cargo tree` 의 대상 인자.
          async_ingress() {
            local want=$1 tree hits n rc=0
            shift
            echo "== cargo tree $* (expect $want)"
            tree=$(cargo tree --locked "$@" -e normal --prefix none --target all) || rc=$?
            if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; return 1; fi
            hits=$(printf '%s\n' "$tree" | rg -i "^(tokio|mio|tokio-tungstenite|futures-util) ") || rc=$?
            case "$want:$rc" in
              zero:1) echo "PASS — 0 matches" ;;
              zero:0) echo "FAIL — async runtime leaked:"; printf '%s\n' "$hits"; return 1 ;;
              some:0) n=$(printf '%s\n' "$hits" | wc -l | tr -d '[:space:]'); echo "PASS — $n matches"; printf '%s\n' "$hits" ;;
              some:1) echo "FAIL — 짝: 0 matches — 패턴이나 cargo tree 출력 꼴이 망가졌나(그러면 0 기대 줄이 눈먼다)"; return 1 ;;
              *) echo "FAIL — rg errored (exit $rc)"; return 1 ;;
            esac
          }
          async_ingress zero -p engram-dashboard-agent
          async_ingress zero -p engram-dashboard-net
          async_ingress some -p engram-dashboard-net --features server

  # ── 프론트 ───────────────────────────────────────────────────────────────────
  frontend:
    name: frontend (vitest + tsc)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: npm ci
        shell: bash
        run: npm ci

      - name: npm test
        shell: bash
        run: npm test

      # 별도 typecheck 스크립트가 없어 tsc 를 직접 부른다.
      - name: npx tsc --noEmit
        shell: bash
        run: npx tsc --noEmit

  # ── 릴리즈 (버전 태그 전용) — 빌드 잡과 발행 잡을 가른다 ──────────────────────
  # ★두 잡으로 가르는 이유(공급망)★
  # 패키징은 `npm ci` 와 tauri 빌드로 수백 개 전이 의존성의 코드를 러너에서 실행한다. 그중 하나가
  # `GITHUB_PATH` 에 가짜 `gh` 를 앞세우면, **같은 잡에서** 나중에 부르는 `gh` 는 그 가짜다 — 스텝 단위
  # `env:` 로 토큰을 좁혀도 소용없다. 공격 대상은 "누가 env 를 읽을 수 있나"가 아니라 "`gh` 가 무엇으로
  # 해석되나"이기 때문이다. 그래서 쓰기 토큰은 서드파티 코드가 한 줄도 돌지 않는 잡에만 둔다.
  #   release-build   : contents=read  · 서드파티 코드가 도는 곳 · 결과를 아티팩트로만 넘긴다
  #   release-publish : contents=write · 아티팩트 다운로드 + gh 호출뿐 · npm/cargo/패키징 스크립트 없음
  # ★release-publish 에 스텝을 늘리지 말 것★ — 스텝 하나가 곧 서드파티 코드가 다시 기어들 자리다.
  #
  # ★`ref_type == 'tag'` 만으로는 부족★ — 위 `tags: ['v*']` 글롭은 **push 에만** 걸린다.
  # workflow_dispatch 는 아무 ref 나 겨눌 수 있어서, 태그 조건만 보면 `backup/comments-pass-20260731`
  # 같은 비-버전 태그를 겨눈 수동 실행이 그대로 **공개 GitHub Release** 를 만들어 버린다.
  # 그래서 push 글롭과 같은 조건을 직접 재현한다: v 로 시작 + `/` 없음(GitHub 글롭의 `*` 는 `/` 를 넘지
  # 않는다). 조건을 **두 잡 모두**에 건다 — build 가 skip 되면 needs 로 publish 도 skip 되므로 build 쪽만
  # 으로도 닫히지만, 실제로 릴리즈를 만드는 잡이 스스로도 같은 조건을 들고 있게 한다.
  #
  # 패키징 로직을 여기서 다시 짜지 않는다. ADR-0100 co-location 불변식과 "무엇을 배송하는가"의 단일
  # 출처는 scripts/build-release.ps1 의 manifest 이고, 이 잡은 그 스크립트를 부르고 결과를 zip 으로
  # 옮길 뿐이다. 기대 파일 목록을 이 YAML 에 적으면 출처가 둘이 되어 반드시 어긋난다.
  release-build:
    name: release build (package + zip)
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '/')
    needs: [backend, gates, frontend]
    runs-on: windows-latest
    # 최적화 빌드는 디버그 테스트 잡보다 훨씬 오래 걸린다. 컴파일 캐시를 쓰지 않아(아래) 매번 cold 로 돈다.
    timeout-minutes: 90
    # 이 잡은 읽기만 한다. 쓰기 토큰은 release-publish 에만 있다(위 분리 이유 참조).
    permissions:
      contents: read
    env:
      # 태그 문자열을 run 본문에 `${{ }}` 로 직접 보간하지 않는다(스크립트 인젝션 표면) — env 로 넘긴다.
      # 버전은 태그가 곧 정답이다. 여기서 버전을 계산·가공하지 않는다.
      TAG: ${{ github.ref_name }}
    # ★이 잡이 발행 잡으로 넘기는 값은 이것 하나뿐이다★ — 파일 이름조차 넘기지 않는다.
    # 이름을 넘기면 빌드 잡이 통제하는 문자열이 쓰기 토큰 잡의 `gh` 인자로 들어간다(글롭을 품은 이름 +
    # 짝 맞는 파일들로 다른 에셋을 올리게 유도할 수 있다). 발행 잡은 TAG 에서 스스로 이름을 만든다.
    outputs:
      built_commit: ${{ steps.built.outputs.commit }}
    steps:
      # ★가장 먼저 돈다(checkout 보다도 앞)★ — 태그 이름이 경로·파일명으로 안전한지부터 본다.
      # 아래 스텝들이 태그 문자열을 조립 폴더 이름과 zip 파일 이름에 그대로 박기 때문이다. 특히 `/` 가
      # 들어가면 조립 경로가 한 단계 더 파여(`…\engram-dashboard-v1\beta`) `Split-Path -Leaf` 가 `beta` 만
      # 집어, zip 이름도 co-location 폴더 이름도 버전을 잃는다. 그리고 아래 zip 게이트는 그걸 못 잡는다 —
      # 게이트의 기대 루트명이 **같은 오염된 경로에서 파생**되므로 사이좋게 통과한다(구조적 사각).
      # `if` 의 `/` 차단과 중복이지만, 이건 값 자체를 보는 마지막 방어선이고 빌드 앞에서 몇 초에 끝난다.
      # 버전 **형식**을 강제하지 않는 이유: 태그가 곧 버전이라 형식은 이 잡이 정할 문제가 아니다.
      # 여기서 보는 것은 "경로·파일명으로 쓸 수 있는가" 하나뿐이다.
      - name: 'Gate: tag name is safe as a path and file name'
        shell: bash
        run: |
          echo "TAG=$TAG"
          # 허용 문자만 통과(allowlist). 여기 없는 것은 전부 거부되므로 / \ : * ? " < > | 와 공백·제어문자가
          # 자동으로 걸린다. 선두 v 도 함께 단언한다.
          # ★이 allowlist 는 글롭 차단으로도 load-bearing 이다 — 느슨하게 풀지 말 것★
          # 아래 스텝의 PowerShell 파라미터 3개가 값을 **와일드카드 패턴으로 해석**한다:
          # `Compress-Archive -Path`, 그리고 zip 게이트의 `Get-ChildItem -Path` 2회.
          # 지금 안전한 유일한 이유가 allowlist 에 * ? [ ] 가 없어서다. 여기에 그 문자들을 들이면
          # 조립 폴더 경로가 조용히 패턴 매칭으로 바뀌어(엉뚱한 폴더를 담거나 빈 결과를 내고)
          # 게이트의 기대값마저 같은 패턴에서 파생되므로 사이좋게 통과한다.
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._+-]+$ ]]; then
            echo "FAIL — 태그에 경로·파일명으로 안전하지 않은 문자가 있다(허용: v 로 시작 + 영숫자 . _ + -)"
            exit 1
          fi
          # allowlist 를 통과하지만 여전히 위험한 두 형태를 따로 막는다.
          case "$TAG" in
            *..*) echo "FAIL — 태그에 '..' 이 있다(경로 상위 이동)"; exit 1 ;;
            *.)   echo "FAIL — 태그가 '.' 로 끝난다(Windows 가 파일명 끝 점을 잘라낸다)"; exit 1 ;;
          esac
          # 경로 길이 상한 여유분. RUNNER_TEMP + 조립 폴더 + prompts/agent-priming.md 가 MAX_PATH 를
          # 넘지 않게 하는 안전 한도지 버전 형식 규칙이 아니다.
          if [ "${#TAG}" -gt 64 ]; then echo "FAIL — 태그가 64자를 넘는다(${#TAG})"; exit 1; fi
          echo "PASS — tag name is usable as a path/file name"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # checkout 직후, 서드파티 코드가 한 줄이라도 돌기 **전에** 기록한다. 이 값이 발행 잡으로 건너가
      # "그때 원격 태그가 아직 이 커밋을 가리키나"를 판정하는 기준이 된다.
      # HEAD 를 읽는 이유: checkout 은 github.sha 를 체크아웃하는데 annotated 태그면 그 값이 태그
      # 오브젝트일 수 있고, 실제로 컴파일되는 것은 언제나 peel 된 커밋이다. 여기서 읽으면 그 애매함이 없다.
      - name: Record the commit that is actually being built
        id: built
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          if [ -z "$sha" ]; then echo "FAIL — git rev-parse HEAD 가 비었다"; exit 1; fi
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "built commit = $sha"

      # ★검증만 한다 — 버전 필드를 절대 고쳐 쓰지 않는다★(사용자 결정).
      # 빌드 중에 버전을 써넣으면 레포 내용과 배포물의 대응이 깨져서, 나중에 그 태그를 체크아웃해도
      # 나간 물건을 재현할 수 없다. 사람이 버전 올리는 커밋을 먼저 만들고 그 커밋에 태그를 단다.
      # 비싼 빌드 앞에 둔다 — 여기서 걸리면 몇 초 만에 끝난다.
      #
      # ── 무엇을 보나 (5건) ──
      #   1. src-tauri/tauri.conf.json — Tauri 제품 버전. 설정에 있으면 이 값이 이긴다.
      #   2. src-tauri/Cargo.toml — ★tauri.conf.json 의 version 이 **없을 때의 폴백**이라 그 자체로
      #      load-bearing 이다★. 실측(tauri-utils 2.9.3 `src/config.rs` `Config::version` 문서):
      #      "a semver version number or a path to a `package.json` file … If removed the version number
      #      from `Cargo.toml` is used." → 암묵 폴백은 Cargo.toml 이다. 1이 있다고 이걸 중복으로 보고
      #      지우지 말 것 — 1을 지우는 순간 이게 제품 버전이 된다.
      #   3. crates/engram-dashboard-daemon/Cargo.toml — daemon.exe·engram.exe 를 만드는 crate.
      #      코드가 실제로 읽는다: agent_conn.rs 가 env!("CARGO_PKG_VERSION") 로 hello 이벤트에 실어
      #      보낸다 → 어긋나면 에이전트에게 거짓 버전이 나간다.
      #   4. package.json — ★산출물에 닿지 않는다★. 어디서도 import 되지 않고, Tauri 가 여기를 읽는 것은
      #      tauri.conf.json 의 version 을 **package.json 경로 문자열로 명시**했을 때뿐이다(위 실측 인용).
      #      그럼에도 거는 이유는 배포 경로가 아니라 자기기술 일관성 — 레포 루트가 스스로를 다른 버전이라
      #      말하면 사람이 잘못된 답을 얻는다. 이건 배송 결함이 아니라 문서 결함이라 등급이 다르다.
      #   5. package-lock.json (루트 `version` 만) — npm 이 package.json 에서 받아쓰는 거울값.
      #      `npm ci` 의 정합성 검사는 의존성 스펙만 보고 이 필드는 안 본다 → 버전만 올리고 install 을
      #      안 하면 조용히 어긋난 채 남는다. 루트 키만 단언한다(들여쓰기 2칸 = 루트, 구조적으로 유일).
      #      packages[""].version 이라는 사본이 하나 더 있지만 따로 안 본다 — npm 이 둘을 항상 같이 쓰므로
      #      현실의 drift 는 "lock 을 아예 갱신 안 함"이고 그건 루트 단언이 그대로 잡는다.
      # ── 일부러 뺀 것 ──
      #   - 라이브러리 crate(agent·base·command·messaging·net·platform·protocol·transport)의 crate 버전: 단독 배송물이 없는
      #     내부 semver. 정적 링크돼 사용자에게 보이지 않는다. 첫 비-0.1.0 태그부터 제품 버전과 갈리는데
      #     그건 의도된 결과다.
      #   - PROTOCOL_VERSION(protocol crate, 현재 3): wire 계약 버전이라 릴리즈가 아니라 계약이 바뀔 때
      #     움직인다. 릴리즈 버전에 묶으면 의미를 잃는다.
      #   - Cargo.lock: 여기 없어도 된다. 버전만 올리고 lock 을 갱신 안 하면 backend 잡의 `--locked` 가
      #     먼저 죽고, release-build 는 그 잡을 needs 하므로 애초에 시작하지 못한다.
      - name: 'Gate: product versions match the tag'
        shell: bash
        run: |
          expected="${TAG#v}"
          echo "expected product version = $expected  (from tag $TAG)"
          fail=0
          # [package] 섹션 안의 version 만 읽는다 — 의존성 테이블의 version 과 섞이지 않게.
          cargo_version() {
            awk '
              /^[[:space:]]*\[/ { inpkg = ($0 ~ /^[[:space:]]*\[package\][[:space:]]*$/); next }
              inpkg && match($0, /^[[:space:]]*version[[:space:]]*=[[:space:]]*"[^"]+"/) {
                s = substr($0, RSTART, RLENGTH); sub(/^[^"]*"/, "", s); sub(/".*$/, "", s); print s; exit
              }
            ' "$1"
          }
          # 들여쓰기 2칸에 앵커한다 = JSON 최상위 키. package-lock.json 은 `"version"` 이 여러 번
          # 나오는데(packages[""] · 모든 의존성) 루트만 2칸이라 이 앵커가 정확히 하나를 고른다.
          # 앵커를 `[[:space:]]*` 로 느슨하게 두면 의존성 버전을 집어 엉뚱한 값을 단언하게 된다.
          json_root_version() {
            sed -nE 's/^  "version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' "$1" | head -1
          }
          check() {
            if [ ! -f "$1" ]; then echo "  FAIL $1 — 파일이 없다(경로가 바뀌었나)"; fail=1; return; fi
            if [ -z "$2" ]; then echo "  FAIL $1 — version 필드를 읽지 못했다(형식이 바뀌었나)"; fail=1; return; fi
            if [ "$2" != "$expected" ]; then echo "  FAIL $1 — expected '$expected', found '$2'"; fail=1; return; fi
            echo "  OK   $1 — $2"
          }
          check src-tauri/tauri.conf.json                  "$(json_root_version src-tauri/tauri.conf.json)"
          check src-tauri/Cargo.toml                      "$(cargo_version     src-tauri/Cargo.toml)"
          check crates/engram-dashboard-daemon/Cargo.toml "$(cargo_version     crates/engram-dashboard-daemon/Cargo.toml)"
          check package.json                              "$(json_root_version package.json)"
          check package-lock.json                         "$(json_root_version package-lock.json)"
          if [ "$fail" -ne 0 ]; then
            echo "FAIL — 태그가 말하는 버전과 제품이 보고할 버전이 다르다."
            echo "  CI 는 버전을 고쳐 쓰지 않는다(레포 내용 ↔ 배포물 대응 유지). 위에서 FAIL 난 파일의"
            echo "  version 을 '$expected' 로 올린 커밋을 만들고, 그 커밋에 태그를 달아 다시 돌릴 것."
            exit 1
          fi
          echo "PASS — 제품 버전 선언 5건 전부 $expected"

      - name: Resolve and assert pinned toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          expected=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)
          if [ -z "$expected" ]; then echo "FAIL — rust-toolchain.toml 에서 channel 을 읽지 못했다"; exit 1; fi
          actual=$(rustc --version | awk '{print $2}')
          if [ "$actual" != "$expected" ]; then
            echo "FAIL — pinned '$expected' but active rustc is '$actual'"
            exit 1
          fi
          echo "PASS — toolchain $actual matches rust-toolchain.toml"

      # ★rust-cache 를 일부러 쓰지 않는다★ — 컴파일 산출물(target/)은 아무것도 복원하지 않고 매번
      # cold 로 굽는다. 캐시는 검증 잡처럼 자주 도는 레인에서 값이 나오는 것이고, 태그당 한 번 도는
      # 이 잡에서는 절약분보다 "복원된 오브젝트가 배포 바이너리에 섞였는가"를 사람이 배제할 수 없게
      # 되는 비용이 크다.
      # ★단 아래 setup-node 의 `cache: npm` 은 켠다 — 이건 target/ 캐시와 성질이 다르다.★
      # 복원 대상이 `~/.npm`(패키지 tarball 캐시)뿐이고 node_modules 가 아니다. `npm ci` 는 node_modules 를
      # 통째로 지우고 package-lock.json 의 integrity 해시로 tarball 을 검증하므로, 캐시에서 온 것이
      # 락파일과 다르면 설치가 실패한다. 즉 "cold" 주장은 컴파일 산출물 축에 한정된다.

      # build-release.ps1 은 `npm run tauri -- build --no-bundle` 을 부르고, 그 tauri build 가
      # tauri.conf.json 의 beforeBuildCommand(`npm run build`)로 프론트를 굽는다 → node_modules 가
      # 반드시 있어야 한다(@tauri-apps/cli · vite · tsc 전부 여기서 온다).
      # ※여기부터가 서드파티 코드가 도는 구간이다 — 위 게이트·커밋 기록은 전부 이 앞에서 끝났다.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: npm ci
        shell: bash
        run: npm ci

      # ★별도 `npm run build` 스텝을 두지 않는다★ — 두면 프론트를 두 번 굽고, 더 나쁘게는 "dist/ 는
      # 이 스텝이 만든다"는 오해를 남긴다. 실제로는 tauri build 가 beforeBuildCommand 로 직접 굽고
      # 그 산출물을 exe 에 embed 하며(그래야 프로덕션 컨텍스트가 된다), 스크립트가 직후
      # dist/index.html 부재를 tripwire 로 잡는다. 굽는 주체는 tauri CLI 다.
      #
      # 호출형은 launch\빌드.bat 과 동일하다(-NoProfile -File + 절대 -OutDir). 같은 세션에서 `&` 로
      # 부르지 않고 자식 프로세스로 띄우는 이유: 스크립트가 실패를 `exit 1` 로 알리는데, 같은 세션
      # 호출에서는 그게 $LASTEXITCODE 로만 남아 넘어갈 여지가 있다. 자식 프로세스면 종료코드가 곧
      # 프로세스 종료코드다. $ErrorActionPreference 는 네이티브 종료코드를 잡지 않으므로 명시 확인도 둔다.
      #
      # -OutDir 를 주는 이유: 조립 폴더 이름이 곧 zip 의 루트 폴더 이름이 된다. 버전이 박힌 폴더로
      # 조립해 두면 사용자가 압축을 풀었을 때 3 exe + prompts/ 가 한 폴더에 함께 떨어진다
      # (= ADR-0100 co-location 이 사용자 손에서 깨지지 않는다).
      - name: Package portable release (scripts/build-release.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP "engram-dashboard-${env:TAG}"
          & pwsh -NoProfile -File "scripts/build-release.ps1" -OutDir $stage
          if ($LASTEXITCODE -ne 0) { throw "build-release.ps1 exited $LASTEXITCODE" }
          if (-not (Test-Path $stage)) { throw "조립 폴더가 없다: $stage" }
          "STAGE_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # 파일명에 버전을 박는다(태그 그대로). 릴리즈 페이지에서 에셋만 보고 어느 버전인지 알아야 한다.
      # 이름은 여기서 한 번만 만들고 발행 잡에는 job output 으로 넘긴다 — 양쪽에서 각자 조립하면
      # 규칙이 두 곳에 생겨 어긋난다.
      - name: Zip the packaged folder
        id: zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactName = "engram-dashboard-${env:TAG}-windows-x64"
          $zipName = "$artifactName.zip"
          $zip = Join-Path $env:RUNNER_TEMP $zipName
          # -Path 에 와일드카드 없이 폴더 자체를 주면 그 폴더가 zip 의 루트 엔트리가 된다.
          Compress-Archive -Path $env:STAGE_DIR -DestinationPath $zip -CompressionLevel Optimal
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # upload-artifact 는 경로를 glob 으로 해석한다. Windows 에서 역슬래시가 구분자로 처리되긴 하지만
          # 이 판단에 90분짜리 빌드의 회수 여부를 걸 이유가 없어, 그 스텝에는 슬래시 형태를 따로 넘긴다.
          "ZIP_PATH_POSIX=$($zip -replace '\\', '/')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # 같은 잡 안의 upload-artifact 만 쓴다(신뢰 경계를 넘지 않는다). 발행 잡은 이 값을 받지 않고
          # TAG 에서 같은 규칙으로 스스로 만든다 — 두 곳이 어긋나면 download-artifact 가 아티팩트를
          # 못 찾아 시끄럽게 죽는다(조용한 drift 대신 tripwire).
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # manifest 자체(부족/여분/co-location)는 build-release.ps1 의 tripwire 가 이미 본다 — 여기서
      # 다시 세지 않는다. 이 게이트가 맡는 건 그 다음 경계 하나다: **압축이 그 집합을 그대로 옮겼는가.**
      # 기대값을 YAML 에 적지 않고 조립 폴더에서 읽는 이유도 같다(단일 출처는 스크립트의 manifest).
      # Expand-Archive 가 손상 zip 에서 죽으므로 아카이브 판독 가능성까지 같이 확인된다.
      - name: 'Gate: the zip carries exactly the packaged file set'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = $env:STAGE_DIR
          $zip   = $env:ZIP_PATH
          if (-not (Test-Path $zip)) { throw "zip 이 만들어지지 않았다: $zip" }
          $expected = @(Get-ChildItem -Recurse -File -Force -Path $stage |
            ForEach-Object { $_.FullName.Substring($stage.Length + 1) } | Sort-Object)
          # "빈 것을 조용히 배송" 차단. 스크립트 tripwire 상 도달 불가여야 하지만, 그 가정이 깨지는
          # 날에는 빈 zip 이 릴리즈에 붙는 게 최악이라 여기서 한 번 더 막는다.
          if ($expected.Count -eq 0) { throw "조립 폴더가 비었다 — 배송할 것이 없다: $stage" }
          $verifyRoot = Join-Path $env:RUNNER_TEMP 'zip-verify'
          if (Test-Path $verifyRoot) { Remove-Item -Recurse -Force $verifyRoot }
          Expand-Archive -Path $zip -DestinationPath $verifyRoot
          $rootName = Split-Path -Leaf $stage
          $unpacked = Join-Path $verifyRoot $rootName
          if (-not (Test-Path $unpacked)) { throw "zip 루트 폴더가 '$rootName' 이 아니다" }
          $actual = @(Get-ChildItem -Recurse -File -Force -Path $unpacked |
            ForEach-Object { $_.FullName.Substring($unpacked.Length + 1) } | Sort-Object)
          # -cne(대소문자 구분) — PowerShell 기본 비교는 대소문자를 무시해서, 이름의 케이스가 바뀐 채
          # 압축된 경우를 그냥 통과시킨다. 케이스 변화는 무언가가 이름을 다시 썼다는 신호라 잡아야 한다.
          if (($expected -join '|') -cne ($actual -join '|')) {
            Write-Host 'expected:'; $expected | ForEach-Object { Write-Host "  $_" }
            Write-Host 'actual:';   $actual   | ForEach-Object { Write-Host "  $_" }
            throw 'zip 내용이 조립 폴더와 다르다 — 부분 배송 차단'
          }
          Write-Host "PASS — $($actual.Count) file(s) under $rootName/"
          $actual | ForEach-Object { Write-Host "  $_" }

      # 검증된 zip 을 아티팩트로 올린다. 이게 발행 잡으로 넘기는 **유일한** 통로다(러너가 다르므로
      # 파일이 저절로 건너가지 않는다). 덤으로 회복 레인이기도 하다 — 발행이 실패해도 90분 빌드가
      # 통째로 버려지지 않고, 사람이 내려받아 손으로 붙일 수 있다.
      # `overwrite: true` — "Re-run all jobs" 로 같은 런에서 다시 돌면 앞 시도의 아티팩트가 남아 있어
      #   기본값(false)이면 마지막 스텝에서 죽는다. 같은 런·같은 태그의 재생성물이라 교체가 맞는 의미다.
      # `if-no-files-found: error` — 경로가 비면 조용히 warn 하고 넘어가지 않는다.
      # `archive` 는 기본값(zip 으로 감쌈)을 그대로 쓴다 — 그래야 download-artifact 가 알아서 풀어
      #   `<zip_name>` 파일 하나를 그대로 내려놓는 가장 검증된 조합이 된다.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.zip.outputs.artifact_name }}
          path: ${{ env.ZIP_PATH_POSIX }}
          if-no-files-found: error
          overwrite: true

  # ── 릴리즈 발행 — 쓰기 토큰을 쥔 유일한 잡 ──────────────────────────────────
  # 여기서는 서드파티 코드를 돌리지 않는다: npm·cargo·build-release.ps1 전부 금지. 스텝은
  # ① 태그↔커밋 게이트 ② 아티팩트 다운로드 ③ gh release create 셋뿐이고, 늘리지 말 것.
  # 게이트를 다운로드보다 **앞**에 두는 이유: 게이트는 아티팩트가 필요 없다(gh api + env 만 본다).
  #   순서를 뒤집으면 "발행해도 되는가"를 정하기 전에 쓰기 토큰 잡이 빌드 잡이 만든 아카이브를 먼저
  #   풀게 된다. 공짜로 없앨 수 있는 순서 의존이므로 없앤다.
  # ubuntu-latest 인 이유: 여기엔 Windows 여야 할 일이 하나도 없다(바이트를 옮기고 gh 를 부를 뿐).
  #   부팅이 빠르고 토큰을 쥔 잡의 표면이 그만큼 작아진다. Windows 전용 작업이 생기면 그때 옮길 것.
  #
  # ★이 워크플로가 **막지 못하는 것** (다음 읽는 사람에게: 여기가 경계다)★
  #   1. 산출물 무결성. 잡 분리는 **쓰기 토큰 탈취**를 막을 뿐, 손상된 빌드 의존성이 트로이 목마
  #      바이너리를 zip 에 넣는 것은 못 막는다. 그러면 이 잡은 그걸 성실히 발행한다.
  #      재현 가능 빌드·코드 서명·의존성 감사는 이 워크플로 범위 밖이다.
  #   2. 빌드 프로버넌스 증명(actions/attest-build-provenance) 미도입 — 아래 발행 스텝 주석 참조.
  #   3. 아래 게이트와 `gh release create` 사이의 TOCTOU(약 1초). 창을 90분에서 1초로 줄였을 뿐
  #      없앤 것이 아니다. 이 도구 조합으로는 더 줄일 수 없다.
  #   4. 발행 재시도 없음(비멱등). 의도적이다 — 조용한 덮어쓰기보다 시끄러운 실패가 낫다.
  release-publish:
    name: release publish (GitHub Release)
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '/')
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # 최상위 contents: read 를 넓히지 않고 이 잡에만 write 를 준다(job-level 은 최상위를 상속이 아니라
    # 치환한다) — 릴리즈 생성·에셋 업로드에 필요한 최소 권한. 워크플로에서 쓰기 토큰은 여기뿐이다.
    permissions:
      contents: write
    # 워크플로 레벨 그룹과 별개로 이 잡만의 그룹을 둔다(cancel-in-progress: false) — 같은 태그를 겨눈
    # 두 실행이 동시에 릴리즈를 만들지 못하게 직렬화한다. 워크플로 그룹은 `CI-<github.ref>` 이고
    # github.ref 는 항상 `refs/` 로 시작하므로 `CI-release-publish-<github.ref>` 와는 어떤 ref 로도
    # 같아질 수 없다. 빌드 잡에는 걸지 않는다 — 되돌릴 수 없는 부작용은 여기에만 있다.
    concurrency:
      group: ${{ github.workflow }}-release-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
      # ★이름을 빌드 잡에서 받지 않고 여기서 만든다★ — 빌드 잡이 통제하는 문자열이 쓰기 토큰 잡의
      # `gh` 파일 인자로 들어가면, 글롭을 품은 이름 + 짝 맞는 파일들로 다른/여러 에셋을 올리게 유도할 수
      # 있다. github.ref_name 은 빌드 잡이 건드릴 수 없다. 규칙은 release-build 의 zip 스텝과 같아야 하고,
      # 어긋나면 아래 download-artifact 가 아티팩트를 못 찾아 죽는다(조용한 drift 대신 tripwire).
      ARTIFACT_NAME: engram-dashboard-${{ github.ref_name }}-windows-x64
      BUILT_COMMIT: ${{ needs.release-build.outputs.built_commit }}
      # 런 컨텍스트 값(GitHub 이 런 생성 시점에 박는다). 아래 게이트의 (3)에서 쓴다.
      RUN_SHA: ${{ github.sha }}
    steps:
      # ★이 게이트가 실제로 지키는 것: "빌드가 도는 동안 태그가 움직였는가"★
      # checkout 과 발행 사이에 90분 가까운 창이 있고, 그동안 "태그를 엉뚱한 커밋에 달았다"는 흔한 복구
      # (태그 삭제 후 재push)가 일어날 수 있다. 그러면 릴리즈는 커밋 B 를 가리키는데 에셋은 커밋 A 에서
      # 나온 물건이 된다. 이걸 보는 곳이 여기 말고는 없다. 값지고 실제로 일어나는 사고다.
      #
      # ★이 게이트가 지키지 **못하는** 것 — 산출물 무결성★ (오해 방지를 위해 명시)
      #   - BUILT_COMMIT 은 **빌드 전 HEAD** 를 증언할 뿐 패키징된 트리를 증언하지 않는다. npm 라이프사이클
      #     스크립트가 패키징 전에 소스를 고쳐도 이 게이트는 전부 통과한다.
      #   - 두 참조(원격 태그·github.sha) 모두 빌드 잡 **안에서도 읽을 수 있다**. 정보 비대칭이 없으므로
      #     손상된 빌드 잡의 최적 거짓말 — "진짜 태그 커밋을 정직하게 보고하고 바이트만 바꿔치기" — 은
      #     두 검사를 모두 통과한다. 이 게이트는 신뢰의 근거가 아니라 사고 탐지기다.
      #   - 아래 (3)의 github.sha 비교가 보태는 신호는 **결합 케이스 하나뿐**이다: 태그가 움직였고
      #     동시에 빌드 잡이 새 태그 커밋에 맞춰 거짓 보고한 경우. 독립적인 2차 검증이 아니다.
      # 복구를 시도하지 않는다 — 태그를 옮기거나 다시 붙이는 일은 사람이 판단할 몫이다.
      - name: 'Gate: the remote tag still points at the commit that was built'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$BUILT_COMMIT" ]; then echo "FAIL — 빌드 잡이 커밋 SHA 를 넘기지 않았다"; exit 1; fi
          # (1) 지금 이 순간의 원격 태그를 푼다. 경량 태그면 object 가 곧 커밋, annotated 면 태그
          #     오브젝트라 한 번 더 푼다(peel). 두 API 모두 실패하면 assignment 가 죽어 스텝이 실패한다.
          line=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          obj_type=${line%% *}
          obj_sha=${line##* }
          case "$obj_type" in
            commit) remote_commit="$obj_sha" ;;
            tag)
              line2=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj_sha" --jq '.object.type + " " + .object.sha')
              t2=${line2%% *}
              s2=${line2##* }
              if [ "$t2" != "commit" ]; then echo "FAIL — annotated 태그가 커밋을 가리키지 않는다(type=$t2)"; exit 1; fi
              remote_commit="$s2"
              ;;
            *) echo "FAIL — 예상 밖의 태그 오브젝트 타입: '$obj_type'"; exit 1 ;;
          esac
          echo "tag $TAG -> $obj_type $obj_sha -> commit $remote_commit"
          echo "built commit (release-build) = $BUILT_COMMIT"
          # (2) 본 게이트 — 빌드 이후 태그가 움직였나.
          if [ "$remote_commit" != "$BUILT_COMMIT" ]; then
            echo "FAIL — 태그가 빌드 시점 이후 다른 커밋으로 옮겨졌다. 이 에셋은 그 태그의 물건이 아니다."
            echo "  built   : $BUILT_COMMIT"
            echo "  tag now : $remote_commit"
            echo "  자동 복구하지 않는다. 태그를 원래 커밋으로 되돌리거나, 올바른 커밋에 새 버전 태그를"
            echo "  달아 처음부터 다시 돌릴 것."
            exit 1
          fi
          # (3) 결합 케이스 탐지(위 주석 참조 — 독립 검증이 아니다). 경량 태그면 github.sha 가 커밋과
          #     같고 annotated 면 태그 오브젝트일 수 있어 두 형태를 모두 인정한다 — 어느 쪽인지는 실제
          #     태그를 push 하기 전에는 확정할 수 없다(미검증 지점).
          if [ "$RUN_SHA" != "$BUILT_COMMIT" ] && [ "$RUN_SHA" != "$obj_sha" ]; then
            echo "FAIL — 빌드 잡이 보고한 커밋이 이 런의 ref 값과 이어지지 않는다."
            echo "  github.sha : $RUN_SHA"
            echo "  built      : $BUILT_COMMIT"
            echo "  tag object : $obj_sha"
            exit 1
          fi
          echo "PASS — 원격 태그가 여전히 빌드된 커밋을 가리킨다"

      # 이름은 위 env 의 ARTIFACT_NAME(= TAG 파생)만 쓴다. 빌드 잡이 다른 이름으로 올렸다면 여기서
      # 못 찾고 죽는다 — 그게 의도한 tripwire 다.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist-release

      # 새 서드파티 action 을 들이지 않는다 — gh CLI 는 GitHub-hosted 러너 이미지에 기본 탑재라
      # 업로드용 릴리즈 action 을 추가하면 핀 관리 대상(공급망 표면)만 하나 늘어난다.
      # --verify-tag: 원격에 그 태그가 없으면 릴리즈를 만들지 않고 실패한다.
      # 같은 태그의 릴리즈가 이미 있으면 gh 가 실패한다 — 조용한 덮어쓰기 대신 시끄럽게 죽는 쪽을 택한다
      # (비멱등. 재시도가 필요하면 사람이 판단해서 지우고 다시 돌린다).
      #
      # ★provenance attestation(actions/attest-build-provenance)은 일부러 넣지 않았다★
      # 그게 닫는 것은 "이 파일이 이 레포의 CI 에서 나왔는가"이지 "빌드 의존성이 깨끗했는가"가 아니라,
      # 위에 적은 산출물 무결성 갭을 닫지 못한다. 반면 값이 나오는 배치(빌드 잡)는 서드파티 코드가 도는
      # 바로 그 잡에 id-token: write + attestations: write 를 줘야 해서, 이 워크플로가 잡을 둘로 가른
      # 이유를 정면으로 되돌린다. 그래서 안 넣는다 — 대신 그 갭을 위 잡 헤더에 명시해 뒀다.
      - name: Create the GitHub Release and attach the zip
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip_name="${ARTIFACT_NAME}.zip"
          expected="dist-release/$zip_name"
          # 내려받은 것이 **정확히 파일 하나**이고 그 이름이 기대와 정확히 같아야 한다.
          # 개수를 먼저 보는 이유: 기대 이름의 파일 + 곁다리 파일들이 함께 온 경우를 이름 검사만으로는
          # 못 잡는다. 여러 개면 무엇을 올릴지 사람이 다시 판단해야 하므로 여기서 멈춘다.
          n=$(find dist-release -type f | wc -l | tr -d '[:space:]')
          if [ "$n" -ne 1 ]; then
            echo "FAIL — 내려받은 파일이 정확히 1개가 아니다(n=$n). 받은 것:"
            find dist-release
            exit 1
          fi
          got=$(find dist-release -type f)
          if [ "$got" != "$expected" ]; then
            echo "FAIL — 내려받은 파일 이름이 기대와 다르다"
            echo "  expected: $expected"
            echo "  found   : $got"
            exit 1
          fi
          # 프리릴리즈 판정은 태그 하나로 한다(새 설정을 만들지 않는다). semver 상 프리릴리즈 표식은
          # build metadata(+) **앞**의 하이픈이다 → v1.0.0-rc1 은 프리릴리즈, v1.0.0+build5 는 아니다.
          # 이걸 안 하면 gh 가 rc 태그를 정식 릴리즈로 올리고 GitHub 이 그걸 Latest 로 표시한다
          # (기본 다운로드 대상이 되고, 되돌리려면 사람이 UI 에서 손봐야 한다 — 재실행으로는 안 고쳐진다).
          core="${TAG#v}"
          core="${core%%+*}"
          gh_extra=()
          case "$core" in
            *-*) gh_extra+=(--prerelease); echo "prerelease tag ($TAG) -> --prerelease" ;;
            *)   echo "stable tag ($TAG) -> GitHub 이 Latest 로 표시한다" ;;
          esac
          gh release create "$TAG" "$expected" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            "${gh_extra[@]}"
          echo "PASS — released $TAG"
