# Read ADR-0131 (`docs/decisions/0131-*`) before changing this workflow.
name: CI

on:
  push:
    # ★All branches★ — narrowing this leaves those branches with no gate at all, and CI green is the
    # integration check before every merge (`docs/handbook/branch-commit.md`; qa's full regression runs
    # locally — `.claude/skill-bindings/qa.md` 「전체 회귀 = 로컬」). Public repo, so runner cost is 0. # hangul-ok
    # ★This is about the branch axis only★ — on the path axis, `paths` below drops doc paths only. On any
    # branch, a push that changes even one non-doc file runs everything.
    branches:
      - '**'
    # A version tag push = the release trigger (release-build → release-publish, two stages, at the very bottom). On a tag push
    # the 3 verification jobs run too, and that is not wasteful duplication but a gate — release-build
    # hangs on their result via `needs: [backend, gates, frontend]`.
    # A tag can be put on any commit (including a commit that never went through master or one where CI is red),
    # so "this commit was already green on master" cannot be assumed. Putting an `if` on the 3 jobs to skip them on tags
    # would make CI trust that assumption without checking, and artifacts could ship from a commit that was never verified.
    tags:
      - 'v*'
    # ADR-0232: if the changed files are **all** inside the paths excluded below, this workflow is not started. The canonical list
    # is here — do not copy it into other documents.
    # ★It is an exclusion list (denylist)★ — the first line `'**'` puts everything in (the same as the default behavior with no path filter) and the `!` lines
    # take things out, so any unknown path falls to "runs". With an inclusion list, missing one item makes the gate on that path
    # **quietly disappear**; with an exclusion list, missing one only **runs it once more**. The paths that reach CI are scattered and cannot be
    # seen from their names alone (things like `prompts/` · `rust-toolchain.toml` · `vitest.config.ts`).
    # It is `paths` rather than `paths-ignore` because of the reviving line — the docs recommend `paths-ignore` when only excluding, and `paths` with `!` when mixing
    # inclusion and exclusion, and the two cannot sit together on one event (GitHub docs "Workflow
    # syntax" — the `paths`/`paths-ignore` section).
    # ★Order is meaning — a later matching pattern overturns the earlier decision★. So the reviving line sits **at the very end** — adding
    # a `!` line after it takes it back out.
    # ★Before adding an exclusion, first check whether CI · build scripts · code · tests read anything under that path — if a file is read,
    # revive that file at the end★. A push that changes only excluded paths is seen by no gate.
    # ★Do not widen this to `**/*.md`★ — `prompts/engram-help.md` is read by the daemon at run time and served as the help screen,
    # and daemon tests read that file (`crates/engram-dashboard-daemon/src/control/help.rs`); the two files in `prompts/`
    # ship in the release (`scripts/build-release.ps1:50` manifest). Neither can be told apart from docs by extension.
    # Path filters are not evaluated on tag pushes (same section) — the `v*` release trigger above runs regardless of this list.
    # `workflow_dispatch` has no path filter.
    # Accepted exception (same section): if the diff exceeds 3,000 files and no file matching the filter is among the first 3,000, it does not run.
    # ★If this workflow's checks are made required checks in branch protection or a ruleset, PRs from branches that change only docs
    # cannot merge★ — the check of a workflow skipped by a path filter stays "Pending" (GitHub docs "Troubleshooting
    # required status checks" — the skipped but required section). If required checks are ever set, reopen ADR-0232.
    paths:
      - '**'
      - '!docs/**'
      - '!CLAUDE.md'
      - '!README.md'
      - '!.claude/**'
      - '.claude/skill-bindings/qa.md' # read by the frontend job's `npm test` (`src/util/launcherWiring.test.ts:76`)
  pull_request:
    branches:
      - master
    # The same list as `paths` of push above — down to the order (ADR-0232). Changing only one side makes push and PR run on
    # different changes. A PR is decided by the change of the whole PR, not of this push (the three-dot diff from the commit where
    # the topic branch was last synced with base) (GitHub docs "Workflow syntax" — the Git diff comparisons section).
    paths:
      - '**'
      - '!docs/**'
      - '!CLAUDE.md'
      - '!README.md'
      - '!.claude/**'
      - '.claude/skill-bindings/qa.md'
  workflow_dispatch:

# When a new push on the same ref starts a run, the earlier run is cancelled (so we do not decide on a stale result).
# ★Except tag runs★ — this workflow now has a job (release-publish) with irreversible external side effects (creating a release + uploading assets).
# Cancelling mid-run kills the job, so it leaves a "release created but assets missing or truncated"
# state, and a retry dies with 'release already exists' (no automatic recovery).
# Job-level concurrency cannot prevent this — a workflow-level cancel kills **the whole run**, and the jobs in it
# die with it whatever their group is. So whether to cancel at all is split here by ref kind.
# The branch and PR behavior of the 3 verification jobs is the same as before (true) — that they run on tags at all is new with this change, so
# no existing behavior changes through this exception.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ !startsWith(github.ref, 'refs/tags/') }}

# The workflow default is read-only. Job-level permissions **replace** the top level rather than inherit it, so
# the value declared per job is all that job has. Current declarations:
#   backend · gates · frontend  — no declaration → the top level as is, contents: read
#   release-build               — **explicitly** declares contents: read (so it is visibly read-only)
#   release-publish             — contents: write ★the only job in the whole workflow that holds a write token★
# Widening this default to write gives the 3 verification jobs and release-build a write token too — do not widen it.
# Each job's checkout uses persist-credentials: false so the token is not left in the working copy
# — because the code under verification runs on the same runner.
permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_BACKTRACE: 1
  # cargo-about, called by the third-party notice generator (scripts/gen-third-party-licenses.mjs) — the gates and release-build jobs install it with the same
  # pin (kept here so the value is not written twice). SHA-256 = the value of the x86_64-pc-windows-msvc.tar.gz asset of the GitHub release, and
  # equals the .sha256 file of the same release (checked 2026-10-15). When raising the version, raise the generator's CARGO_ABOUT_VERSION too — if they diverge,
  # the generator fails on its version assertion. The names avoid the `CARGO_` prefix because that is cargo's configuration environment variable namespace.
  PIN_CARGO_ABOUT_VERSION: '0.9.2'
  PIN_CARGO_ABOUT_SHA256: '1c03e5890238562497c2d89a3b75b02560af349c1fc3e713d3284f532a5cd748'

jobs:
  # ── Backend regression ──────────────────────────────────────────────────────────────
  # Why windows-latest alone: the Job Object code is `#[cfg(windows)]` and the PTY fixtures are cmd.exe/
  # powershell.exe, so Linux has never been verified in this workspace.
  backend:
    name: backend (cargo test + build)
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve and assert pinned toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          # The expected value is read from rust-toolchain.toml rather than written into the YAML — writing it in two places lets them diverge.
          # Without the assertion, if that file is deleted or RUSTUP_TOOLCHAIN cuts in, it would quietly
          # settle on the runner's default stable and stay green.
          expected=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)
          if [ -z "$expected" ]; then echo "FAIL — could not read channel from rust-toolchain.toml"; exit 1; fi
          actual=$(rustc --version | awk '{print $2}')
          if [ "$actual" != "$expected" ]; then
            echo "FAIL — pinned '$expected' but active rustc is '$actual'"
            exit 1
          fi
          echo "PASS — toolchain $actual matches rust-toolchain.toml"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: backend

      # `--locked` goes on everything below: when the committed Cargo.lock is stale, it fails instead of quietly re-resolving.
      #
      # ★2026-08-24: `--exclude engram-dashboard` was removed — the shell package is in this regression too★
      # Both reasons that held up the exclusion are dead. Old ① (its lib test target died instantly with 0xc0000139/ENTRYPOINT_NOT_FOUND)
      #   was resolved by ADR-0174's three legs (`[lib] test = false` + `[[test]] lib_unit` + build.rs's
      #   `rustc-link-arg-tests`), and old ② (the 32 known failures of that unit suite — daemon_client's
      #   app:None short-circuit) were all fixed. Leaving an exclusion whose reason is dead makes this line **quietly skip a member
      #   in the name of a workspace regression** — even if a new test target appears in `src-tauri/`, it runs nowhere until someone adds a
      #   step below by hand (that really happened to `daemon_client_pending`·`daemon_client_replay`). That silence is the
      #   kind that hid this package's 217 tests for months.
      #
      # ★The test set overlaps with the five steps below — a duplication kept on purpose★ The axes they catch differ:
      #   this line  : uses cargo's **default target selection**. So if leg ① (`[lib] test = false`) is deleted,
      #            the dying built-in lib test target comes back into the default selection and dies **here** with 0xC0000139.
      #            `--test lib_unit` below never selects that target, so it stays green even when ① is gone.
      #   lines below: with `--test <name>`, **cargo fails if the target is absent**. So if leg ②
      #            (`[[test]] lib_unit`) is deleted, the step below dies with "no test target named `lib_unit`".
      #            This line cannot catch that — a vanished target is not a failure but **silence** (green with the whole suite
      #            evaporated). Leg ③ (the link argument) is caught by both.
      #   ★Failure name★: the lines below point, by step name, at which suite it is. But this line runs **first**, so
      #            when the shell package breaks it turns red here first and the steps below do not run — then which target it is
      #            is read not from the step name but from the test binary name in cargo's output. The benefit of the step name pointing
      #            at it shrank by that much, and it still remains as is for all the other members.
      #   Duplication cost: the shell package tests run twice in this job. They are all in-memory harnesses and sockets (zero child
      #            processes), so seconds, and the compile artifacts share the same job's target/.
      #   ★Because of the default selection, one thing gets newly linked — the unit test harness of `[[bin]]`★
      #            (`src/main.rs`, with 0 `#[cfg(test)]`, so 0 tests run). None of the five steps below
      #            builds this, so this line builds it first. **Being kind=bin, it is taken to receive embed-resource's
      #            `rustc-link-arg-bins` and get the manifest attached — i.e. outside the 0xC0000139 axis.**
      #            ★But this is an inference from cargo's rules for applying link arguments, not a measurement of this combination★
      #            (what was measured is the opposite fact that the lib built-in target does not receive `-tests` — ADR-0174).
      #            If 0xC0000139 shows up here, that inference was wrong, so turn it off with `[[bin]] test = false`.
      #
      # ★The 6 --skip below = exclusions limited to the CI lane (the axis that depends on the real claude binary)★
      # These 6 launch **the real claude** as the recipient and observe turn signals and relaying. The runner has no claude.
      # There is a spawn-failure guard (`spawn_json_agent` → `require_claude`), but it cannot stop this on the runner:
      # that guard only checks ① the spawn call succeeded ② it appears in the list within 5 seconds, and even when claude is absent the process
      # starts at first, is briefly caught in the list and soon dies → after passing the guard, the assertion breaks in the "asleep" state.
      # Which one blows up depends on runner timing (run 31168638281 = c2_live,
      # 31169137744 = mcp_send_message — different failures on the same code). So they are excluded per axis, not individually.
      # ★The CI coverage of this axis is 0, and that was accepted★ — it is verified only locally (where claude exists). So
      # locally an observation failure is a failure, not a pass (user decision 2026-10-02 · T-46) — except c1, which is `#[ignore]`.
      # The guard above does not catch claude's absence (the spawn succeeds); the later assertion fails.
      - name: cargo test --workspace
        shell: bash
        run: |
          cargo test --locked --workspace -- \
            --skip c1_park_then_spawn_auto_delivers \
            --skip c2_live_mid_turn_send_parks_and_delivers_after_turn_end \
            --skip control_send_delivery_observation_records_bytes_and_correlated_ids \
            --skip control_send_relays_wrapped_line_to_json_agent \
            --skip control_send_revoked_sender_still_delivers_observation \
            --skip mcp_send_message_tool_happy_and_error

      # The five steps below = pick the shell package's (`engram-dashboard`) test targets **one by one** —
      #   4 integration targets (`src-tauri/tests/`) + 1 unit suite (`lib_unit` = `[[test]] path = "src/lib.rs"`).
      #   ★No step for `src-tauri/tests/stop_smoke.rs`★ — its tests are all `#[ignore]`, so there is nothing to
      #   run here, and the workspace regression above covers compiling it (running it is the local real-daemon lane — qa binding 「로컬 레인」). # hangul-ok
      # ★2026-08-24: these are no longer the only run path of these suites★ — the workspace regression above runs this package
      #   too (exclusion lifted · the canonical reason for keeping the overlap = that step's comment). These five lines still earn their place
      #   in two ways: ① the step name points at **which suite** a failure came from (「gate names in failure reports」).
      #   ② `--test lib_unit` makes **an absent target a failure** — an axis the line above structurally cannot catch.
      # The integration targets (`src-tauri/tests/`) consume engram_dashboard_lib as an rlib and start up normally
      #   (measured 2026-08-17 — the Wry chain drops out of the link. ADR-0174 「Rationale」).
      # ★`cargo build --locked` at the very bottom does not replace this★ — build does not compile test targets
      #   (compile coverage itself now also comes from the workspace regression above — still, the ①② these lines
      #   carry are not there).
      # ★Do not change `--test <name>` to `--lib` or `--all-targets`★ — those two **still die instantly**.
      #   `[lib] test = false` removes it only from the **default selection**, so naming it explicitly selects the built-in lib
      #   test target that cannot receive the manifest, and it dies with 0xC0000139 (ADR-0174 「Impact/Invariants」 · measured 2026-08-24).
      # ★Do not widen to `-p` alone or `--tests` either★ — these do not die instantly (both follow the default selection and do not pick
      #   that built-in target). The one reason not to widen is ① above: if the five targets are lumped into one step, which target
      #   broke gets mixed up in the decision. (The old reason "it drags in `lib_unit`'s known failures wholesale" died when those failures
      #   were all fixed — only the conclusion was kept and the reason swapped.)
      # No `-- --test-threads=4` — CI never uses that flag (the local/CI command-line split is intentional:
      #   qa binding 「전체 회귀 = 로컬」), and this suite only uses in-memory fake ports, so it spawns no # hangul-ok
      #   child process anyway.
      # It sits in the verification lane (ADR-0131 decision 2) — not a release job. release-build runs only on tags and
      #   hangs on this job via `needs: [backend, …]`, so placing it here also makes it stand as a gate before shipping.
      - name: cargo test -p engram-dashboard --test layout_apply
        shell: bash
        run: cargo test --locked -p engram-dashboard --test layout_apply

      # Another **integration** target of the same package (`src-tauri/tests/layout_commands.rs`) — the canonical reason for a separate
      # step is the layout_apply block above (the step name points at the failed suite · target selection is per
      # target). layout_apply measures the apply service itself; this one measures the window · tab · slot
      # command declarations (`layout::commands`) + the inbound receiver (the layer that routes daemon commands to the apply service).
      # No `-- --test-threads=4` — again only in-memory fake ports, so no child processes.
      - name: cargo test -p engram-dashboard --test layout_commands
        shell: bash
        run: cargo test --locked -p engram-dashboard --test layout_commands

      # The third **integration** target of the same package (`src-tauri/tests/daemon_client_pending.rs`) — the canonical reason for a separate
      # step is the layout_apply block above (the step name points at the failed suite).
      # What it measures is the daemon client's pending-slot succession: even when a request_id chosen by an outside
      # caller collides, the connection task does not die and the old waiter wakes with an error
      # (the old `debug_assert!(false)` regression = a permanent shell↔daemon disconnect).
      # No `-- --test-threads=4` — there is not a single socket or child process.
      - name: cargo test -p engram-dashboard --test daemon_client_pending
        shell: bash
        run: cargo test --locked -p engram-dashboard --test daemon_client_pending

      # The fourth **integration** target of the same package (`src-tauri/tests/daemon_client_replay.rs`) — the canonical reason for a separate
      # step is the layout_apply block above (the step name points at the failed suite).
      # What it measures is the refusal wiring of replay single-flight:
      # when the daemon refuses a Subscribe, the slot is released and the merged next generation's Subscribe is actually made
      # (if it is not released, that agent's output is cut off permanently in every window — measured 2026-08-19).
      # No `-- --test-threads=4` — there is not a single socket or child process.
      - name: cargo test -p engram-dashboard --test daemon_client_replay
        shell: bash
        run: cargo test --locked -p engram-dashboard --test daemon_client_replay

      # The fifth target of the same package — unlike the four above, not integration but a **unit** suite
      # (`[[test]] name = "lib_unit"`, `path = "src/lib.rs"` → all `#[cfg(test)]` in `src/**`).
      # ★2026-08-24: the name filter (`-- export_bindings_`) was removed — the whole suite runs★
      #   The reason for the filter (32 known failures in the rest — a pre-existing harness rot, daemon_client's app:None short-circuit.
      #   Not a product defect) died when those 32 were all fixed. **Decision = PASS only with 0 failures.**
      #   ★Do not hard-code an expected count here★ — it goes stale every time a test is added (the "217 tests" · "8 tests" that sat here
      #   really went stale that way). All the decision needs is 0 failures.
      #
      # ★What this step guards is not just running tests — of the three legs that make that suite stand, ②
      #   is caught only here in the whole workflow★
      #   This package's built-in lib unit test target could not receive the manifest resource and died instantly at the loader stage with 0xC0000139
      #   (ENTRYPOINT_NOT_FOUND). The reason it runs now is that three stand together:
      #     ① `[lib] test = false` in `src-tauri/Cargo.toml`
      #     ② `[[test]] name = "lib_unit"` in `src-tauri/Cargo.toml` (only kind=test gets `-tests`)
      #     ③ `cargo:rustc-link-arg-tests=<the resource .lib in OUT_DIR>` in `src-tauri/build.rs`
      #   If even one is missing it collapses **quietly**. Who catches what differs:
      #     ② absent → this step fails with "no test target named `lib_unit`". ★The workspace regression above
      #        cannot catch this★ — there the whole suite evaporates and it stays green (silence ≠ failure).
      #     ① absent → the dying built-in target comes back into the **default selection** and the workspace regression above dies with
      #        0xC0000139. Conversely this step never selects that target, so it stays green.
      #     ③ absent → the test exe dies before it even starts (both turn red).
      #   The 4 integration targets above cannot see this axis — they were receiving the `-tests` argument from the start, so
      #   they stay green even when ②③ disappear.
      #
      # This suite re-bakes `src-tauri/bindings/*.ts` (the `export_bindings_*` that the ts-rs derive makes for each `#[ts(export)]` type
      #   live in it) — so this step must come **before** 'Gate: ts-rs bindings …'
      #   below. Binding **comparison** is not done here: that one gate gathers the three
      #   directories and checks them (the same shape as agent — a separate regeneration step, one diff gate).
      # No `-- --test-threads=4` — this suite is only in-memory harnesses and sockets, so no child processes.
      - name: cargo test -p engram-dashboard --test lib_unit
        shell: bash
        run: cargo test --locked -p engram-dashboard --test lib_unit

      # The crate-alone steps below overlap with the workspace regression in their test set, but what they verify differs —
      # they guard the isolated-harness claim (ADR-0012) that "this crate stands with its own feature set too".
      # The feature union is per single cargo invocation, so `--workspace` cannot see this axis.

      # ADR-0175 decision 1: the bottom crate (`base` — generic helpers · logging, ADR-0269). Zero workspace crate dependencies is its reason
      # for being, so this crate is also checked on the same stand-alone axis as above.
      # No `-- --test-threads=4` — this crate has no test that spawns a child process (the PID helper test that spawned a real `cmd.exe`
      #   moved out to `platform` below along with the helper — ADR-0266). The local command does not add it either.
      - name: cargo test -p engram-dashboard-base
        shell: bash
        run: cargo test --locked -p engram-dashboard-base

      # ADR-0266: the OS layer crate (`platform`). Zero workspace crate dependencies (not even base) is its invariant, so this crate is also
      #   checked on the same stand-alone axis as above — the canonical invariants · gates are that crate's lib.rs header.
      # No `-- --test-threads=4` — the `process` tests (`child_pids_finds_spawned_child` etc.) do spawn a real
      #   `cmd.exe`, but CI never uses that flag (qa binding 「전체 회귀 = 로컬」 — the condition the flag # hangul-ok
      #   targets does not exist on the runner). The local command does add it.
      - name: cargo test -p engram-dashboard-platform
        shell: bash
        run: cargo test --locked -p engram-dashboard-platform

      - name: cargo test -p engram-dashboard-agent
        shell: bash
        run: cargo test --locked -p engram-dashboard-agent

      # The control-plane CLI (`engram-dashboard-cli` — a bin-only package that produces engram.exe). This step guards two things:
      #   ① does it stand when built separately with `-p`, with no feature union with the daemon — it is a separate package so it does not drag in the daemon graph (ADR-0273).
      #   ② if the `engram_cli` target holding the shipped file name guard (`the_built_binary_file_name_matches_the_shared_constant` · ADR-0094)
      #      vanishes, `--test engram_cli` dies with 「no test target」. In the workspace regression above a vanished
      #      target is not a failure but silence (the same value as the shell's `--test lib_unit` step).
      # No `-- --test-threads=4` — CI never uses that flag (qa binding 「전체 회귀 = 로컬」). The local # hangul-ok
      #   command does add it (`engram_cli` spawns the real engram.exe).
      # ADR-0285
      - name: cargo test -p engram-dashboard-cli --bins --test engram_cli
        shell: bash
        run: cargo test --locked -p engram-dashboard-cli --bins --test engram_cli

      # ADR-0134: the command bus tool crate (new) — zero workspace crate dependencies is its reason for being, so this crate is also
      # checked on the same stand-alone axis as above (TRD S20 §6 Step 1).
      - name: cargo test -p engram-dashboard-command
        shell: bash
        run: cargo test --locked -p engram-dashboard-command

      - name: cargo test -p engram-dashboard-protocol
        shell: bash
        run: cargo test --locked -p engram-dashboard-protocol

      # The step above only **regenerates** the bindings — ts_export.rs has not a single assertion, so by itself
      # a divergence between the wire contract and the committed .ts passes green. The real consumer is the frontend job's tsc, and
      # that looks at the **committed** .ts on another runner. If the regenerated result differs from the committed one, it is caught here.
      # ★It does not blow up on line-ending noise★: the index blob is LF and git normalizes the working copy the same way before comparing,
      #   so a CRLF difference alone produces no diff (measured on Windows with autocrlf=true: regenerate, then
      #   `git diff --exit-code` → 0). The noise shows in `git status`, not in `git diff`.
      # agent/bindings/ is in the same gate too (ADR-0134): the `cargo test -p engram-dashboard-agent` above
      #   regenerates the .ts and commands.schema.json from the `agent.*` declarations, so changing a declaration without pushing the generated files
      #   gets caught here. **The generation points are scattered per crate, so this path list grows along with them.**
      # ★`git diff` does not look at untracked files★: a .ts generated for the first time has never been committed, so there is
      #   nothing to compare against, and it then passes green with no match (the `SlotContent.ts` incident —
      #   `docs/process/S20-command-bus/trd.md` §5). Registering the two binding
      #   directories in the index **without content** with `git add -N` (intent-to-add) makes the next `git diff` see new files as "a diff
      #   adding the whole file" and catch them. It only registers empty blobs and is not real staging, so it does not affect
      #   later commit contents.
      # The third generated directory `src-tauri/bindings/` is also in this gate since 2026-08-24 —
      #   it is the item that "the generation points are scattered per crate, so this path list grows along with them" above pointed at.
      #   The `export_bindings_*` that bake it live in the shell package's **unit** suite target (`lib_unit`), and
      #   are baked **twice** in this job — the workspace regression (that package's exclusion was lifted) and the `--test lib_unit`
      #   step. ★This gate does not regenerate, it only compares★ — so there is just one requirement: the baking steps
      #   come **before** this gate (both do now).
      # ★Do not drop this directory from the list★ — until it was added it drifted here with no comparison, and the change that added it
      #   actually regenerated a drift.
      # ★Do not drop `-f`★: `git add` quietly skips ignored paths, so if a broad line like `*.ts` or `bindings/` appears in some crate's
      #   `.gitignore`, that generated output does not get into the index, the diff comes out clean, and
      #   **the gate is silently disabled** (right now none of the three directories is ignored — measured 2026-08-24).
      - name: 'Gate: ts-rs bindings are in sync with the wire contract'
        shell: bash
        run: |
          git add -N -f -- crates/engram-dashboard-protocol/bindings/ crates/engram-dashboard-agent/bindings/ src-tauri/bindings/
          if ! git diff --exit-code -- crates/engram-dashboard-protocol/bindings/ crates/engram-dashboard-agent/bindings/ src-tauri/bindings/; then
            echo "FAIL — the regenerated bindings differ from the committed ones (declaration ↔ generated drift, including new uncommitted files). Commit the diff above."
            exit 1
          fi
          echo "PASS — bindings in sync"

      - name: cargo test -p engram-dashboard-messaging
        shell: bash
        run: cargo test --locked -p engram-dashboard-messaging

      # ADR-0177: the reusable transport lib (`transport` — new). Zero workspace crate dependencies is its reason for being, so
      #   it is checked on the same stand-alone axis as the crates above — the canonical expected values are gate ④ of that crate's lib.rs header
      #   「Isolation gates」, and the four steps below (4a·4b·4d·4e) only call it. 4c calls gate ⑤ of the same header
      #   (is the real-socket suite non-empty).
      # ★Do not replace `--all-features` with a hand-written feature list★ — `--all-features` also compiles the `ws` and `iroh`
      #   adapters' optional third parties and the real-socket tests. That is the intent.
      # No `-- --test-threads=4` — CI never uses that flag (qa binding 「전체 회귀 = 로컬」 — the # hangul-ok
      #   security-software condition it targets does not exist on the runner, and lowering it only slows
      #   CI). The local command does not add it for this crate either — it spawns no child process.
      - name: 'transport gate 4a: cargo test -p engram-dashboard-transport (features off)'
        shell: bash
        run: cargo test --locked -p engram-dashboard-transport

      - name: 'transport gate 4b: cargo test -p engram-dashboard-transport --all-features'
        shell: bash
        run: cargo test --locked -p engram-dashboard-transport --all-features

      # ★4a/4b above only check 「did the command succeed」 — even if the suite is completely empty it stays green★. The five
      #   real-socket files in `tests/` each live behind a file-level cfg (`ws_*`: `all(feature = "ws", feature = "test-support")`;
      #   `iroh_link`: `all(feature = "iroh", feature = "test-support")`), so when that condition turns false (feature name typo ·
      #   rename · folding into another feature), the binaries **compile with 0 tests and pass.** So this step does not trust the exit code; **CI itself states the names and the
      #   minimum count of what it expects** (precedent = the incident where the ts-rs binding gate was vacuous,
      #   ADR-0131 「Rationale — what the adversarial review found」 1). The canonical expected values = gate ⑤ of that crate's lib.rs header.
      # With `-- --list` the harness only prints its own list and runs nothing — one line ending in `: test` is
      #   one test (`: bench` is a bench, not counted). The `\s*` at the end of the pattern guards against a CR at line end.
      # ★The expected value is 「1 or more」 and the actual count is not raised★ — if it turned red every time tests were added or merged,
      #   the count would have two canonical sources. The failure this gate targets is **0**.
      # ★What it catches / does not catch★ — catches: a lost target (`--test <name>` dies with a nonzero exit code) · file-
      #   level cfg false (0 lines in the list) · file deletion. Does not catch: **what** the remaining tests measure (an empty-bodied
      #   `#[tokio::test]` counts as 1 too) · `#[ignore]` on individual tests (they still appear in the list) · a `#[cfg]` on individual tests
      #   **inside** a suite.
      - name: 'transport gate 4c: socket suites are not hollowed out (named targets + non-empty)'
        shell: bash
        run: |
          for t in ws_dial ws_reject ws_write_deadline ws_accept iroh_link; do
            set +e
            out=$(cargo test --locked -p engram-dashboard-transport --all-features --test "$t" -- --list)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then
              echo "FAIL — cargo test --test $t exited $rc (did the target vanish or get renamed?)"
              printf '%s\n' "$out"
              exit 1
            fi
            set +e
            n=$(printf '%s\n' "$out" | grep -cE ': test[[:space:]]*$')
            rgrc=$?
            set -e
            if [ "$rgrc" -gt 1 ]; then echo "FAIL — grep errored (exit $rgrc)"; exit 1; fi
            if [ "$rgrc" -eq 1 ]; then n=0; fi
            echo "$t: $n test(s) listed"
            if [ "$n" -lt 1 ]; then
              echo "FAIL — $t compiled with 0 tests — its file-level cfg (adapter feature + test-support) is false"
              printf '%s\n' "$out"
              exit 1
            fi
          done
          echo "PASS — the five real-socket suites each listed 1 or more tests"

      # The canonical expected values and rationale = the third line of gate ④ in 「Isolation gates」 of that crate's lib.rs header.
      - name: 'transport gate 4d: cargo check -p engram-dashboard-transport --features ws (consumer combo)'
        shell: bash
        run: cargo check --locked -p engram-dashboard-transport --features ws

      # The canonical expected values and rationale = the fourth line of gate ④ in 「Isolation gates」 of that crate's lib.rs header.
      - name: 'transport gate 4e: cargo check -p engram-dashboard-transport --features iroh (iroh adapter alone)'
        shell: bash
        run: cargo check --locked -p engram-dashboard-transport --features iroh

      # TRD S26-window-chrome §8-4 (user decision Q1 2026-10-24): the snap layout overlay is code kept behind the cargo feature `snap-overlay`,
      #   off by default (the shell feature turns on platform's feature of the same name). No production build turns it on, so without this step nobody
      #   compiles it and it rots — the feature-on build is compiled here. Shell = `cargo check` (lib · bin — the invoke adapter · registration · window facts field).
      #   platform = besides compiling, runs the overlay's real-window tests (`window::snap` — an off-screen hidden window · behind the feature, so the platform step above does not run them).
      #   If the name filter matches 0 (the tests drop out because a module or feature name changed), the exit code is 0, so 「1 or more ok」 is counted directly
      #   (the same reason as transport gate 4c). The feature-on build's on-screen behavior (scaling · per window · focus) is measured on the day it is turned on (TRD §14 W8).
      - name: 'snap-overlay gate 1: the feature-on build compiles (shell) and its overlay tests pass (platform)'
        shell: bash
        run: |
          cargo check --locked -p engram-dashboard --features snap-overlay
          set +e
          out=$(cargo test --locked -p engram-dashboard-platform --features snap-overlay -- window::snap 2>&1)
          rc=$?
          set -e
          printf '%s\n' "$out"
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo test (snap-overlay) exited $rc"; exit 1; fi
          set +e
          n=$(printf '%s\n' "$out" | grep -cE '^test window::snap::[A-Za-z0-9_:]+ \.\.\. ok[[:space:]]*$')
          set -e
          echo "window::snap: $n test(s) ok"
          if [ "$n" -lt 1 ]; then echo "FAIL — not a single window::snap test ran (did a module or feature name change?)"; exit 1; fi
          echo "PASS"

      # Full workspace build (src-tauri, which the regression command excluded, is compiled here too).
      - name: cargo build
        shell: bash
        run: cargo build --locked

  # ── Format + isolation gates ───────────────────────────────────────────────────────
  # No compiling, so it finishes fast in parallel with the backend job (the cargo tree gates only resolve dependencies).
  gates:
    name: fmt + isolation gates
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - name: Resolve and assert pinned toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          cargo fmt --version
          expected=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)
          if [ -z "$expected" ]; then echo "FAIL — could not read channel from rust-toolchain.toml"; exit 1; fi
          actual=$(rustc --version | awk '{print $2}')
          if [ "$actual" != "$expected" ]; then
            echo "FAIL — pinned '$expected' but active rustc is '$actual'"
            exit 1
          fi
          echo "PASS — toolchain $actual matches rust-toolchain.toml"

      - uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          key: gates

      # Whether the windows-latest runner has ripgrep is not guaranteed by the image docs → pin the version and install it directly.
      # The gate decisions depend on regex behavior, so they run with the same rg whatever the runner image carries.
      # GITHUB_PATH is prepended to the existing PATH, so this one wins even if the runner already has rg.
      - name: Install ripgrep (pinned 14.1.1, checksum-verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = '14.1.1'
          # The official .sha256 value distributed with the release. Catches corruption in transit and after-the-fact asset replacement.
          # (Since it comes from the same release, it cannot protect against the release itself being compromised — that is a separate problem.)
          $sha = 'd0f534024c42afd6cb4d38907c25cd2b249b79bbe6cc1dbee8e3e37c2b6e25a1'
          $url = "https://github.com/BurntSushi/ripgrep/releases/download/$ver/ripgrep-$ver-x86_64-pc-windows-msvc.zip"
          $zip = "$env:RUNNER_TEMP\rg.zip"
          Invoke-WebRequest -Uri $url -OutFile $zip
          $actual = (Get-FileHash -Algorithm SHA256 -Path $zip).Hash.ToLower()
          if ($actual -ne $sha) { throw "ripgrep archive checksum mismatch: expected $sha, got $actual" }
          Expand-Archive -Path $zip -DestinationPath "$env:RUNNER_TEMP\rg" -Force
          $exe = Get-ChildItem "$env:RUNNER_TEMP\rg" -Recurse -Filter rg.exe | Select-Object -First 1
          if (-not $exe) { throw "rg.exe not found in the extracted archive" }
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8
          # The expected value for the verification step below — passed from here so the version string is not written twice in the YAML.
          "RG_EXPECTED_VERSION=$ver" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # Why the version is checked too: if the install above failed and the runner image happens to have another rg, a plain
      # `rg --version` would pass, and we could not catch the gate running with an unpinned rg.
      # Why an exact match: with a partial match, a higher version like 14.1.10 passes as 14.1.1.
      - name: Verify ripgrep is the pinned build
        shell: bash
        run: |
          rg --version
          actual=$(rg --version | head -1 | awk '{print $2}')
          if [ "$actual" != "$RG_EXPECTED_VERSION" ]; then
            echo "FAIL — expected ripgrep $RG_EXPECTED_VERSION, got '$actual'"
            exit 1
          fi
          echo "PASS — ripgrep $actual"

      # cargo fmt does not resolve dependencies, so no --locked (a flag cargo-fmt does not accept).
      - name: cargo fmt --check
        shell: bash
        run: cargo fmt --check

      # Hangul stays out of code and config (ADR-0383) — rules and allowlist live in scripts/check-hangul.mjs.
      - name: Hangul check
        shell: bash
        run: node scripts/check-hangul.mjs

      # ★The common trap of all grep gates below — the exit code is inverted★
      # rg ends with "0 if it finds a match, 1 if not, 2 or more on error". But the passing condition of these gates
      # is **0 matches**. So using rg's exit code as the step's success directly inverts the decision exactly.
      # And letting it through with `|| true` or `if rg …; then` puts rc=2 (path typo · rg absent etc.) into the same
      # branch as "no match", and the gate quietly always passes. So the three branches (0 / 1 / 2+) are split explicitly.
      # Why `set +e` is needed: Actions' bash runs with `set -e`, and `hits=$(rg …)` inherits rg's exit code
      # as is, so on the **normal pass** path with no match, the step dies first.

      # The old gate name was 'Gate: core isolation — no `use tauri` in core' (before the crate rename ADR-0175).
      #   It is ADR-0003's core isolation invariant as is; only the target crate name changed from `core` → `agent`.
      - name: 'Gate: agent crate isolation — no `use tauri` in the agent crate'
        shell: bash
        run: |
          set +e
          hits=$(rg "^\s*use tauri" crates/engram-dashboard-agent/src/)
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # ADR-0134: if a new crate name (`command`) is not in the alternation, messaging using the tool crate goes uncaught.
      #   ADR-0175's `base` · ADR-0266's `platform` · ADR-0177's `transport` are put in the alternation for the same reason.
      #   ★Every time a new workspace crate appears, add its name here, and remove deleted crates★ (the hand-written
      #   alternation is this regex's biggest hole, and the ceiling gate below covers that hole).
      #   But a bin-only member with no lib target (`engram-dashboard-cli`) is not added — it is not a crate that can be called (ADR-0285). The day such a member gets a lib, add its name here.
      - name: 'Gate: messaging kernel isolation — no workspace crate refs'
        shell: bash
        run: |
          set +e
          hits=$(rg "engram_dashboard_(agent|base|daemon|protocol|command|platform|transport)" crates/engram-dashboard-messaging/src/)
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # The gate above only looks at symbol paths in source — we tried to close this hole with a regex over manifest text, but
      # (previous version: `rg 'package\s*=\s*"engram-dashboard-' Cargo.toml`) cross review found two more holes of the same
      # kind. **A manifest is text in the end too, so there always remain valid TOML syntaxes a regex cannot see**
      # — so instead of rewriting the manifest regex, we move to a different instrument:
      # reading the **resolved dependency graph** (`cargo tree`) instead of text makes the syntactic forms below meaningless.
      #   ① quoting — a TOML literal string with single quotes is valid too: `package = 'engram-dashboard-command'`.
      #      The regex only looked at double quotes, so it slipped through as is.
      #   ② build-dependencies — a workspace crate used only by `build.rs` goes in the `[build-dependencies]` table
      #      and, even without a rename, slips past both the manifest regex (without a rename the `package =` key itself never appears) and
      #      the source regex above (its scan scope is only `src/`, so it does not look at the crate root's `build.rs`)
      #      at once.
      # Do not cut down `-e normal,dev,build --target all --all-features` — cutting it lets that much
      # (rename · inactive target · optional) of the forms leak. The existing source regex gate stays
      # as is — this is additive.
      - name: 'Gate: messaging kernel isolation — direct workspace deps ceiling (exactly 1 = self)'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-messaging --depth 1 --prefix none -e normal,dev,build --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          out=$(printf '%s\n' "$tree" | rg "^engram-dashboard" | sort -u)
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$out" ]; then n=0; else n=$(printf '%s\n' "$out" | wc -l | tr -d '[:space:]'); fi
          echo "found $n direct workspace dep(s):"
          printf '%s\n' "$out"
          if [ "$n" -ne 1 ]; then echo "FAIL — expected exactly 1 (itself) — a workspace crate dependency was brought in"; exit 1; fi
          echo "PASS"

      # ADR-0134: the very reason the tool crate (`command`) exists is "zero workspace crate dependencies"
      # (invariant 1 of the `crates/engram-dashboard-command/src/lib.rs` header). The gate that header wrote down
      # (`rg "path\s*=" Cargo.toml`) carries from the start the same holes (quoting · build-dependencies) as the manifest regex the messaging gate above
      # just discarded, so instead of setting it up as a text regex and replacing it again later, it looks at the resolved graph from the start. The same
      # instrument as the messaging ceiling gate above — for the detailed reason see that gate's
      # comment.
      - name: 'Gate: command tool crate — direct workspace deps ceiling (exactly 1 = self)'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-command --depth 1 --prefix none -e normal,dev,build --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          out=$(printf '%s\n' "$tree" | rg "^engram-dashboard" | sort -u)
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$out" ]; then n=0; else n=$(printf '%s\n' "$out" | wc -l | tr -d '[:space:]'); fi
          echo "found $n direct workspace dep(s):"
          printf '%s\n' "$out"
          if [ "$n" -ne 1 ]; then echo "FAIL — expected exactly 1 (itself) — a workspace crate dependency was brought in"; exit 1; fi
          echo "PASS"

      # ADR-0175 decision 1: the bottom crate's (`base`) entry condition ② is "zero domain knowledge", and its concrete form is zero workspace
      # crate dependencies (that crate's lib.rs header is canonical). This is that wall — the compiler does not enforce a leaf.
      # The same form and the same flags as the two gates above (cutting them lets rename · inactive target · optional leak).
      # ★Why there is no separate source regex gate★: `base` not calling others is the invariant, so one ceiling gate
      #   is enough (no need to hand-manage an "alternation of names it calls" as messaging does).
      - name: 'Gate: base leaf crate — direct workspace deps ceiling (exactly 1 = self)'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-base --depth 1 --prefix none -e normal,dev,build --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          out=$(printf '%s\n' "$tree" | rg "^engram-dashboard" | sort -u)
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$out" ]; then n=0; else n=$(printf '%s\n' "$out" | wc -l | tr -d '[:space:]'); fi
          echo "found $n direct workspace dep(s):"
          printf '%s\n' "$out"
          if [ "$n" -ne 1 ]; then echo "FAIL — expected exactly 1 (itself) — a workspace crate dependency was brought in"; exit 1; fi
          echo "PASS"

      # The axis ADR-0003's isolation invariant hangs on is not the crate name but **which binary it links into**.
      #   `base` links into the headless daemon, so the moment it calls Tauri here, that binary with no window and no webview
      #   gets tied to a transport method — exactly the failure ADR-0003 meant to prevent.
      # ★Do not delete this step because "it is a leaf crate, so it is safe"★: being a leaf is a statement about the **workspace crate** axis,
      #   and the ceiling gate right above also counts only workspace members with `rg "^engram-dashboard"`. The third-party `tauri`
      #   passes that gate as is — the two gates are different axes.
      # base's tenants live outside the agent gate's scan scope (`crates/engram-dashboard-agent/src/`) (ADR-0175
      #   decision 1). Without this step no gate looks at those tenants — `logging::init_logging_with_file` is
      #   the typical place where "just firing one event would be handy".
      - name: 'Gate: base crate isolation — no `use tauri` in the base crate'
        shell: bash
        run: |
          set +e
          hits=$(rg "^\s*use tauri" crates/engram-dashboard-base/src/)
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # The wall for entry condition ③ of ADR-0175 decision 1 (tenants must not reference each other). Unlike ①②, this condition
      #   had no machine check — ② is checked by the ceiling gate above, ① by people.
      # ★Why it must hold★: if tenants get tangled with each other they are one lump, and putting one lump at the bottom drags the whole of it
      #   along to every consumer — the point where ADR-0151 「Rejected alternatives」 E's `bevy_core` precedent (re-measured by ADR-0269
      #   「Rejected alternatives」 1) started to fail is exactly here.
      # ★Do not widen it to `crate::` alone★: that is plain Rust, so it becomes noise rather than a gate. The price of hard-coding the module **names**
      #   is that when tenants are added, their names must be added here (the same kind of hole as the messaging regex).
      # ★Do not remove the `\s*` around `::`★: it catches the spaced forms (`super:: sync` · `crate :: time`) — the rationale is in the
      #   `replay_flight` purity gate comment below.
      # ★Known limit★: if `logging` later gets submodules, a self-reference `crate::logging::…` inside them is
      #   a false positive. Then call it by a relative path (`super::`) or re-decide this gate.
      - name: 'Gate: base leaf crate — tenants must not reference each other'
        shell: bash
        run: |
          set +e
          hits=$(rg "(crate|super)\s*::\s*(logging|text|time|path|sync|testing|writable|file|panic)" crates/engram-dashboard-base/src/)
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # ADR-0269 decision 5 · ADR-0275 decision 5: base's test feature `test-support` (opens the `testing` module and the test helpers behind it) is
      #   turned on only in the consuming crate's `[dev-dependencies]`. The workspace uses `resolver = "2"`, so dev-graph
      #   features are not merged into the production build — this step catches someone turning that feature on on the `[dependencies]` side.
      #   It reads the normal · build graphs of the three that produce production binaries (daemon · shell · CLI — the CLI graph has base through agent)
      #   as resolved graphs (not a manifest grep).
      # ★Do not delete the pair check (agent dev graph → 1 or more lines)★: if the feature name changes, the three 0-expectations lose the word
      #   to match and quietly pass — the pair turns that blind pass red (the same rationale as gate ⑤ of the transport lib.rs header).
      # ★Limit★: it only reads the resolved graph, so it cannot see the feature union of a build that builds `--all-targets` in one call
      #   (daemon `Cargo.toml` 「Production build caution」 — the rule is not to build shipped binaries that way).
      - name: 'Gate: base test-support stays out of release graphs (daemon · shell · cli = 0, agent dev >= 1)'
        shell: bash
        run: |
          for pkg in engram-dashboard-daemon engram-dashboard engram-dashboard-cli; do
            set +e
            tree=$(cargo tree --locked -p "$pkg" -e normal,build,features -i engram-dashboard-base --target all)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree -p $pkg exited $rc"; printf '%s\n' "$tree"; exit 1; fi
            set +e
            hits=$(printf '%s\n' "$tree" | rg 'feature "test-support"')
            rgrc=$?
            set -e
            case "$rgrc" in
              1) echo "PASS — $pkg normal graph: 0 matches" ;;
              0) echo "FAIL — base test-support is on in the $pkg production graph:"; printf '%s\n' "$tree"; exit 1 ;;
              *) echo "FAIL — rg errored (exit $rgrc)"; exit 1 ;;
            esac
          done
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-agent -e normal,dev,features -i engram-dashboard-base --target all)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree -p engram-dashboard-agent exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          hits=$(printf '%s\n' "$tree" | rg 'engram-dashboard-base feature "test-support"')
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$hits" ]; then n=0; else n=$(printf '%s\n' "$hits" | wc -l | tr -d '[:space:]'); fi
          echo "agent dev graph: $n match(es)"
          if [ "$n" -lt 1 ]; then echo "FAIL — expected >= 1 — did the feature name change? (then the 0-expectations above pass blind)"; printf '%s\n' "$tree"; exit 1; fi
          echo "PASS"

      # ADR-0272 「Impact」 invariant: protocol's manifest names no workspace crate (TRD S21 trd-3 3-1 U5).
      #   A type another crate owns enters a packet as a protocol copy or a raw JSON slot (ADR-0272 decisions 1-3),
      #   never as a dependency edge.
      # Same form and flags as the messaging · command · base · transport ceiling gates — shortening them lets
      #   renames, inactive targets and optional deps through. No path pre-check, as in transport gate 1: a
      #   renamed or removed package makes `cargo tree -p` exit non-zero and the first branch catches it.
      - name: 'protocol gate 1: direct workspace deps ceiling (exactly 1 = self)'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-protocol --depth 1 --prefix none -e normal,dev,build --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          out=$(printf '%s\n' "$tree" | rg "^engram-dashboard" | sort -u)
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$out" ]; then n=0; else n=$(printf '%s\n' "$out" | wc -l | tr -d '[:space:]'); fi
          echo "found $n direct workspace dep(s):"
          printf '%s\n' "$out"
          if [ "$n" -ne 1 ]; then echo "FAIL — expected exactly 1 (self) — a workspace crate dependency was pulled in"; exit 1; fi
          echo "PASS"

      # ADR-0266 「Impact」: isolation gates ① · ② of the OS layer crate (`platform`). The canonical expected values · rationale · 「do not delete」 are
      #   the 「Isolation gates」 section of the `crates/engram-dashboard-platform/src/lib.rs` header, and this only calls them.
      #   (③, the test feature leak gate, is carried separately by the step below.)
      # ★①② are different axes, so do not merge them into one★ — ① counts only workspace members, so it lets the third-party `tauri`
      #   straight through (that axis is ②).
      # Form · flags are the same as the messaging · command · base · transport ceiling gates. The reason ① has no path pre-check
      #   is also the same as transport gate 1 — if the package vanishes or is renamed, `cargo tree -p` dies with a nonzero
      #   exit code and the first branch catches it.
      - name: 'platform gate 1: direct workspace deps ceiling (exactly 1 = self)'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-platform --depth 1 --prefix none -e normal,dev,build --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          out=$(printf '%s\n' "$tree" | rg "^engram-dashboard" | sort -u)
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$out" ]; then n=0; else n=$(printf '%s\n' "$out" | wc -l | tr -d '[:space:]'); fi
          echo "found $n direct workspace dep(s):"
          printf '%s\n' "$out"
          if [ "$n" -ne 1 ]; then echo "FAIL — expected exactly 1 (itself) — a workspace crate dependency was brought in"; exit 1; fi
          echo "PASS"

      # ★Do not delete `test -d`★ — if the crate is moved or renamed, rg reports 0 matches and 0 = PASS, so the wall
      #   quietly disappears (the rc=2 branch catches the same thing but cannot print the reason — the same as transport gate 2).
      - name: 'platform gate 2: no `use tauri` in the platform crate'
        shell: bash
        run: |
          set +e
          d=crates/engram-dashboard-platform/src
          if [ ! -d "$d" ]; then echo "FAIL — gate target directory is missing: $d (renamed or moved?)"; exit 1; fi
          hits=$(rg "^\s*use tauri" "$d/")
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # TRD 1-3 §3-8 · §4-2 ③ (ADR-0266 「Impact」 · the same axis as the base test feature step (ADR-0275 decision 5)): platform's test feature
      #   `test-support` (`testing` module · `group::GroupRef::gone` · `spawn::wmi_create_raw` — opened to the tests that call the test helpers) is turned on only in the consuming crates' (agent · shell)
      #   `[dev-dependencies]`. The workspace uses `resolver = "2"`, so dev-graph features are not merged into the production
      #   build — this step catches someone turning that feature on on the `[dependencies]` side. It reads the normal · build graphs of the three that
      #   produce production binaries (daemon · shell · CLI — the CLI graph has platform through agent) as resolved
      #   graphs (not a manifest grep). The shell carries platform directly as a production dependency (finding · launching ·
      #   stopping the daemon · the front-window decision of the screen state `window` · the temp file owner liveness decision) and turns that feature on only on the dev line — the daemon also
      #   takes it as a dev-dependency, but `-e` has no `dev`, so dev edges are not counted.
      # ★The form follows the landed base step, not the command of TRD 1-3 §4-2★ — the `build` in `-e` and qualifying the pair by crate
      #   name were added to the base gate from a review finding (5fb25ab — it did not see build dependencies). The stale side is the TRD.
      # ★Do not delete the pair check (agent dev graph → 1 or more lines)★: if the feature name changes, the three 0-expectations lose the word
      #   to match and quietly pass — the pair turns that blind pass red (the same rationale as the base test feature step).
      # ★Limit★: the same as the base test feature step — it only reads the resolved graph, so it cannot see the feature union of a build that
      #   builds `--all-targets` in one call (daemon `Cargo.toml` 「Production build caution」).
      - name: 'platform gate 3: test-support stays out of release graphs (daemon · shell · cli = 0, agent dev >= 1)'
        shell: bash
        run: |
          for pkg in engram-dashboard-daemon engram-dashboard engram-dashboard-cli; do
            set +e
            tree=$(cargo tree --locked -p "$pkg" -e normal,build,features -i engram-dashboard-platform --target all)
            rc=$?
            set -e
            if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree -p $pkg exited $rc"; printf '%s\n' "$tree"; exit 1; fi
            set +e
            hits=$(printf '%s\n' "$tree" | rg 'feature "test-support"')
            rgrc=$?
            set -e
            case "$rgrc" in
              1) echo "PASS — $pkg normal graph: 0 matches" ;;
              0) echo "FAIL — platform test-support is on in the $pkg production graph:"; printf '%s\n' "$tree"; exit 1 ;;
              *) echo "FAIL — rg errored (exit $rgrc)"; exit 1 ;;
            esac
          done
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-agent -e normal,dev,features -i engram-dashboard-platform --target all)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree -p engram-dashboard-agent exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          hits=$(printf '%s\n' "$tree" | rg 'engram-dashboard-platform feature "test-support"')
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$hits" ]; then n=0; else n=$(printf '%s\n' "$hits" | wc -l | tr -d '[:space:]'); fi
          echo "agent dev graph: $n match(es)"
          if [ "$n" -lt 1 ]; then echo "FAIL — expected >= 1 — did the feature name change? (then the 0-expectations above pass blind)"; printf '%s\n' "$tree"; exit 1; fi
          echo "PASS"

      # TRD S26-window-chrome §8-4 (user decision Q1 2026-10-24): the snap layout overlay feature `snap-overlay` is off by default and no production
      #   build turns it on. PASS only if the shell's (`engram-dashboard`) normal · build graph has 0 lines of platform's feature — if someone puts it in the shell's
      #   `[features] default` or writes the feature on the platform dependency line, it turns red. It reads the resolved graph (not a manifest grep).
      # ★The form follows platform gate 3★ — it adds `build` to the TRD's `-e normal,features` and qualifies the pair by crate name (the
      #   same reason as in that step's comment).
      # ★Do not delete the pair (the same command with `--features snap-overlay` → 1 or more lines)★ — if the feature name changes or the shell feature stops
      #   turning on the platform feature, the 0-expectation line loses the word to match and passes blind.
      # ★Limit★ — it looks only at the shell graph (the only way to turn that feature on is the one shell feature — the daemon · CLI do not turn on platform's feature). Being a resolved
      #   graph, it cannot see a build built with `--all-features` — the release build (`scripts/build-release.ps1`) does not build that way.
      - name: 'snap-overlay gate 2: the feature stays out of the shell release graph (shell = 0, shell --features snap-overlay >= 1)'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard -e normal,build,features -i engram-dashboard-platform --target all)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree -p engram-dashboard exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          hits=$(printf '%s\n' "$tree" | rg 'feature "snap-overlay"')
          rgrc=$?
          set -e
          case "$rgrc" in
            1) echo "PASS — shell normal graph: 0 matches" ;;
            0) echo "FAIL — snap-overlay is on in the shell production graph:"; printf '%s\n' "$tree"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rgrc)"; exit 1 ;;
          esac
          set +e
          tree=$(cargo tree --locked -p engram-dashboard -e normal,build,features -i engram-dashboard-platform --target all --features snap-overlay)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree -p engram-dashboard --features snap-overlay exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          hits=$(printf '%s\n' "$tree" | rg 'engram-dashboard-platform feature "snap-overlay"')
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$hits" ]; then n=0; else n=$(printf '%s\n' "$hits" | wc -l | tr -d '[:space:]'); fi
          echo "shell --features snap-overlay graph: $n match(es)"
          if [ "$n" -lt 1 ]; then echo "FAIL — expected >= 1 — did the feature name change? (then the 0-expectation line above passes blind)"; printf '%s\n' "$tree"; exit 1; fi
          echo "PASS"

      # The machine wall (TRD 2-1 D6) for the ADR-0270 「Impact」 invariant 「the shell (`src-tauri`) does not take the agent crate as a production dependency」.
      #   PASS only if the shell's (`engram-dashboard`) normal · build graph has 0 lines of `engram-dashboard-agent` (pair: 1 or more lines in the daemon's same
      #   graph). It reads the resolved graph — not a manifest grep, so it also catches transitive paths where another dependency drags agent
      #   in. ★The decision function (`shell_agent_gate`) lives only here★ — the local substitute (`.claude/skill-bindings/qa-verify.md` 「gates 잡」) runs this step as is. # hangul-ok
      # ★Do not switch to `cargo tree -i engram-dashboard-agent`★ — `-i` exits 101 when the target is absent from the
      #   package's whole resolve (dev included) and prints "nothing to print" with rc=0 when it is reachable only
      #   through dev edges (measured 2026-11-04 — see `shell gate 5`), so its outcome depends on edges this step does
      #   not judge. Print the whole graph and look for the line instead.
      # ★Do not put `dev` in `-e`★ — shell → (dev) daemon → agent remains on purpose (shell integration tests use the daemon ·
      #   ADR-0286). Putting it in makes it always red through that edge.
      # ★Do not delete the pair (daemon → 1 or more lines)★ — if agent is renamed, its prefix changes or the pattern gets a typo, the 0-expectation line
      #   loses the name to match and passes blind. If the shell package is renamed, `cargo tree -p` dies and it is a FAIL.
      # ★Do not drop the `^…␣` anchor (trailing space)★ — without it other names with the same prefix get caught (the same as platform gate ⑦).
      - name: 'shell gate 1: no agent crate in the shell release graph (shell = 0, daemon >= 1)'
        shell: bash
        run: |
          shell_agent_gate() {
            local tree hits n rc
            tree=$(cargo tree --locked -p engram-dashboard -e normal,build --target all --all-features --prefix none) || { echo "FAIL — cargo tree -p engram-dashboard errored"; return 1; }
            rc=0; hits=$(printf '%s\n' "$tree" | rg '^engram-dashboard-agent ') || rc=$?
            [ "$rc" -le 1 ] || { echo "FAIL — rg errored (exit $rc)"; return 1; }
            if [ -n "$hits" ]; then echo "FAIL — the shell production graph (normal · build) has agent (ADR-0270 — the shell does not depend on agent):"; printf '%s\n' "$hits"; return 1; fi
            echo "shell normal/build graph: 0 agent line(s)"
            tree=$(cargo tree --locked -p engram-dashboard-daemon -e normal,build --target all --all-features --prefix none) || { echo "FAIL — cargo tree -p engram-dashboard-daemon errored"; return 1; }
            rc=0; hits=$(printf '%s\n' "$tree" | rg '^engram-dashboard-agent ') || rc=$?
            [ "$rc" -le 1 ] || { echo "FAIL — rg errored (exit $rc)"; return 1; }
            if [ -z "$hits" ]; then echo "FAIL — pair: 0 agent lines in the daemon production graph too — did the crate name change or is the pattern broken? (then the 0-expectation above passes blind)"; return 1; fi
            n=$(printf '%s\n' "$hits" | wc -l | tr -d '[:space:]')
            echo "daemon normal/build graph: $n agent line(s)"
            echo "PASS — no agent in the shell production graph (pair: daemon $n lines)"
          }
          shell_agent_gate

      # D17 (TRD S26-window-chrome §10-4 · main decision M15): PASS only if `slot_label` (`src-tauri/src/layout/tab_name.rs`) handles every variant of `SlotContent`
      #   by name and has no wildcard · catch-all name arm — the point is that adding a slot kind cannot pass before it is given
      #   a name. The function carries `#[deny(clippy::wildcard_enum_match_arm)]`, but CI does not
      #   run clippy, so that attribute alone does not enforce it — this step is the wall.
      #   ★The decision function (`slot_label_gate`) lives only here★ — the local substitute (`.claude/skill-bindings/qa-verify.md` 「gates 잡」) runs this step as is. # hangul-ok
      # ★It is a positive check — it does not enumerate violation forms with regexes★ (U1 review 2): the negative regexes that enumerated them leaked in turn through `Other =>` ·
      #   `other | other =>` · `other @ &_ =>` · a column-0 `}` that cuts the range · comment text. Instead it measures two things.
      #   Range = the `slot_label` body (from the column-0 `pub fn slot_label` line to the first column-0 `}` line) with `/* … */` (one line) · `//` comments
      #   stripped.
      #   ① Variant coverage: the variants pulled from the `pub enum SlotContent` block of `types.rs` (lines with a capitalized name indented 4 spaces) all appear in the body
      #     as `SlotContent::<variant>`. If a catch-all arm takes a new variant, it is caught regardless of syntax. If the range gets cut, only when the cut
      #     falls before some variant arm does that variant go missing, failing on the closed side — a catch-all arm hidden after a cut that comes after all
      #     variant arms is not visible now, and ① catches it when the next variant is added.
      #   ② Arm shape: the `match` line's indentation + 4 is the arm position. A line at that position holds at most one `=>` (writing a second arm on the
      #     same line is a FAIL), and except for `}` · `},` · `} => …` (the end of a multi-line structure pattern), after removing a leading `|`, every arm obtained by splitting the part before `=>` on `|`
      #     must start with `SlotContent::` (also the first line of a multi-line pattern with no `=>` · a line with nothing before `=>` is a FAIL).
      #     A `=>` at any other position (a nested `match` · a line holding only `=>` · a guard rustfmt moved to the next line) is a FAIL too.
      # ★Do not delete the two pairs★ — ① exactly one column-0 `pub fn slot_label` · `#[deny(…)]` before it (`#[…]` · `//`
      #   lines allowed in between) · no `allow` · `expect` · `warn` in that file that turns this lint off · no rustfmt skip anywhere in that file
      #   (`rustfmt::skip` · `rustfmt_skip` — including spaced forms around `::`) (it turns off the rustfmt form ② relies on) ·
      #   the body end is found · there is a `match` outside comments.
      #   ② the helper self-test — all 19 arm-shape violation samples are caught and none of the 10 non-violation samples is,
      #   and in a fake body missing one variant (`Ag` — same prefix as `AgList` · present only in a comment) of a fake enum (3 variants · a doc line · an attribute line)
      #   it reports exactly that one as missing. The counts are fixed (if the array is empty, 0 = 0).
      # What it relies on = rustfmt (`cargo fmt --check`) placing arms one per line · with 4-space indentation.
      # ★Remaining holes★ — multi-line block comments · arms a macro builds · `SlotContent::<variant>` inside a string in the body (fools ① —
      #   even then ② and the compiler's exhaustiveness check remain). A guard's `||` · a `|` in a structure pattern field · a `crate::…` path arm are read as
      #   violations (the closed side) — not used in `slot_label` (that file's head).
      # ★Three deliberately deceiving forms were accepted — user acceptance (U1 review 3 dispute · commit `4cefce48`)★: a raw string holding a fake `match` ·
      #   `SlotContent::<new variant>` inside a string that fills ① · leaving an exhaustive `match` unreachable and returning early before it through a
      #   helper with a catch-all arm. All three are left as code review's job.
      - name: 'shell gate 2: slot_label names every SlotContent variant with path-pattern arms only (D17)'
        shell: bash
        run: |
          slot_label_gate() {
            local t=src-tauri/src/layout/types.rs f=src-tauri/src/layout/tab_name.rs
            local n rc s e body variants missing hits x
            local -a bad good
            command -v rg >/dev/null 2>&1 || { echo "FAIL — rg is not on PATH (check the install step)"; return 1; }
            # Helpers — all read stdin.
            d17_strip() { sed -E -e 's#/\*([^*]|\*+[^*/])*\*+/##g' -e 's#//.*$##'; }
            d17_variants() {
              awk '/^pub enum SlotContent \{/ { f = 1; next }
                   f && /^\}/ { exit }
                   f && /^    [A-Z]/ { match($0, /^    [A-Za-z0-9_]+/); print substr($0, 5, RLENGTH - 4) }'
            }
            # $1 = the body with comments stripped · stdin = variant names → variants missing from the body
            d17_missing() {
              local v
              while IFS= read -r v; do
                [ -n "$v" ] || continue
                rg -q "SlotContent::${v}\b" <<<"$1" || echo "$v"
              done
            }
            # stdin = the body with comments stripped → mismatched lines as 「body line number: line」
            d17_shape() {
              awk '
                { line = $0; sub(/\r$/, "", line) }
                !m && line ~ /(^|[^A-Za-z0-9_])match([^A-Za-z0-9_]|$)/ {
                  m = 1; match(line, /^ */); ind = RLENGTH + 4
                  if (line ~ /=>/) print NR ": " line
                  next
                }
                line ~ /^[ \t]*$/ { next }
                { match(line, /^ */); li = RLENGTH; rest = substr(line, li + 1) }
                m && li == ind {
                  q = rest; if (gsub(/=>/, "", q) > 1) { print NR ": " line; next }
                  if (rest ~ /^\}[ \t]*,?[ \t]*$/ || rest ~ /^\}[ \t]*=>/) next
                  p = rest; k = index(p, "=>"); if (k) p = substr(p, 1, k - 1)
                  sub(/^\|[ \t]*/, "", p)
                  if (p ~ /^[ \t]*$/) { print NR ": " line; next }
                  n = split(p, alt, "|")
                  for (i = 1; i <= n; i++) {
                    a = alt[i]; sub(/^[ \t]+/, "", a)
                    if (a !~ /^SlotContent::/) { print NR ": " line; next }
                  }
                  next
                }
                line ~ /=>/ { print NR ": " line }
              '
            }
            # Put one sample arm (indented relative to the arm position) into a fake `match`.
            d17_wrap() { printf '    match content {\n'; sed 's/^/        /' <<<"$1"; printf '    }\n'; }

            [ -f "$t" ] || { echo "FAIL — gate target file is missing: $t (renamed or moved?)"; return 1; }
            [ -f "$f" ] || { echo "FAIL — gate target file is missing: $f (renamed or moved?)"; return 1; }

            # Pair ② — helper self-test
            bad=('_ => a,' 'other => a,' 'Other => a,' '_other => a,' 'other | other => a,' 'x @ _ => a,'
              'SlotContent::Empty | _ => a,' '| _ => a,' 'other @ &_ => a,' '&_ => a,' '_ /* c */ => a,' '} | _ => a,'
              $'_ | SlotContent::Usage {\n    show_claude: _,\n} => a,' $'_\n| SlotContent::Empty => a,'
              $'SlotContent::Empty => match x {\n    _ => a,\n},' $'SlotContent::Empty\n    => a,' $'SlotContent::Empty\n=> a,'
              'SlotContent::Empty => a, _ => b,' $'SlotContent::Usage {\n    show_claude: _,\n} => a, _ => b,')
            good=('SlotContent::Empty => word(Word::EmptySlot).to_owned(),'
              $'SlotContent::Agent { agent_id } => agent(agent_id)\n    .filter(|name| !name.trim().is_empty())\n    .to_owned(),'
              'SlotContent::Usage { show_claude: _, show_codex: _ } => a,'
              $'SlotContent::Usage {\n    show_claude: _,\n    show_codex: _,\n} => word(Word::Usage).to_owned(),'
              $'SlotContent::Empty\n| SlotContent::AgentList => a,' '| SlotContent::AgentList => a,'
              $'SlotContent::Empty => {\n    let x = 1;\n    x\n}' '// | _ => a,' 'SlotContent::Empty => a, // _ =>'
              'SlotContent::Empty /* _ | */ => a,')
            [ "${#bad[@]}" = 19 ] && [ "${#good[@]}" = 10 ] || { echo "FAIL — pair ②: sample counts are ${#bad[@]} · ${#good[@]} (expected 19 · 10)"; return 1; }
            n=0; for x in "${bad[@]}"; do [ -n "$(d17_wrap "$x" | d17_strip | d17_shape)" ] && n=$((n + 1)); done
            [ "$n" = 19 ] || { echo "FAIL — pair ②: only $n of the 19 arm-shape violation samples were caught — is the helper broken?"; return 1; }
            n=0; for x in "${good[@]}"; do [ -z "$(d17_wrap "$x" | d17_strip | d17_shape)" ] && n=$((n + 1)); done
            [ "$n" = 10 ] || { echo "FAIL — pair ②: only $n of the 10 non-violation samples passed — is the helper broken?"; return 1; }
            x=$(d17_variants <<<$'pub enum SlotContent {\n    /// doc line\n    Ag,\n    #[serde(default)]\n    AgList {\n        x: u8,\n    },\n    C(u8),\n}')
            [ "$(printf '%s' "$x" | tr '\n' ' ')" = "Ag AgList C" ] || { echo "FAIL — pair ②: read the fake enum's variants as '$x' (expected Ag AgList C)"; return 1; }
            missing=$(d17_missing "$(d17_strip <<<$'    match c {\n        SlotContent::AgList { .. } => 1,\n        // SlotContent::Ag => 2,\n        SlotContent::C(_) => 3,\n    }')" <<<"$x")
            [ "$missing" = "Ag" ] || { echo "FAIL — pair ②: read the variant missing from the fake body as '$missing' (expected Ag)"; return 1; }

            # Pair ① — range · attribute
            n=$(rg -c '^pub fn slot_label[<(]' "$f") || n=0
            [ "$n" = 1 ] || { echo "FAIL — pair ①: $f has $n column-0 'pub fn slot_label' (expected 1) — renamed or moved?"; return 1; }
            n=$(rg -U --count-matches '#\[deny\(clippy::wildcard_enum_match_arm\)\]\s*(?:(?:#\[.*\]|//.*)\s*)*pub fn slot_label[<(]' "$f") || n=0
            [ "$n" = 1 ] || { echo "FAIL — pair ①: no '#[deny(clippy::wildcard_enum_match_arm)]' before 'pub fn slot_label' (was the attribute removed?)"; return 1; }
            rc=0; hits=$(rg -n '\b(?:allow|expect|warn)\s*\([^)]*(?:wildcard_enum_match_arm|clippy\s*::\s*restriction)' "$f") || rc=$?
            [ "$rc" -le 1 ] || { echo "FAIL — rg errored (exit $rc)"; return 1; }
            [ -z "$hits" ] || { echo "FAIL — pair ①: $f has an attribute that turns that lint off:"; printf '%s\n' "$hits"; return 1; }
            rc=0; hits=$(rg -n 'rustfmt\s*::\s*skip|rustfmt_skip' "$f") || rc=$?
            [ "$rc" -le 1 ] || { echo "FAIL — rg errored (exit $rc)"; return 1; }
            [ -z "$hits" ] || { echo "FAIL — pair ①: $f has a rustfmt skip (it turns off the rustfmt form ② relies on):"; printf '%s\n' "$hits"; return 1; }
            s=$(awk '/^pub fn slot_label[<(]/ { print NR; exit }' "$f")
            e=$(awk -v s="$s" 'NR > s && /^\}/ { print NR; exit }' "$f")
            [ -n "$e" ] || { echo "FAIL — pair ①: could not find the end (column-0 '}') of the slot_label body at $f:$s"; return 1; }
            body=$(sed -n "${s},${e}p" "$f" | d17_strip)
            rg -q '\bmatch\b' <<<"$body" || { echo "FAIL — pair ①: no match outside comments in the slot_label body ($f:$s-$e) — was it split out into another function?"; return 1; }

            # ① Variant coverage
            n=$(rg -c '^pub enum SlotContent \{' "$t") || n=0
            [ "$n" = 1 ] || { echo "FAIL — $t has $n column-0 'pub enum SlotContent {' (expected 1)"; return 1; }
            variants=$(d17_variants <"$t")
            [ -n "$variants" ] || { echo "FAIL — could not read a single variant from SlotContent in $t"; return 1; }
            missing=$(d17_missing "$body" <<<"$variants")
            [ -z "$missing" ] || { echo "FAIL — D17: the slot_label body ($f:$s-$e) does not handle these variants as 'SlotContent::<variant>':"; printf '%s\n' "$missing"; return 1; }

            # ② Arm shape
            hits=$(d17_shape <<<"$body")
            [ -z "$hits" ] || { echo "FAIL — D17: slot_label's arms do not use only 'SlotContent::<variant>' path patterns:"; printf '%s\n' "$hits" | awk -v o=$((s - 1)) -v f="$f" '{ k = index($0, ":"); print f ":" (substr($0, 1, k - 1) + o) substr($0, k) }'; return 1; }

            echo "PASS — slot_label ($f:$s-$e) handles all $(printf '%s\n' "$variants" | wc -l | tr -d '[:space:]') SlotContent variants by name and its arms are path patterns only (pairs ① ② passed)"
          } # end slot_label_gate
          slot_label_gate

      # TRD S21 trd-3 §2-4 (edge vocabulary gate ①, shell half — 3-2 U2 · ADR-0310): the shell's daemon link
      #   (`src-tauri/src/daemon_client/link/`) names no `tauri` crate path and no agent crate. It adapts the transport and
      #   reaches the frontend only through the parent module's ports. PASS = 0 matches outside `//` comments.
      # Name (`$n`) = `tauri` · `tauri_<plugin>` · `engram_dashboard_agent`, optionally raw (`r#tauri`). Any of four forms is a
      #   hit: ① the name followed by `::` (also `::tauri::` · `tauri :: Emitter`) ② `use` · `extern crate` of the name, with
      #   an optional leading `::` (`use tauri;` · `use ::tauri;`) ③ the name followed by `as` (`use {tauri as t};` ·
      #   `use ::tauri as t;`) ④ the name inside a top-level `use {…}` group on one line (`use {std::fmt, tauri};`).
      #   A plain `tauri::` search would miss `tauri_plugin_dialog::` · `use tauri;` · every alias form.
      #   The `(?:[^/]|/[^/])*?` prefix means "no `//` yet on this line", so comments that name the wall do not count (same
      #   guard as the replay_flight purity step). Keep the `\s*` before `::` (same reason as that step).
      # ★Do not drop the two existence checks★ — if the directory moves, rg matches 0 and 0 reads as PASS; a module root at
      #   `daemon_client/link.rs` (instead of `link/mod.rs`) would sit outside the scanned directory.
      # ★Known limits★ — block comments (the directory uses `//` only) · names reached through another module
      #   (`super::events::…` — the wall is on names, not on the graph) · a file pulled in from elsewhere with
      #   `#[path = …]` · a macro defined outside the directory that expands to such a path · a `//` inside a string
      #   before the path on the same line · a `/` right before the name (`x/tauri::`) · paths or `use` groups split
      #   across lines · a nested group earlier in a one-line `use {…}` group (`use {std::{fmt}, tauri};` — `[^}]*`
      #   stops at the inner `}`).
      # The daemon half = `daemon gate 1`.
      - name: 'shell gate 4: daemon link vocabulary — no tauri or agent crate paths in daemon_client/link'
        shell: bash
        run: |
          set +e
          d=src-tauri/src/daemon_client/link
          if [ ! -d "$d" ]; then echo "FAIL — gate target directory is missing: $d (renamed or moved?)"; exit 1; fi
          if [ ! -f "$d/mod.rs" ]; then echo "FAIL — module root is not $d/mod.rs (a root outside the directory escapes the scan)"; exit 1; fi
          n='(?:r#)?(?:tauri(?:_[a-z0-9_]+)?|engram_dashboard_agent)'
          hits=$(rg -n "^(?:[^/]|/[^/])*?(?:\b$n\s*::|\b(?:use|extern\s+crate)\s+(?:::)?$n\b|\b$n\s+as\b|\buse\s+(?:::)?\{[^}]*\b$n\b)" "$d/")
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # TRD S21 trd-3 §2-4 (transport `test-support` release-graph gate, shell half — 3-2 U2 · ADR-0310): the transport's
      #   test harness (`testing` — `MemoryNetwork` · `ManualClock` …) is turned on only in the shell's `[dev-dependencies]`.
      #   The workspace uses `resolver = "2"`, so a dev-graph feature does not reach the release build — this step catches
      #   someone turning it on in `[dependencies]`. Form = the base · platform test-support steps (resolved graph, `-e` with
      #   `build`, crate-qualified pair).
      # ★Shell only for now★ — `-i engram-dashboard-transport` exits 101 when transport is absent from the package's whole
      #   resolve, dev included (measured: cli today); when it is reachable only through dev edges the normal-graph
      #   query exits 0 with "nothing to print". The daemon depends on transport since 3-3 U4; its line was left out under the
      #   3-3 replace-only scope. No cli line ever: the cli graph never holds transport (TRD §2-4).
      # `--all-features` on the 0 check = the shell's own features are on too (as in `shell gate 1`), so a
      #   shell feature that turned the harness on is caught.
      # ★Do not drop the pair (shell dev graph → at least 1)★ — if the feature is renamed, the 0 check loses its word and
      #   passes blind.
      # ★Limit★ — same as the base · platform steps: one cargo call that compiles lib and test targets (`--all-targets`) or
      #   selects the transport crate with all its features (`cargo build --workspace --all-features`) merges the feature
      #   into the shell binary; the resolved per-package graph does not show that.
      - name: 'shell gate 5: transport test-support stays out of the shell release graph (shell = 0, shell dev >= 1)'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard -e normal,build,features -i engram-dashboard-transport --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree -p engram-dashboard exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          hits=$(printf '%s\n' "$tree" | rg 'feature "test-support"')
          rgrc=$?
          set -e
          case "$rgrc" in
            1) echo "PASS — shell normal graph: 0 matches" ;;
            0) echo "FAIL — transport test-support is on in the shell release graph:"; printf '%s\n' "$tree"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rgrc)"; exit 1 ;;
          esac
          set +e
          tree=$(cargo tree --locked -p engram-dashboard -e normal,dev,features -i engram-dashboard-transport --target all)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree -p engram-dashboard (dev) exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          hits=$(printf '%s\n' "$tree" | rg 'engram-dashboard-transport feature "test-support"')
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$hits" ]; then n=0; else n=$(printf '%s\n' "$hits" | wc -l | tr -d '[:space:]'); fi
          echo "shell dev graph: $n match(es)"
          if [ "$n" -lt 1 ]; then echo "FAIL — expected >= 1 — was the feature renamed? (then the 0 check above passes blind)"; printf '%s\n' "$tree"; exit 1; fi
          echo "PASS"

      # TRD S21 trd-3-2-u5 §3-5 (S11 — 3-2 U5a): the shell's stop client runs on the transport (`daemon_client::link::stop`),
      #   so the shell names no `tungstenite` among its direct normal dependencies — the sync client it once used for the stop
      #   must not come back beside the transport. PASS = 0 `tungstenite` lines at depth 1 of the shell's normal graph.
      # ★Do not drop the pair (the same graph without the depth limit → at least 1)★ — the shell still links `tungstenite`
      #   through the transport's `ws` feature; if the crate is renamed or the output form changes, the 0 check loses its
      #   word and passes blind.
      # `--all-features` on the 0 check = the shell's own features are on too (as in `shell gate 1`).
      # ★Limit★ — direct edges only, by package name: a rename (`tws = { package = "tungstenite" }`) still prints the package
      #   name and is caught; a dev edge is not counted (tests may use the sync client through `tokio-tungstenite`).
      - name: 'shell gate 6: no direct tungstenite in the shell (shell depth 1 = 0, shell graph >= 1)'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard -e normal --depth 1 --prefix none --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree -p engram-dashboard --depth 1 exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          hits=$(printf '%s\n' "$tree" | rg '^tungstenite ')
          rgrc=$?
          set -e
          case "$rgrc" in
            1) echo "PASS — shell direct normal dependencies: 0 tungstenite lines" ;;
            0) echo "FAIL — the shell depends on tungstenite directly (the stop client runs on the transport):"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rgrc)"; exit 1 ;;
          esac
          set +e
          tree=$(cargo tree --locked -p engram-dashboard -e normal --prefix none --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree -p engram-dashboard exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          hits=$(printf '%s\n' "$tree" | rg '^tungstenite ')
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$hits" ]; then n=0; else n=$(printf '%s\n' "$hits" | wc -l | tr -d '[:space:]'); fi
          echo "shell normal graph: $n tungstenite line(s)"
          if [ "$n" -lt 1 ]; then echo "FAIL — pair: expected >= 1 through the transport — was the crate renamed or the output form changed? (then the 0 check above passes blind)"; exit 1; fi
          echo "PASS"

      # ADR-0273: PASS only if the direct workspace dependencies of the CLI package (`engram-dashboard-cli`) are exactly agent · cli (itself) · command.
      #   It reads the resolved graph — form · flags are the same as the messaging · command · base · platform ceiling gates
      #   (cutting them lets rename · inactive target · optional leak).
      # ★Do not change the decision to a line count — it is a name set match★: the point of this package standing apart is zero daemon, and counting only lines
      #   would not notice the daemon taking command's place, since it would still be three. The first field (package name) is sorted and compared with the heredoc below.
      # The hole of identifying members by the `engram-dashboard` name prefix (a member without the prefix just passes) is the same as in the other ceiling gates.
      # ADR-0285
      - name: 'cli gate 1: direct workspace deps — exactly agent · cli · command'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-cli --depth 1 --prefix none -e normal,dev,build --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          lines=$(printf '%s\n' "$tree" | rg "^engram-dashboard")
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          got=$(printf '%s\n' "$lines" | awk 'NF { print $1 }' | sort -u)
          want=$(sort -u <<'CLI_DEPS'
          engram-dashboard-agent
          engram-dashboard-cli
          engram-dashboard-command
          CLI_DEPS
          )
          echo "found direct workspace dep(s):"
          printf '%s\n' "$got"
          if [ "$got" != "$want" ]; then
            echo "FAIL — expected exactly these names(first column):"
            printf '%s\n' "$want"
            exit 1
          fi
          echo "PASS"

      # ADR-0266 invariant 「production OS branching only inside the platform crate」 — PASS only if the list of `.rs` files outside platform that use OS cfg predicates
      #   is exactly the list below (pair: the same matcher hits 1 or more files inside platform). ★The list (heredoc) · the regex
      #   (`os_cfg_re`) · the file finder function (`os_cfg_files`) live only here★ — the local substitute (`.claude/skill-bindings/qa-verify.md` 「gates 잡」) runs this step as is. # hangul-ok
      #   The canonical matcher · pair · scope · limits · how to change the list = gate ④ of the `crates/engram-dashboard-platform/src/lib.rs` header.
      - name: 'platform gate 4: OS cfg outside platform — exactly the fixed file list'
        shell: bash
        run: |
          os_cfg_re='(?(DEFINE)(?<CMT>//[^\n]*+|/\*(?s:.)*?\*/)(?<STR>[bc]?"(?:[^"\\]|\\(?s:.))*+")(?<RAW>[bc]?r(?<rh>#*+)"(?s:.)*?"\k<rh>)(?<ID>[A-Za-z_][A-Za-z0-9_]*+(?![#"]))(?<OS>\b(?:windows|unix)\b|\btarget_(?:os|family|env|vendor)(?:\s++|(?&CMT))*+=)(?<ATOM>(?&CMT)|(?&STR)|(?&RAW)|(?&ID)|[^()"/A-Za-z_]|/(?![/*]))(?<NOS>(?&CMT)|(?&STR)|(?&RAW)|(?!(?&OS))(?&ID)|[^()"/A-Za-z_]|/(?![/*]))(?<P>\((?:(?&ATOM)|(?&P))*+\))(?<Q>\((?:(?&NOS)|(?!(?&Q))(?&P))*+(?:(?&OS)|(?&Q))))(?://[^\n]*+|/\*(?s:.)*?\*/|\b[bc]?r(?<h>#*)"(?s:.)*?"\k<h>|"(?:[^"\\]|\\(?s:.))*+"|\x27(?:[^\x27\\\n]|\\[^\n]|\\x[0-9a-fA-F]{2}|\\u\{[0-9a-fA-F]{1,6}\})\x27)(*SKIP)(*FAIL)|\b(?:cfg!?|cfg_attr)\s*(?=(?&P))(?&Q)'
          if ! rg --pcre2-version; then echo "FAIL — this rg has no PCRE2 (gate ④'s matcher relies on it)"; exit 1; fi
          for d in crates src-tauri crates/engram-dashboard-platform/src; do
            if [ ! -d "$d" ]; then echo "FAIL — gate target directory is missing: $d (renamed or moved?)"; exit 1; fi
          done
          # Arguments = rg paths · globs. Output = the files that use OS cfg predicates (sorted). If rg dies with 2 or more, it returns 2.
          os_cfg_files() {
            local out rc=0
            out=$(rg -P -U -l --color never "$os_cfg_re" "$@") || rc=$?
            [ "$rc" -le 1 ] || return 2
            # Turn the `\` that rg prints on Windows into `/` — it is `\134` (octal) because the agent shell tool folds `\\` into `\`.
            printf '%s\n' "$out" | tr '\134' '/' | sed '/^$/d' | LC_ALL=C sort -u
          }
          own=$(os_cfg_files crates/engram-dashboard-platform/src -g '*.rs') || { echo "FAIL — rg errored"; exit 1; }
          if [ -z "$own" ]; then echo "FAIL — the same matcher hits 0 files inside platform — is the regex broken? (then the comparison below goes blind)"; exit 1; fi
          actual=$(os_cfg_files crates src-tauri -g '*.rs' -g '!crates/engram-dashboard-platform/**') || { echo "FAIL — rg errored"; exit 1; }
          expected=$(sed -e 's/[[:space:]]*#.*$//' -e '/^[[:space:]]*$/d' <<'OS_CFG_FILES' | LC_ALL=C sort
          # test branches only
          crates/engram-dashboard-agent/src/backend/claude/leftover.rs
          crates/engram-dashboard-agent/src/backend/claude/mod.rs
          crates/engram-dashboard-agent/src/backend/claude/usage_probe.rs
          crates/engram-dashboard-agent/src/backend/codex/mod.rs
          crates/engram-dashboard-agent/src/backend/codex/thread_lock.rs
          crates/engram-dashboard-agent/src/backend/codex/transport.rs
          crates/engram-dashboard-agent/src/backend/mod.rs
          crates/engram-dashboard-agent/src/manager.rs
          crates/engram-dashboard-agent/src/session.rs
          crates/engram-dashboard-agent/src/transport/process_group.rs
          crates/engram-dashboard-agent/src/transport/pty.rs
          crates/engram-dashboard-agent/src/transport/spawn.rs
          crates/engram-dashboard-agent/src/transport/stdio.rs
          crates/engram-dashboard-agent/src/usage/process.rs
          crates/engram-dashboard-agent/src/usage/scratch.rs
          crates/engram-dashboard-base/src/logging/mod.rs
          crates/engram-dashboard-daemon/src/instance.rs
          crates/engram-dashboard-daemon/src/messaging_host.rs
          crates/engram-dashboard-daemon/src/portfile.rs
          src-tauri/src/discovery/tests.rs
          # integration tests (`tests/`)
          crates/engram-dashboard-agent/tests/activation.rs
          crates/engram-dashboard-agent/tests/backend_contract.rs
          crates/engram-dashboard-agent/tests/canonical_name_wiring.rs
          crates/engram-dashboard-agent/tests/pump_panic_cli_cleanup.rs
          crates/engram-dashboard-agent/tests/reaper.rs
          crates/engram-dashboard-agent/tests/stdio_physical_pipe.rs
          crates/engram-dashboard-agent/tests/stdio_smoke.rs
          crates/engram-dashboard-agent/tests/submit_delivery_boundary.rs
          crates/engram-dashboard-daemon/tests/ws_e2e.rs
          src-tauri/tests/stop_smoke.rs
          # test harness bins · examples
          crates/engram-dashboard-daemon/src/bin/roundtrip_smoke.rs
          crates/engram-dashboard-daemon/src/bin/saturation_pilot.rs
          crates/engram-dashboard-agent/examples/spike.rs
          crates/engram-dashboard-agent/examples/spike_breakaway.rs
          OS_CFG_FILES
          )
          if [ "$actual" = "$expected" ]; then
            n=$(printf '%s\n' "$actual" | wc -l | tr -d '[:space:]')
            echo "PASS — the $n OS cfg files outside platform match the list"
            exit 0
          fi
          echo "FAIL — the OS cfg files outside platform differ from the list"
          echo "Files hit but not in the list (if production branching, move it to platform · if a test · harness, add it to the list):"
          LC_ALL=C comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          echo "Files in the list but not hit (the branch was removed or moved — remove it from the list):"
          LC_ALL=C comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
          exit 1

      # The dependency axis of the ADR-0266 invariant — PASS only if, among workspace members, the one that **directly** has the OS crates below as a **production dependency**
      #   (normal · build · any target OS) is platform alone (pair: platform has 1 or more). dev dependencies are not counted.
      #   ★The list (`os_dep_re` — a hand-written explicit list) · the decision function (`os_dep_gate`) live only here★ —
      #   the local substitute (`.claude/skill-bindings/qa-verify.md` 「gates 잡」) runs this step as is. Canonical pair · scope · limits = the `crates/engram-dashboard-platform/src/lib.rs` # hangul-ok
      #   header gate ⑤.
      - name: 'platform gate 5: OS crates as direct normal/build deps — platform only'
        shell: bash
        run: |
          os_dep_re='^(windows|windows-sys|winapi|libc|nix|rustix|objc2.*|objc|cocoa|core-foundation|core-graphics|security-framework|mach2)$'
          os_dep_gate() {
            local tree hits own bad
            tree=$(cargo tree --locked --workspace --no-dedupe --depth 1 --prefix depth -e normal,build --target all --all-features) || { echo "FAIL — cargo tree errored"; return 1; }
            hits=$(printf '%s\n' "$tree" | awk -v re="$os_dep_re" '/^0/ { m = substr($1, 2); next } /^1/ && substr($1, 2) ~ re { print m " -> " substr($1, 2) }' | LC_ALL=C sort -u)
            own=$(printf '%s\n' "$hits" | awk '$1 == "engram-dashboard-platform"')
            bad=$(printf '%s\n' "$hits" | awk 'NF && $1 != "engram-dashboard-platform"')
            printf 'found:\n%s\n' "$hits"
            if [ -z "$own" ]; then echo "FAIL — pair: 0 in platform — is the list regex or the cargo tree output form broken? (then the decision below goes blind)"; return 1; fi
            if [ -n "$bad" ]; then echo "FAIL — a member outside platform directly has an OS crate as a production dependency (move that OS call to platform):"; printf '%s\n' "$bad"; return 1; fi
            echo "PASS — direct production OS crate dependencies only in platform"
          }
          os_dep_gate

      # The standard library axis of the ADR-0266 invariant — PASS only if the list of `.rs` files outside platform that use `std::os::windows` · `std::os::unix` outside `//` comments
      #   is exactly the list below (pair: the same matcher hits 1 or more files inside platform).
      #   ★The regex (`std_os_re`) · the decision function (`std_os_gate` — target scope · pair · comparison · messages, all of it) · the list (heredoc) live
      #   only here★ — the local substitute (`.claude/skill-bindings/qa-verify.md` 「gates 잡」) runs this step as is. The canonical pair · scope · limits · how to change # hangul-ok
      #   the list = gate ⑥ of the `crates/engram-dashboard-platform/src/lib.rs` header.
      - name: 'platform gate 6: std::os::windows/unix outside platform — exactly the fixed file list'
        shell: bash
        run: |
          std_os_re='^(?:[^/]|/[^/])*?\bstd\s*::\s*os\s*::\s*(?:windows|unix)\b'
          # Argument = the list text as is (takes `#` comments · blank lines · indentation — the 4h block passes the ci.yml text as is).
          #   `\134` is for the same reason as gate ④'s `os_cfg_files`.
          std_os_gate() {
            local d own actual expected n rc=0
            for d in crates src-tauri crates/engram-dashboard-platform/src; do
              [ -d "$d" ] || { echo "FAIL — gate target directory is missing: $d (renamed or moved?)"; return 1; }
            done
            expected=$(printf '%s\n' "$1" | sed -e 's/[[:space:]]*#.*$//' -e 's/^[[:space:]]*//' -e '/^$/d' | LC_ALL=C sort)
            own=$(rg -l --color never "$std_os_re" crates/engram-dashboard-platform/src -g '*.rs') || rc=$?
            [ "$rc" -le 1 ] || { echo "FAIL — rg errored (exit $rc)"; return 1; }
            [ -n "$own" ] || { echo "FAIL — pair: the same matcher hits 0 files inside platform — is the regex broken? (then the comparison below goes blind)"; return 1; }
            rc=0
            actual=$(rg -l --color never "$std_os_re" crates src-tauri -g '*.rs' -g '!crates/engram-dashboard-platform/**') || rc=$?
            [ "$rc" -le 1 ] || { echo "FAIL — rg errored (exit $rc)"; return 1; }
            actual=$(printf '%s\n' "$actual" | tr '\134' '/' | sed '/^$/d' | LC_ALL=C sort -u)
            if [ "$actual" = "$expected" ]; then
              n=$(printf '%s\n' "$actual" | wc -l | tr -d '[:space:]')
              echo "PASS — the $n std::os files outside platform match the list"
              return 0
            fi
            echo "FAIL — the std::os files outside platform differ from the list"
            echo "Files hit but not in the list (if production code, move it to platform · if a test · example, add it to the list):"
            LC_ALL=C comm -13 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
            echo "Files in the list but not hit (the use was removed or moved — remove it from the list):"
            LC_ALL=C comm -23 <(printf '%s\n' "$expected") <(printf '%s\n' "$actual")
            return 1
          }
          list=$(cat <<'STD_OS_FILES'
          # test branches only (inside `#[cfg(test)]` modules)
          crates/engram-dashboard-agent/src/backend/claude/usage_probe.rs
          crates/engram-dashboard-agent/src/usage/process.rs
          crates/engram-dashboard-agent/src/usage/scratch.rs
          crates/engram-dashboard-base/src/logging/mod.rs
          crates/engram-dashboard-daemon/src/instance.rs
          # examples
          crates/engram-dashboard-agent/examples/spike_breakaway.rs
          STD_OS_FILES
          )
          std_os_gate "$list"

      # ADR-0175 decision 3 moved `replay_flight` from core into the shell package, and with that the purity claim its file header made
      #   (zero dependencies on sockets · tokio · Tauri · protocol) **ended up in no gate's scan scope**
      #   — the source regex gates above are all scoped to `crates/…/src/`, and not one looked at
      #   `src-tauri/src/`. Decision 1 (the new `base`) set up a gate at the new home, but decision 3 did not.
      # ★Unlike the sibling crate gates, there is no compiler backstop★ — `agent` · `base` do not take `tauri` in their Cargo.toml
      #   at all, so a violation dies first as a compile error and the `use tauri` grep is only a cheap early signal. In contrast,
      #   this package depends on `tauri` · `tokio` · `engram-dashboard-protocol`, all of them, so a violation just compiles.
      #   So here this regex is **the only wall**, and a form that only looks at `use` lines is pierced by a single line of an inline full path
      #   (`tokio::spawn(...)`) — that is why it catches that form too.
      # ★The prefix guard `^(?:[^/]|/[^/])*?` = 「no `//` met yet on this line」★ — so self-quotes inside `//!` · `///` · trailing
      #   comments are not false positives (the target file's header quotes this gate). Rust regex
      #   has no lookaround, so apart from this form there is no means to express 「outside comments」.
      # ★Requiring `\b` + `::` tells legitimate neighbors apart★ — this module uses `std::time::Instant` (the deterministic harness's
      #   injection point). It must catch only `tokio::time::Instant` and not the std one, so it matches the crate root name, and `\b`
      #   blocks partial matches like `my_tauri::`.
      # ★Do not remove the `\s*` around `::`★ — Rust accepts spaces between path segments (`tokio :: spawn`). Usually rustfmt
      #   (`cargo fmt --check`) blocks it first, but spaced forms in macro bodies rustfmt does not touch · `#[rustfmt::skip]` regions
      #   pass the fmt gate and remain as is. Paths spanning lines are still not seen.
      # ★Known limit = block comments (`/* */`)★ — the prefix guard cannot block what is inside them. The target file uses only `//`.
      # ★Known limit = names not in the `<name>::` form★ — aliases (`use tokio as rt;` · `extern crate tokio as rt;`) · last-segment
      #   imports (`use std::net;`) · multi-item groups (`use std::{net::TcpStream, time::Instant};`) are not seen
      #   (`docs/todo/observed-only.md`).
      # ★Do not delete `test -f`★ — if the file moves again, rg reports 0 matches and 0 = PASS, so the wall quietly
      #   disappears (the rc=2 branch catches the same thing but cannot print the reason). It is `-f`, not `-d` — the target is a file.
      - name: 'Gate: replay_flight purity — no transport/wire ingress'
        shell: bash
        run: |
          set +e
          f=src-tauri/src/daemon_client/replay_flight.rs
          if [ ! -f "$f" ]; then echo "FAIL — gate target file is missing: $f (moved again?)"; exit 1; fi
          hits=$(rg "^(?:[^/]|/[^/])*?\b(tauri|tokio|engram_dashboard_[a-z_]+|std\s*::\s*net)\s*::" "$f")
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # ADR-0177: the three isolation gates of the reusable transport lib (`transport` — new). The canonical expected values · rationale · 「do not delete」
      #   are the 「Isolation gates」 section of the `crates/engram-dashboard-transport/src/lib.rs` header, and this only
      #   calls them — the expected values are not explained again in this workflow, which would make a second canonical source.
      #   That header's gate ④ (the three feature combinations each compile) and ⑤ (is the real-socket suite non-empty)
      #   need compiling, so they are in the backend job (`transport gate 4a`/`4b`/`4c`/`4d`).
      # ★The three are different axes, so do not merge them into one★ — ① counts only workspace members, so it lets the third-party `tauri`
      #   straight through (that axis is ②), and ③ is a layer boundary **inside** the crate, which ①② do not look at at all.
      # The exit code inversion · `set +e` traps are exactly as in the common comment near the top of this job.

      # Form · flags are the same as the messaging · command · base ceiling gates (cutting them lets rename · the `[dependencies.<name>]`
      #   table form · `[build-dependencies]` · inactive target · optional all leak through as valid Cargo syntax).
      # ★Only this gate has no path existence pre-check — because it has no need★: what rg reads is not a file but
      #   cargo tree's stdout, and if the package vanishes or is renamed, `cargo tree -p` itself dies with a nonzero
      #   exit code and the first branch below catches it. ②③ below scan paths directly, so they have a pre-check.
      - name: 'transport gate 1: direct workspace deps ceiling (exactly 1 = self)'
        shell: bash
        run: |
          set +e
          tree=$(cargo tree --locked -p engram-dashboard-transport --depth 1 --prefix none -e normal,dev,build --target all --all-features)
          rc=$?
          set -e
          if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; exit 1; fi
          set +e
          out=$(printf '%s\n' "$tree" | rg "^engram-dashboard" | sort -u)
          rgrc=$?
          set -e
          if [ "$rgrc" -gt 1 ]; then echo "FAIL — rg errored (exit $rgrc)"; exit 1; fi
          if [ -z "$out" ]; then n=0; else n=$(printf '%s\n' "$out" | wc -l | tr -d '[:space:]'); fi
          echo "found $n direct workspace dep(s):"
          printf '%s\n' "$out"
          if [ "$n" -ne 1 ]; then echo "FAIL — expected exactly 1 (itself) — a workspace crate dependency was brought in"; exit 1; fi
          echo "PASS"

      # ADR-0003's isolation invariant. ★Do not read ① above as covering this axis★ — ① counts only workspace members with
      #   `rg "^engram-dashboard"`, so the third-party `tauri` passes that gate as is.
      # ★Do not delete `test -d`★ — if the crate is moved or renamed, rg reports 0 matches and 0 = PASS, so the wall
      #   quietly disappears (the rc=2 branch catches the same thing but cannot print the reason).
      - name: 'transport gate 2: no `use tauri` in the transport crate'
        shell: bash
        run: |
          set +e
          d=crates/engram-dashboard-transport/src
          if [ ! -d "$d" ]; then echo "FAIL — gate target directory is missing: $d (renamed or moved?)"; exit 1; fi
          hits=$(rg "^\s*use tauri" "$d/")
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # The wall keeping the pure layer (`pending.rs` · `stream.rs` · `machine.rs`) from taking the runtime · sockets · workspace crates.
      # ★Inside the same crate, so there is no compiler backstop★ — a single `tokio` line just compiles, so this regex is
      #   the only wall. The rationale for the form is the same as the `replay_flight` purity gate comment above (the prefix
      #   `^(?:[^/]|/[^/])*?` = 「no `//` met yet」 → catches only outside comments, so header self-quotes are not false positives ·
      #   anchoring only `use` lines is pierced by a single line of an inline full path `tokio::spawn(…)` · `\b`+`::` tells apart the legitimate neighbor
      #   `std::time::Instant` · the `\s*` around `::` catches the spaced form `tokio :: spawn`).
      # ★Even if a file vanishes the match is 0 = PASS, so the existence of the three files is checked first★ (`-f`, not `-d` — the targets are files).
      # ★Do not quote `$files`★ — it must split into three paths and become rg arguments (the paths have no spaces).
      - name: 'transport gate 3: pure layer isolation (pending/stream/machine)'
        shell: bash
        run: |
          set +e
          files='crates/engram-dashboard-transport/src/pending.rs crates/engram-dashboard-transport/src/stream.rs crates/engram-dashboard-transport/src/machine.rs'
          for f in $files; do
            if [ ! -f "$f" ]; then echo "FAIL — gate target file is missing: $f (renamed or moved?)"; exit 1; fi
          done
          hits=$(rg "^(?:[^/]|/[^/])*?\b(tokio|futures_util|futures|engram_dashboard_[a-z_]+|std\s*::\s*net)\s*::" $files)
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # TRD S21 trd-3 §2-4 (edge vocabulary gate ①, daemon half — 3-3 U6 · ADR-0129 · ADR-0310): the daemon's network row
      #   (`crates/engram-dashboard-daemon/src/link/`) names neither the agent crate nor the messaging kernel — it reaches the
      #   upper layers only through the `conn_port` contract. It takes over the deleted net gates 1 (no daemon · messaging
      #   names) and 2b (no agent runtime) for the code that moved out of net. PASS = 0 matches.
      # ★Comments are in scope (intended)★ — vocabulary leaks first through comments and test helpers. A comment that must
      #   name the wall writes the name with a parenthesized letter (`engram_dashboard_(a)gent`).
      # ★Do not drop the module-root check★ — a root at `link.rs` (instead of `link/mod.rs`) would sit outside the scanned
      #   directory. A missing directory fails the same check.
      # ★Known limit★ — the wall is on crate names: a path through another daemon module (`crate::agent_conn::…`) is not
      #   caught, as in the shell half (`shell gate 4`).
      - name: 'daemon gate 1: link vocabulary — no agent or messaging crate names in daemon link'
        shell: bash
        run: |
          set +e
          d=crates/engram-dashboard-daemon/src/link
          if [ ! -f "$d/mod.rs" ]; then echo "FAIL — module root is not $d/mod.rs (moved or renamed? a root outside the directory escapes the scan)"; exit 1; fi
          hits=$(rg -n "engram_dashboard_(agent|messaging)" "$d/")
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # TRD S21 trd-3 §2-4 (edge vocabulary gate ②, 3-3 U6 · ADR-0310 decision 9): the daemon network row's auth handshake
      #   borrows neither the command enum nor the protocol version constant — the frame shape is protocol
      #   `handshake::AuthFrame` and the expected version is injected (`link::server::Server::new`). It takes over the
      #   deleted net gate 4. PASS = 0 matches.
      # The parentheses in the pattern are not a typo — the bare names would make a comment that names this wall trip it.
      #   ★No word boundary (intended)★ — partial names such as a test constant `TEST_(P)ROTOCOL_VERSION` are caught too;
      #   rename them instead (`TEST_WIRE_VERSION`).
      - name: 'daemon gate 2: link vocabulary — no auth vocabulary re-entry in daemon link'
        shell: bash
        run: |
          set +e
          d=crates/engram-dashboard-daemon/src/link
          if [ ! -f "$d/mod.rs" ]; then echo "FAIL — module root is not $d/mod.rs (moved or renamed? a root outside the directory escapes the scan)"; exit 1; fi
          hits=$(rg -n "(A)gentCommand|(P)ROTOCOL_VERSION" "$d/")
          rc=$?
          set -e
          case "$rc" in
            1) echo "PASS — 0 matches" ;;
            0) echo "FAIL — expected 0 matches, found:"; printf '%s\n' "$hits"; exit 1 ;;
            *) echo "FAIL — rg errored (exit $rc)"; exit 1 ;;
          esac

      # platform gate ⑦ — catches an async runtime riding **silently** into a synchronous crate (a compile check cannot: a
      #   silently pulled dependency does not break compilation). Every line reads the normal graph (`-e normal`):
      #   1. agent → 0 lines — a synchronous crate without tokio that carries base · command · platform as production
      #      dependencies, so this one line covers all three.
      #   2. cli → 0 lines — a synchronous CLI; leaving the daemon package was about not pulling tokio in (ADR-0273). On top
      #      of what the agent line covers, it covers the CLI's own direct third-party dependencies (serde_json today).
      #   3. Pair: transport → at least 1 line (ADR-0278 form) — its tokio dependency is unconditional.
      #   Targets · scope · limits canonical = the `crates/engram-dashboard-platform/src/lib.rs` header gate ⑦.
      # ★Do not drop the `^…␣` anchor (with its trailing space)★: as a bare substring the pattern catches ter(mio)s, the
      #   expectation stops being 0, and a person has to judge every run (= the gate is dead).
      # ★Do not delete the pair★ — if the pattern breaks or the `cargo tree` output form changes, the 0 expectations lose the
      #   lines they would match and pass blind; the pair turns that blind pass red. Renaming a target crate makes
      #   `cargo tree -p` die = FAIL.
      # ADR-0282
      - name: 'platform gate 7: no async-runtime ingress (agent · cli = 0, transport >= 1)'
        shell: bash
        run: |
          # $1 = expectation (zero = 0 lines · some = 1 or more lines) · the rest = the target arguments of `cargo tree`.
          async_ingress() {
            local want=$1 tree hits n rc=0
            shift
            echo "== cargo tree $* (expect $want)"
            tree=$(cargo tree --locked "$@" -e normal --prefix none --target all) || rc=$?
            if [ "$rc" -ne 0 ]; then echo "FAIL — cargo tree exited $rc"; printf '%s\n' "$tree"; return 1; fi
            hits=$(printf '%s\n' "$tree" | rg -i "^(tokio|mio|tokio-tungstenite|futures-util) ") || rc=$?
            case "$want:$rc" in
              zero:1) echo "PASS — 0 matches" ;;
              zero:0) echo "FAIL — async runtime leaked:"; printf '%s\n' "$hits"; return 1 ;;
              some:0) n=$(printf '%s\n' "$hits" | wc -l | tr -d '[:space:]'); echo "PASS — $n matches"; printf '%s\n' "$hits" ;;
              some:1) echo "FAIL — pair: 0 matches — is the pattern or the cargo tree output form broken? (then the 0-expectation lines go blind)"; return 1 ;;
              *) echo "FAIL — rg errored (exit $rc)"; return 1 ;;
            esac
          }
          async_ingress zero -p engram-dashboard-agent
          async_ingress zero -p engram-dashboard-cli
          async_ingress some -p engram-dashboard-transport

      # ── Third-party notice — run the same generator release-build calls on every push and discard the result ──
      # Failures such as a license outside the allowlist · a package without text · a synthesized crate not in the list are caught here first so they do not
      # first blow up in release-build after a tag is cut (the canonical failure conditions = the header and body of scripts/gen-third-party-licenses.mjs).
      # Why in this job: the toolchain assertion · registry cache are already here, and the cargo tree gates above have already fetched the crate sources, so
      #   cargo-about has nothing to fetch again. No new job is set up, so release-build's needs stay as is (this job is already in it).
      #   The generator also reads the npm production dependencies and needs node_modules — so setup-node + npm ci are in this job too.
      # The install step has the same body as release-build's step of the same name — change one, change both (the pinned values are in the top-level env).
      - name: Install cargo-about (pinned, checksum-verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:PIN_CARGO_ABOUT_VERSION
          $sha = $env:PIN_CARGO_ABOUT_SHA256
          $url = "https://github.com/EmbarkStudios/cargo-about/releases/download/$ver/cargo-about-$ver-x86_64-pc-windows-msvc.tar.gz"
          $archive = "$env:RUNNER_TEMP\cargo-about.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          if ($actual -ne $sha) { throw "cargo-about archive checksum mismatch: expected $sha, got $actual" }
          $dest = "$env:RUNNER_TEMP\cargo-about"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # Pick the Windows built-in bsdtar by path — if the GNU tar (Git) on PATH gets picked, it reads `D:\…` as a remote host and fails.
          & "$env:SystemRoot\System32\tar.exe" -xzf $archive -C $dest
          if ($LASTEXITCODE -ne 0) { throw "tar exited $LASTEXITCODE" }
          $exe = Get-ChildItem $dest -Recurse -Filter cargo-about.exe | Select-Object -First 1
          if (-not $exe) { throw "cargo-about.exe not found in the extracted archive" }
          # GITHUB_PATH is prepended to the existing PATH, so this one wins even if the runner has another cargo-about. The version assertion is done by the generator.
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: npm ci
        shell: bash
        run: npm ci

      # ADR-0294
      - name: 'Gate: third-party license notice generates (output discarded)'
        shell: bash
        run: node scripts/gen-third-party-licenses.mjs "$RUNNER_TEMP/THIRD_PARTY_LICENSES.txt"

  # ── Frontend ───────────────────────────────────────────────────────────────────
  frontend:
    name: frontend (vitest + tsc)
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: npm ci
        shell: bash
        run: npm ci

      - name: npm test
        shell: bash
        run: npm test

      # There is no separate typecheck script, so tsc is called directly.
      - name: npx tsc --noEmit
        shell: bash
        run: npx tsc --noEmit

  # ── Release (version tags only) — the build job and the publish job are split ──────────────────────
  # ★Why it is split into two jobs (supply chain)★
  # Packaging runs the code of hundreds of transitive dependencies on the runner through `npm ci` and the tauri build. If one of them
  # puts a fake `gh` in front of `GITHUB_PATH`, the `gh` called later **in the same job** is that fake — narrowing the token with step-level
  # `env:` does not help. That is because the attack target is not "who can read env" but "what `gh`
  # resolves to". So the write token is placed only in a job where not a single line of third-party code runs.
  #   release-build   : contents=read  · where third-party code runs · passes the result on only as an artifact
  #   release-publish : contents=write · only artifact download + gh calls · no npm/cargo/packaging scripts
  # ★Do not add steps to release-publish★ — each step is a place where third-party code can crawl back in.
  #
  # ★`ref_type == 'tag'` alone is not enough★ — the `tags: ['v*']` glob above applies **only to push**.
  # workflow_dispatch can target any ref, so looking only at the tag condition, a manual run aimed at a non-version tag like
  # `backup/comments-pass-20260731` would go ahead and create a **public GitHub Release**.
  # So the same condition as the push glob is reproduced directly: starts with v + no `/` (`*` in a GitHub glob does not cross `/`).
  # The condition is put on **both jobs** — if build is skipped, publish is skipped too through needs, so the build side alone
  # would close it, but the job that actually creates the release carries the same condition itself too.
  #
  # The packaging logic is not rewritten here. The single source of the ADR-0100 co-location invariant and "what ships"
  # is the manifest of scripts/build-release.ps1, and this job only calls that script and moves the result into a zip.
  # Writing the expected file list in this YAML would make two sources, and they would surely diverge.
  release-build:
    name: release build (package + zip)
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '/')
    needs: [backend, gates, frontend]
    runs-on: windows-latest
    # The optimized build takes much longer than the debug test jobs. It uses no compile cache (below), so it runs cold every time.
    timeout-minutes: 90
    # This job only reads. The write token exists only in release-publish (see the reason for the split above).
    permissions:
      contents: read
    env:
      # The tag string is not interpolated into the run body directly with `${{ }}` (a script injection surface) — it is passed via env.
      # The tag is the version, period. The version is not computed or processed here.
      TAG: ${{ github.ref_name }}
    # ★The only value this job passes to the publish job is this one★ — not even the file name is passed.
    # Passing a name would put a string the build job controls into a `gh` argument of the write-token job (a name holding a glob +
    # matching files could lure it into uploading other assets). The publish job builds the name itself from TAG.
    outputs:
      built_commit: ${{ steps.built.outputs.commit }}
    steps:
      # ★Runs first of all (even before checkout)★ — it first checks that the tag name is safe as a path and file name.
      # Because the steps below put the tag string as is into the staging folder name and the zip file name. In particular, if a `/`
      # gets in, the staging path digs one level deeper (`…\engram-dashboard-v1\beta`) and `Split-Path -Leaf` picks only `beta`,
      # so both the zip name and the co-location folder name lose the version. And the zip gate below cannot catch it —
      # the gate's expected root name is **derived from the same contaminated path**, so they pass together in harmony (a structural blind spot).
      # It duplicates the `/` block in `if`, but this is the last line of defense that looks at the value itself, and it finishes in a few seconds before the build.
      # Why the version **format** is not enforced: the tag is the version, so the format is not this job's question.
      # The only thing checked here is "can it be used as a path and file name".
      - name: 'Gate: tag name is safe as a path and file name'
        shell: bash
        run: |
          echo "TAG=$TAG"
          # Only allowed characters pass (allowlist). Everything not listed here is rejected, so / \ : * ? " < > | and spaces · control characters
          # are caught automatically. The leading v is asserted too.
          # ★This allowlist is load-bearing as a glob block too — do not loosen it★
          # 3 PowerShell parameters in the steps below **interpret the value as a wildcard pattern**:
          # `Compress-Archive -Path`, and the zip gate's `Get-ChildItem -Path` twice.
          # The only reason it is safe now is that the allowlist has no * ? [ ]. Letting those characters in here
          # quietly turns the staging folder path into pattern matching (packing the wrong folder or producing an empty result),
          # and since even the gate's expected value is derived from the same pattern, they pass together in harmony.
          if [[ ! "$TAG" =~ ^v[0-9A-Za-z._+-]+$ ]]; then
            echo "FAIL — the tag has characters that are not safe in a path or file name (allowed: starts with v + alphanumerics . _ + -)"
            exit 1
          fi
          # Separately block the two forms that pass the allowlist but are still dangerous.
          case "$TAG" in
            *..*) echo "FAIL — the tag has '..' (moves up the path)"; exit 1 ;;
            *.)   echo "FAIL — the tag ends with '.' (Windows trims a trailing dot from file names)"; exit 1 ;;
          esac
          # Headroom for the path length limit. It is a safety limit so that RUNNER_TEMP + the staging folder + prompts/agent-priming.md do not exceed
          # MAX_PATH, not a version format rule.
          if [ "${#TAG}" -gt 64 ]; then echo "FAIL — the tag is longer than 64 characters (${#TAG})"; exit 1; fi
          echo "PASS — tag name is usable as a path/file name"

      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          persist-credentials: false

      # Recorded right after checkout, **before** even one line of third-party code runs. This value crosses over to the publish job
      # and becomes the reference for deciding "does the remote tag still point at this commit at that time".
      # Why HEAD is read: checkout checks out github.sha, but for an annotated tag that value can be the tag
      # object, and what actually gets compiled is always the peeled commit. Reading it here removes that ambiguity.
      - name: Record the commit that is actually being built
        id: built
        shell: bash
        run: |
          sha=$(git rev-parse HEAD)
          if [ -z "$sha" ]; then echo "FAIL — git rev-parse HEAD came back empty"; exit 1; fi
          echo "commit=$sha" >> "$GITHUB_OUTPUT"
          echo "built commit = $sha"

      # ★It only verifies — it never rewrites the version fields★ (user decision).
      # Writing the version in during the build breaks the correspondence between the repo contents and the shipped artifact, so even checking out that tag later
      # cannot reproduce what shipped. A person first makes the commit that raises the version, and puts the tag on that commit.
      # It sits before the expensive build — if it trips here, it ends in a few seconds.
      #
      # ── What it checks (6 items) ──
      #   1. src-tauri/tauri.conf.json — the Tauri product version. If present in the config, this value wins.
      #   2. src-tauri/Cargo.toml — ★it is **the fallback when tauri.conf.json has no version**, so it is
      #      load-bearing in itself★. Measured (tauri-utils 2.9.3 `src/config.rs` `Config::version` docs):
      #      "a semver version number or a path to a `package.json` file … If removed the version number
      #      from `Cargo.toml` is used." → the implicit fallback is Cargo.toml. Do not see this as a duplicate of 1
      #      and delete it — the moment 1 is deleted, this becomes the product version.
      #   3. crates/engram-dashboard-daemon/Cargo.toml — the crate that produces daemon.exe.
      #      The code actually reads it: agent_conn.rs puts it into the hello event via env!("CARGO_PKG_VERSION") and
      #      sends it → if it diverges, a false version goes out to agents.
      #   4. crates/engram-dashboard-cli/Cargo.toml — the package that produces engram.exe (ADR-0285). The code does not read the version
      #      now, but it has a stand-alone shipped artifact, so it does not fall under the library criterion of 「deliberately left out」 below — it prevents a false version
      #      once something like `engram --version` appears later.
      #      ★If it is missed, it only shows up after the tag is pushed, and that tag is thrown away★ — this step runs only on tags.
      #   5. package.json — ★it does not reach the artifact★. It is imported nowhere, and Tauri reads it only when
      #      tauri.conf.json's version **names a package.json path string explicitly** (the measured quote above).
      #      It is still checked not for the shipping path but for self-description consistency — if the repo root calls itself a different version,
      #      people get the wrong answer. This is not a shipping defect but a documentation defect, so its grade differs.
      #   6. package-lock.json (only the root `version`) — the mirror value npm copies from package.json.
      #      The consistency check of `npm ci` looks only at dependency specs, not at this field → if only the version is raised and install is
      #      not run, it quietly stays diverged. Only the root key is asserted (2-space indent = root, structurally unique).
      #      There is one more copy, packages[""].version, but it is not checked separately — npm always writes the two together, so
      #      the real-world drift is "the lock was not updated at all", and the root assertion catches that as is.
      # ── Deliberately left out ──
      #   - The crate versions of the library crates (agent·base·command·messaging·net·platform·protocol·transport): internal semver with no stand-alone
      #     shipped artifact. Statically linked and invisible to users. From the first non-0.1.0 tag they diverge from the product version, and
      #     that is the intended result.
      #   - PROTOCOL_VERSION (protocol crate, currently 3): a wire contract version, so it moves when the contract changes, not
      #     on a release. Tying it to the release version loses its meaning.
      #   - Cargo.lock: not needed here. If only the version is raised and the lock is not updated, the backend job's `--locked`
      #     dies first, and release-build needs that job, so it never even starts.
      - name: 'Gate: product versions match the tag'
        shell: bash
        run: |
          expected="${TAG#v}"
          echo "expected product version = $expected  (from tag $TAG)"
          fail=0
          # Read only the version inside the [package] section — so it is not mixed up with the version of dependency tables.
          cargo_version() {
            awk '
              /^[[:space:]]*\[/ { inpkg = ($0 ~ /^[[:space:]]*\[package\][[:space:]]*$/); next }
              inpkg && match($0, /^[[:space:]]*version[[:space:]]*=[[:space:]]*"[^"]+"/) {
                s = substr($0, RSTART, RLENGTH); sub(/^[^"]*"/, "", s); sub(/".*$/, "", s); print s; exit
              }
            ' "$1"
          }
          # Anchor at a 2-space indent = a top-level JSON key. In package-lock.json `"version"` appears many
          # times (packages[""] · every dependency), but only the root is at 2 spaces, so this anchor picks exactly one.
          # Loosening the anchor to `[[:space:]]*` would pick a dependency version and assert a wrong value.
          json_root_version() {
            sed -nE 's/^  "version"[[:space:]]*:[[:space:]]*"([^"]+)".*/\1/p' "$1" | head -1
          }
          check() {
            if [ ! -f "$1" ]; then echo "  FAIL $1 — the file is missing (did the path change?)"; fail=1; return; fi
            if [ -z "$2" ]; then echo "  FAIL $1 — could not read the version field (did the format change?)"; fail=1; return; fi
            if [ "$2" != "$expected" ]; then echo "  FAIL $1 — expected '$expected', found '$2'"; fail=1; return; fi
            echo "  OK   $1 — $2"
          }
          check src-tauri/tauri.conf.json                  "$(json_root_version src-tauri/tauri.conf.json)"
          check src-tauri/Cargo.toml                      "$(cargo_version     src-tauri/Cargo.toml)"
          check crates/engram-dashboard-daemon/Cargo.toml "$(cargo_version     crates/engram-dashboard-daemon/Cargo.toml)"
          check crates/engram-dashboard-cli/Cargo.toml    "$(cargo_version     crates/engram-dashboard-cli/Cargo.toml)"
          check package.json                              "$(json_root_version package.json)"
          check package-lock.json                         "$(json_root_version package-lock.json)"
          if [ "$fail" -ne 0 ]; then
            echo "FAIL — the version the tag states differs from the version the product will report."
            echo "  CI does not rewrite versions (keeps repo contents ↔ shipped artifact in correspondence). Make a commit that raises the"
            echo "  version of the files that FAILed above to '$expected', put the tag on that commit and run again."
            exit 1
          fi
          echo "PASS — all 6 product version declarations are $expected"

      - name: Resolve and assert pinned toolchain
        shell: bash
        run: |
          rustc --version
          cargo --version
          expected=$(sed -nE 's/^[[:space:]]*channel[[:space:]]*=[[:space:]]*"([^"]+)".*/\1/p' rust-toolchain.toml)
          if [ -z "$expected" ]; then echo "FAIL — could not read channel from rust-toolchain.toml"; exit 1; fi
          actual=$(rustc --version | awk '{print $2}')
          if [ "$actual" != "$expected" ]; then
            echo "FAIL — pinned '$expected' but active rustc is '$actual'"
            exit 1
          fi
          echo "PASS — toolchain $actual matches rust-toolchain.toml"

      # Called by stage (0) of build-release.ps1 (third-party notice generation). It is only downloaded and unpacked here, not run.
      # The same body as the gates job's step of the same name — change one, change both (the pinned values are in the top-level env).
      # ADR-0294
      - name: Install cargo-about (pinned, checksum-verified)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $ver = $env:PIN_CARGO_ABOUT_VERSION
          $sha = $env:PIN_CARGO_ABOUT_SHA256
          $url = "https://github.com/EmbarkStudios/cargo-about/releases/download/$ver/cargo-about-$ver-x86_64-pc-windows-msvc.tar.gz"
          $archive = "$env:RUNNER_TEMP\cargo-about.tar.gz"
          Invoke-WebRequest -Uri $url -OutFile $archive
          $actual = (Get-FileHash -Algorithm SHA256 -Path $archive).Hash.ToLower()
          if ($actual -ne $sha) { throw "cargo-about archive checksum mismatch: expected $sha, got $actual" }
          $dest = "$env:RUNNER_TEMP\cargo-about"
          New-Item -ItemType Directory -Force -Path $dest | Out-Null
          # Pick the Windows built-in bsdtar by path — if the GNU tar (Git) on PATH gets picked, it reads `D:\…` as a remote host and fails.
          & "$env:SystemRoot\System32\tar.exe" -xzf $archive -C $dest
          if ($LASTEXITCODE -ne 0) { throw "tar exited $LASTEXITCODE" }
          $exe = Get-ChildItem $dest -Recurse -Filter cargo-about.exe | Select-Object -First 1
          if (-not $exe) { throw "cargo-about.exe not found in the extracted archive" }
          # GITHUB_PATH is prepended to the existing PATH, so this one wins even if the runner has another cargo-about. The version assertion is done by the generator.
          $exe.DirectoryName | Out-File -FilePath $env:GITHUB_PATH -Append -Encoding utf8

      # ★rust-cache is deliberately not used★ — nothing of the compile artifacts (target/) is restored, and it bakes
      # cold every time. A cache pays off in lanes that run often like the verification jobs, and in this job that runs once per tag
      # the cost of people being unable to rule out "did a restored object get mixed into the shipped binary" outweighs
      # the savings.
      # ★But setup-node's `cache: npm` below is on — that is different in nature from a target/ cache.★
      # What it restores is only `~/.npm` (the package tarball cache), not node_modules. `npm ci` deletes node_modules
      # wholesale and verifies tarballs with the integrity hashes of package-lock.json, so if something from the cache
      # differs from the lockfile, the install fails. That is, the "cold" claim is limited to the compile artifact axis.

      # build-release.ps1 calls `npm run tauri -- build --no-bundle`, and that tauri build
      # bakes the frontend through tauri.conf.json's beforeBuildCommand (`npm run build`) → node_modules
      # must exist (@tauri-apps/cli · vite · tsc all come from it). The notice generator of the earlier stage (0) also
      # calls generate-license-file in node_modules and reads the production dependency list.
      # ※From here on is the section where third-party code runs — the gates · commit record above all finished before this.
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
          cache: npm

      - name: npm ci
        shell: bash
        run: npm ci

      # ★No separate `npm run build` step★ — it would bake the frontend twice, and worse, leave the misunderstanding that "dist/
      # is made by this step". In reality tauri build bakes it directly through beforeBuildCommand and
      # embeds that output in the exe (that is what makes it a production context), and the script catches the absence of
      # dist/index.html right after as a tripwire. The one that bakes it is the tauri CLI.
      #
      # The invocation is the same as launch\빌드.bat (-NoProfile -File + an absolute -OutDir). Why it is launched as a child process rather than
      # called with `&` in the same session: the script reports failure with `exit 1`, and in a same-session
      # call that remains only in $LASTEXITCODE and could slip through. In a child process the exit code is the
      # process exit code. $ErrorActionPreference does not catch native exit codes, so there is an explicit check too.
      #
      # Why -OutDir is given: the staging folder name becomes the zip's root folder name. Staging into a folder with the version in its name
      # means that when users unzip it, the 3 exes + prompts/ land together in one folder
      # (= ADR-0100 co-location does not break in the user's hands).
      - name: Package portable release (scripts/build-release.ps1)
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = Join-Path $env:RUNNER_TEMP "engram-dashboard-${env:TAG}"
          & pwsh -NoProfile -File "scripts/build-release.ps1" -OutDir $stage
          if ($LASTEXITCODE -ne 0) { throw "build-release.ps1 exited $LASTEXITCODE" }
          if (-not (Test-Path $stage)) { throw "staging folder is missing: $stage" }
          "STAGE_DIR=$stage" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8

      # The version goes into the file name (the tag as is). On the release page, one must tell the version from the asset alone.
      # The name is made only once here and passed to the publish job as a job output — if each side assembled it,
      # the rule would live in two places and diverge.
      - name: Zip the packaged folder
        id: zip
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $artifactName = "engram-dashboard-${env:TAG}-windows-x64"
          $zipName = "$artifactName.zip"
          $zip = Join-Path $env:RUNNER_TEMP $zipName
          # Giving -Path the folder itself without a wildcard makes that folder the zip's root entry.
          Compress-Archive -Path $env:STAGE_DIR -DestinationPath $zip -CompressionLevel Optimal
          "ZIP_PATH=$zip" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # upload-artifact interprets the path as a glob. Backslashes are treated as separators on Windows, but
          # there is no reason to stake whether a 90-minute build is recovered on that judgment, so that step gets the slash form separately.
          "ZIP_PATH_POSIX=$($zip -replace '\\', '/')" | Out-File -FilePath $env:GITHUB_ENV -Append -Encoding utf8
          # Used only by upload-artifact in the same job (does not cross the trust boundary). The publish job does not receive this value and
          # builds it itself from TAG with the same rule — if the two diverge, download-artifact cannot find the artifact
          # and dies loudly (a tripwire instead of a quiet drift).
          "artifact_name=$artifactName" | Out-File -FilePath $env:GITHUB_OUTPUT -Append -Encoding utf8

      # The manifest itself (missing/extra/co-location) is already checked by build-release.ps1's tripwire — it is not
      # counted again here. This gate takes the one boundary after that: **did the compression carry that set over as is.**
      # It reads the expected value from the staging folder rather than writing it in the YAML for the same reason (the single source is the script's manifest).
      # Expand-Archive dies on a corrupt zip, so the archive's readability is checked along the way.
      - name: 'Gate: the zip carries exactly the packaged file set'
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          $stage = $env:STAGE_DIR
          $zip   = $env:ZIP_PATH
          if (-not (Test-Path $zip)) { throw "the zip was not created: $zip" }
          $expected = @(Get-ChildItem -Recurse -File -Force -Path $stage |
            ForEach-Object { $_.FullName.Substring($stage.Length + 1) } | Sort-Object)
          # Blocks "quietly shipping something empty". By the script's tripwire this should be unreachable, but on the day that assumption
          # breaks, an empty zip attached to a release is the worst case, so it is blocked once more here.
          if ($expected.Count -eq 0) { throw "the staging folder is empty — nothing to ship: $stage" }
          $verifyRoot = Join-Path $env:RUNNER_TEMP 'zip-verify'
          if (Test-Path $verifyRoot) { Remove-Item -Recurse -Force $verifyRoot }
          Expand-Archive -Path $zip -DestinationPath $verifyRoot
          $rootName = Split-Path -Leaf $stage
          $unpacked = Join-Path $verifyRoot $rootName
          if (-not (Test-Path $unpacked)) { throw "the zip root folder is not '$rootName'" }
          $actual = @(Get-ChildItem -Recurse -File -Force -Path $unpacked |
            ForEach-Object { $_.FullName.Substring($unpacked.Length + 1) } | Sort-Object)
          # -cne (case-sensitive) — PowerShell's default comparison ignores case, so it would let through a case where the name was
          # compressed with its case changed. A case change is a sign that something rewrote the name, so it must be caught.
          if (($expected -join '|') -cne ($actual -join '|')) {
            Write-Host 'expected:'; $expected | ForEach-Object { Write-Host "  $_" }
            Write-Host 'actual:';   $actual   | ForEach-Object { Write-Host "  $_" }
            throw 'the zip contents differ from the staging folder — blocking a partial shipment'
          }
          Write-Host "PASS — $($actual.Count) file(s) under $rootName/"
          $actual | ForEach-Object { Write-Host "  $_" }

      # Uploads the verified zip as an artifact. This is the **only** channel to the publish job (the runners differ, so
      # files do not cross over by themselves). As a bonus it is also a recovery lane — even if publishing fails, the 90-minute build
      # is not thrown away wholesale, and a person can download it and attach it by hand.
      # `overwrite: true` — when it runs again in the same run via "Re-run all jobs", the previous attempt's artifact remains, so
      #   with the default (false) it dies at the last step. It is a regenerated artifact of the same run · same tag, so replacing it is the right meaning.
      # `if-no-files-found: error` — if the path is empty, it does not quietly warn and move on.
      # `archive` uses the default (wrapping in a zip) as is — that makes download-artifact unpack it by itself and
      #   lay down the single `<zip_name>` file as is, the most proven combination.
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: ${{ steps.zip.outputs.artifact_name }}
          path: ${{ env.ZIP_PATH_POSIX }}
          if-no-files-found: error
          overwrite: true

  # ── Release publish — the only job holding a write token ──────────────────────────────────
  # No third-party code runs here: npm · cargo · build-release.ps1 are all forbidden. The steps are only three:
  # ① the tag↔commit gate ② the artifact download ③ gh release create — do not add more.
  # Why the gate sits **before** the download: the gate needs no artifact (it looks only at gh api + env).
  #   Reversing the order would make the write-token job unpack the archive the build job made before deciding
  #   "may it be published". It is an order dependency that can be removed for free, so it is removed.
  # Why ubuntu-latest: nothing here needs Windows (it just moves bytes and calls gh).
  #   It boots fast and the surface of the token-holding job shrinks by that much. If Windows-only work appears, move it then.
  #
  # ★What this workflow **cannot prevent** (to the next reader: this is the boundary)★
  #   1. Artifact integrity. The job split only prevents **write token theft**; it cannot stop a compromised build dependency from putting a trojan
  #      binary into the zip. Then this job faithfully publishes it.
  #      Reproducible builds · code signing · dependency audits are outside this workflow's scope.
  #   2. Build provenance attestation (actions/attest-build-provenance) is not adopted — see the publish step comment below.
  #   3. The TOCTOU between the gate below and `gh release create` (about 1 second). It only narrowed the window from 90 minutes to 1 second,
  #      it did not remove it. It cannot be narrowed further with this tool combination.
  #   4. No publish retry (non-idempotent). Intentional — a loud failure is better than a quiet overwrite.
  release-publish:
    name: release publish (GitHub Release)
    if: github.ref_type == 'tag' && startsWith(github.ref_name, 'v') && !contains(github.ref_name, '/')
    needs: release-build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    # The top-level contents: read is not widened; only this job gets write (job-level replaces the top level rather than
    # inheriting it) — the minimum permission needed to create a release and upload assets. This is the only write token in the workflow.
    permissions:
      contents: write
    # Separate from the workflow-level group, this job has its own group (cancel-in-progress: false) — it serializes two runs aimed at the same tag
    # so they cannot create a release at the same time. The workflow group is `CI-<github.ref>`, and
    # github.ref always starts with `refs/`, so it can never equal `CI-release-publish-<github.ref>` for any
    # ref. It is not put on the build job — the irreversible side effects are only here.
    concurrency:
      group: ${{ github.workflow }}-release-publish-${{ github.ref }}
      cancel-in-progress: false
    env:
      TAG: ${{ github.ref_name }}
      # ★The name is made here, not received from the build job★ — if a string the build job controls goes into a `gh` file argument of the write-token job,
      # a name holding a glob + matching files could lure it into uploading other/multiple assets.
      # github.ref_name cannot be touched by the build job. The rule must match release-build's zip step, and
      # if they diverge, download-artifact below cannot find the artifact and dies (a tripwire instead of a quiet drift).
      ARTIFACT_NAME: engram-dashboard-${{ github.ref_name }}-windows-x64
      BUILT_COMMIT: ${{ needs.release-build.outputs.built_commit }}
      # A run context value (GitHub stamps it when the run is created). Used in (3) of the gate below.
      RUN_SHA: ${{ github.sha }}
    steps:
      # ★What this gate actually guards: "did the tag move while the build was running"★
      # There is a window of nearly 90 minutes between checkout and publishing, and in it the common recovery for "the tag was put on the wrong commit"
      # (delete the tag, then push again) can happen. Then the release points at commit B, but the asset is something built from
      # commit A. There is no place other than here that checks this. It is a valuable, real-world accident.
      #
      # ★What this gate **cannot** guard — artifact integrity★ (stated explicitly to prevent misunderstanding)
      #   - BUILT_COMMIT only testifies to **HEAD before the build**, not to the packaged tree. Even if an npm lifecycle
      #     script changes the source before packaging, this gate passes everything.
      #   - Both references (the remote tag · github.sha) **can be read inside the build job too**. There is no information asymmetry, so
      #     a compromised build job's best lie — "honestly report the real tag commit and swap only the bytes" —
      #     passes both checks. This gate is not a basis for trust but an accident detector.
      #   - The signal the github.sha comparison in (3) below adds is **only one combined case**: the tag moved and
      #     at the same time the build job lied to match the new tag commit. It is not an independent second verification.
      # It does not attempt recovery — moving or reattaching the tag is for a person to decide.
      - name: 'Gate: the remote tag still points at the commit that was built'
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$BUILT_COMMIT" ]; then echo "FAIL — the build job did not pass the commit SHA"; exit 1; fi
          # (1) Resolve the remote tag as of this very moment. For a lightweight tag the object is the commit; for an annotated one it is a tag
          #     object, so resolve once more (peel). If both APIs fail, the assignment dies and the step fails.
          line=$(gh api "repos/$GITHUB_REPOSITORY/git/ref/tags/$TAG" --jq '.object.type + " " + .object.sha')
          obj_type=${line%% *}
          obj_sha=${line##* }
          case "$obj_type" in
            commit) remote_commit="$obj_sha" ;;
            tag)
              line2=$(gh api "repos/$GITHUB_REPOSITORY/git/tags/$obj_sha" --jq '.object.type + " " + .object.sha')
              t2=${line2%% *}
              s2=${line2##* }
              if [ "$t2" != "commit" ]; then echo "FAIL — the annotated tag does not point at a commit (type=$t2)"; exit 1; fi
              remote_commit="$s2"
              ;;
            *) echo "FAIL — unexpected tag object type: '$obj_type'"; exit 1 ;;
          esac
          echo "tag $TAG -> $obj_type $obj_sha -> commit $remote_commit"
          echo "built commit (release-build) = $BUILT_COMMIT"
          # (2) The main gate — did the tag move after the build.
          if [ "$remote_commit" != "$BUILT_COMMIT" ]; then
            echo "FAIL — the tag was moved to another commit after the build. This asset is not that tag's artifact."
            echo "  built   : $BUILT_COMMIT"
            echo "  tag now : $remote_commit"
            echo "  No automatic recovery. Move the tag back to the original commit, or put a new version tag on the right commit"
            echo "  and run again from the start."
            exit 1
          fi
          # (3) Combined-case detection (see the comment above — not an independent verification). For a lightweight tag github.sha equals the commit,
          #     and for an annotated one it can be the tag object, so both forms are accepted — which one it is cannot be settled
          #     before actually pushing a tag (an unverified point).
          if [ "$RUN_SHA" != "$BUILT_COMMIT" ] && [ "$RUN_SHA" != "$obj_sha" ]; then
            echo "FAIL — the commit the build job reported does not connect to this run's ref value."
            echo "  github.sha : $RUN_SHA"
            echo "  built      : $BUILT_COMMIT"
            echo "  tag object : $obj_sha"
            exit 1
          fi
          echo "PASS — the remote tag still points at the built commit"

      # The name uses only ARTIFACT_NAME from the env above (= derived from TAG). If the build job uploaded under another name, it cannot find it
      # here and dies — that is the intended tripwire.
      - uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: dist-release

      # No new third-party action is brought in — the gh CLI comes preinstalled on GitHub-hosted runner images, so
      # adding a release action for uploading only adds one more thing to pin (supply chain surface).
      # --verify-tag: if the remote does not have that tag, it fails without creating the release.
      # If a release for the same tag already exists, gh fails — dying loudly is chosen over a quiet overwrite
      # (non-idempotent. If a retry is needed, a person decides, deletes it and runs again).
      #
      # ★provenance attestation (actions/attest-build-provenance) was deliberately not added★
      # What it closes is "did this file come from this repo's CI", not "were the build dependencies clean", so
      # it does not close the artifact integrity gap written above. Meanwhile the placement where it pays off (the build job) would need
      # id-token: write + attestations: write given to the very job where third-party code runs, which directly reverses the reason this workflow
      # split the jobs in two. So it is not added — instead that gap is stated in the job header above.
      - name: Create the GitHub Release and attach the zip
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          zip_name="${ARTIFACT_NAME}.zip"
          expected="dist-release/$zip_name"
          # What was downloaded must be **exactly one file** and its name must equal the expected one exactly.
          # Why the count is checked first: a case where a file with the expected name came along with extra files cannot be caught
          # by the name check alone. If there are several, a person has to decide again what to upload, so it stops here.
          n=$(find dist-release -type f | wc -l | tr -d '[:space:]')
          if [ "$n" -ne 1 ]; then
            echo "FAIL — the download is not exactly 1 file (n=$n). Received:"
            find dist-release
            exit 1
          fi
          got=$(find dist-release -type f)
          if [ "$got" != "$expected" ]; then
            echo "FAIL — the downloaded file name differs from the expected one"
            echo "  expected: $expected"
            echo "  found   : $got"
            exit 1
          fi
          # The prerelease decision is made by the tag alone (no new setting is created). In semver the prerelease marker is
          # the hyphen **before** the build metadata (+) → v1.0.0-rc1 is a prerelease, v1.0.0+build5 is not.
          # Without this, gh would publish an rc tag as a full release and GitHub would mark it Latest
          # (it becomes the default download, and undoing it needs a person to fix it in the UI — a rerun does not fix it).
          core="${TAG#v}"
          core="${core%%+*}"
          gh_extra=()
          case "$core" in
            *-*) gh_extra+=(--prerelease); echo "prerelease tag ($TAG) -> --prerelease" ;;
            *)   echo "stable tag ($TAG) -> GitHub marks it Latest" ;;
          esac
          gh release create "$TAG" "$expected" \
            --repo "$GITHUB_REPOSITORY" \
            --title "$TAG" \
            --verify-tag \
            --generate-notes \
            "${gh_extra[@]}"
          echo "PASS — released $TAG"
