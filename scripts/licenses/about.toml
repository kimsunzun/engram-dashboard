# cargo-about config — extracts the Rust part of THIRD_PARTY_LICENSES.txt. Caller = scripts/gen-third-party-licenses.mjs
#   (it passes this file with `-c` — no about.toml is placed in the workspace root).

# The only distribution is Windows — do not put dependencies pulled in only on other OSes into the notices.
targets = ["x86_64-pc-windows-msvc"]
# Dependencies not linked into the distributed binary. A proc-macro is a regular dependency, not a build dependency, so it stays as is.
ignore-build-dependencies = true
ignore-dev-dependencies = true
# chrono puts the full texts of MIT and Apache-2.0 in one file, LICENSE.txt, so as is cargo-about cannot find the text and substitutes the standard text
#   instead. A built-in workaround splits that file into the two licenses (measured on 0.9.2 — if the section checksums don't match, the workaround drops out and
#   the file correction in the generation script takes over).
workarounds = ["chrono"]

# This is the allow list and also the priority order — when a choice is possible, as in `MIT OR Apache-2.0`, pick the earlier one (MIT is put first because
#   choosing Apache-2.0 attaches an obligation to ship that crate's NOTICE).
# The generation script reads this list too — Rust's OR-alternative picking and the npm package allow decision use the same list.
# If a crate with a license outside the list enters the graph, cargo about fails (regardless of `--fail`).
# ★Do not add GPL · LGPL · AGPL here★ — whether to accept them is the user's decision. If it fails, report the path that dragged that crate in first
#   (`cargo tree -i <crate> -e normal --target x86_64-pc-windows-msvc`).
# MPL-2.0 (file-level weak copyleft) was added because the distribution graph requires it — option-ext (dirs-sys → dirs → tauri) ·
#   cssparser · cssparser-macros · selectors · dtoa-short (dom_query → tauri-utils). On the npm side lightningcss passes through the same entry
#   (a build tool — package.json puts @tailwindcss/vite in dependencies, so it is caught as an operational dependency). Measured 2026-10-15.
accepted = [
    "MIT",
    "Apache-2.0",
    "Apache-2.0 WITH LLVM-exception",
    "BSD-2-Clause",
    "BSD-3-Clause",
    "ISC",
    "Zlib",
    "Unicode-3.0",
    "BSL-1.0",
    "0BSD",
    "MIT-0",
    "CC0-1.0",
    "Unlicense",
    "MPL-2.0",
]
